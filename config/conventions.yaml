# ------------------------------------------------------------- vedha geometry
# Recorded, NOT used. The class that selects the branch is now available for
# Mercury, Venus and Mars, and the layer still cannot supply spans of it because
# it emits no speed-crossing series -- see open_questions.speed_class_thresholds.
#
# THE DIRECTION RULE. Across the thirteen per-planet Nakshtra Vedh tables
# (B131-B141 plus the two Moon tables B129-B130), every printed row fills exactly
# one of three direction cells, and the cell follows the printed Speed column:
#
#     Atichari / Fast  -> Left cell
#     Normal           -> Front cell
#     Retrograde       -> Right cell
#
# Counted over all 111 directional rows: 109 agree, 2 do not -- and the split is
# PER PLANET, which the first report of "109/111" buried:
#
#     Mars (B132)     21/21     Mercury (B133)  45/45
#     Venus (B134)    30/30     Jupiter (B135)   7/7
#     Saturn (B136)    6/8      <-- the only planet with a mismatch
#
# So the rule holds without exception on every planet whose speed class is
# defined, and BOTH exceptions are Saturn rows. The relationship is still
# reported as a correlation at 109/111 rather than a derivation, because two
# printed rows do contradict the rule; but the counterexamples are confined to
# the one planet that also has no speed threshold, and that is a materially
# different statement from "the source contradicts itself somewhere".
#
# WHAT THE TWO B136 ROWS ACTUALLY SAY. Re-derived from the 28-name wheel rather
# than asserted:
#     Uttara Bhadrapada  Atichari  Right -> Ardra       (offset +7)
#     Revati             Atichari  Right -> Mrigsira   (offset +5)
# The Normal rows of the same table use offset +14 for both nakshatras and the
# Retrograde rows use +19 and +21, so each class has a consistent offset there
# EXCEPT Atichari, whose two rows use different offsets (+7 and +5) and sit in
# the Right cell when the class->cell rule says Left. The B124 speed table
# prints Fast/Left for 26-Jan to 30-May, the same window. Saturn is therefore
# anomalous in the direction table as well as in the threshold fit -- which is
# the expected signature of a slow-planet doctrine, not of a rule that failed.
#
# THE TARGETS ARE A LOOKUP, NOT A FORMULA. For each table, the target nakshatra
# in a given cell is a function of the planet's OWN nakshatra and nothing else:
# across all 12 tables that carry directional cells, one own-nakshatra maps to
# two different targets in the same cell in exactly 2 cases, both in B136 and
# both in the Saturn row set just described. No constant offset reproduces the
# tables: in the 28-name scheme the Front offset ranges over 8,10,12,14,16,18,20
# and the Left offset over 1,3,5,7,9,11,13 within B132 alone, so the wheel is a
# table to be transcribed and not an arithmetic expression to be evaluated.
vedha_direction:
  #: THE HONEST HEADLINE IS THE CORRELATION, not the domain-restricted figure.
  #: Saturn is unresolved, so the rule cannot be stated as a derivation yet.
  direction_follows_speed_class: correlation_109_of_111
  #: Restricted to planets whose class does NOT rest on a single-point fit.
  #: Mercury 45/45 and Jupiter 7/7. Mars 21/21 and Venus 30/30 scored perfectly
  #: too and are EXCLUDED, because their classes were derived from thresholds
  #: that fit by construction and so are not independent confirmations.
  direction_within_honest_domain: 52_of_52
  domain_definition: >-
    Planets whose speed class rests on a threshold CONSTRAINED BY MORE THAN ONE
    CROSSING -- which is Mercury alone among the calibrated three (six crossings)
    -- plus Jupiter, whose own table is 7/7 and self-consistent even though its
    threshold is undetermined. Mars and Venus are excluded: each crosses its
    level exactly once in 2026, so one equation in one unknown. Saturn is
    excluded as unresolved.
  the_earlier_103_of_103: >-
    SUPERSEDED. The previous figure counted Mars and Venus, whose classes came
    from single-point fits. The three independent measurements of the same
    structural fact now agree: crossing count (Mercury 6, Venus 1, Mars 1),
    wheel coverage in the port (Mercury 97%, Mars 43%, Venus 21%), and printed
    row agreement (Mars 20/21). Every one separates Mercury from the other two.
  saturn_is_outside_the_domain_not_a_counterexample: >-
    Saturn's two failures are applications of the rule outside its domain rather
    than counterexamples within it. That is why the overall label stays
    correlation -- they are not explained -- while the 52/52 is worth carrying:
    the rule has no exception where it can be evaluated on evidence at all.
  THE_TEST_THAT_DECIDES: >-
    If the slow-planet doctrine is ever settled and Saturn's class becomes
    computable, Saturn's two rows BECOME testable: the rule either predicts
    their cell or it does not. That is the single test that moves the label from
    correlation to derivation. Until then the label is correlation, and this
    entry names the test rather than leaving it to be rediscovered.
  per_planet:
    Mars:    {section: B132, match: 21, mismatch: 0}
    Mercury: {section: B133, match: 45, mismatch: 0}
    Venus:   {section: B134, match: 30, mismatch: 0}
    Jupiter: {section: B135, match: 7, mismatch: 0}
    Saturn:  {section: B136, match: 6, mismatch: 2}
  exceptions_confined_to: Saturn
  counterexamples:
    - section: B136
      planet: Saturn
      nakshatra: Uttara Bhadrapada
      printed_speed: Atichari
      filled_cell: Right
      expected_cell: Left
      from: 25-Jan-26
      target: Ardra
      target_offset_in_28_scheme: 7
      conflicts_with: "B124, which prints Fast/Left for 26-Jan to 30-May-26"
    - section: B136
      planet: Saturn
      nakshatra: Revati
      printed_speed: Atichari
      filled_cell: Right
      expected_cell: Left
      from: 17-May-26
      target: Mrigashira
      target_offset_in_28_scheme: 5
  same_table_other_classes_are_consistent: >-
    In B136 the Normal rows both use offset +14 and the Retrograde rows use +19
    and +21, so the anomaly is specific to the two Atichari rows, which also
    disagree with each other (+7 and +5) while filling the same cell.
  target_generation: per_planet_lookup_on_own_nakshatra
  constant_offset_rejected: >-
    No single forward offset reproduces any table's cells. In the 28-name scheme
    (Abhijeet inserted after Uttara Ashadha) the Front offset spans
    8,10,12,14,16,18,20 and Left spans 1,3,5,7,9,11,13 within B132 alone.
  usable_when: >-
    Mercury, Venus and Mars only. Saturn's direction data is internally
    inconsistent and Jupiter, though 7/7 on the direction rule, has no threshold,
    so neither can be given a class and the rule cannot be evaluated for them.
  blocked_on: speed_class_thresholds  # for Jupiter and Saturn only

# ------------------------------------------------------------- frame findings
# Findings about a NAME being a property of the FRAME a table is written in
# rather than a property of the sky. Kept together and out of the speed section
# on purpose: the same shape recurs wherever the source tabulates one period two
# ways, and the second instance will not be about speed at all.
frame_findings:
  atichari_is_a_residency_frame_label:
    claim: >-
      "Atichari" is the NAKSHATRA-RESIDENCY frame's label for the period the
      SPEED frame calls "Fast". One period, two framings -- not two names for one
      class, and not two classes.
    evidence:
      - >-
        Every Atichari row in B132, B133 and B134 opens and closes on a
        NAKSHATRA INGRESS. Venus's eleven Atichari rows run 01-Jan, 10-Jan,
        18-Jan, 21-Jan, 31-Jan, 11-Feb, 22-Feb, 04-Mar, 15-Mar, 26-Mar, 06-Apr,
        and the last ends 12-Apr-26 14:22 -- exactly the instant Venus leaves
        Revati. Thirty of thirty rows across the three tables are bounded this
        way, and none is bounded by a speed value.
      - >-
        The speed frame's own table for the same period prints date RANGES whose
        edges are the calibrated threshold crossings, and those edges land on the
        same starts (Venus 13-Apr-26 00:07 for the printed 13-Apr; Mars
        15-Aug-26 00:05 for the printed 15-Aug).
      - >-
        The speed table calls the class "Fast" and the nakshatra table calls the
        same dates "Atichari", including for Mercury where the two tables' ranges
        are identical (28-Jan to 07-Feb, 27-Apr to 31-May, 12-Aug to 08-Sep).
      - >-
        Counter-evidence, recorded because it is the reason this is a frame
        finding and not a clean equation: Mars's table labels fifteen rows
        Atichari for periods the calibrated threshold calls Normal, so the
        residency frame's label and the speed frame's class do not always agree
        for Mars. The two frames are the same CONSTRUCTION; the labels do not
        reduce to one another.
    same_shape_as: dignity.source_witness
    why_it_is_here: >-
      The rashi/navamsa dignity split is the same kind of finding one layer down
      -- the same planet at the same instant carries different labels in D1 and
      D9, and the project emits both under distinct names rather than collapsing
      them. A future reader meeting the next two-frame question should find this
      entry, which is why it is not a line inside the speed section.
    how_carried: >-
      The Vedha port keys its wheel on the residency frame's label because that
      is the key its own table printed, and carries the computed class separately
      on every row as `class`, with `target_unavailable_because` naming the
      frame mismatch wherever the two disagree.

# ---------------------------------------------------------------- speed classes
# RESOLVED 14-Sep-2026 by crossing-instant calibration. See
# open_questions.speed_class_thresholds for the method and the correction that
# produced it. The thresholds are ABSOLUTE and planet-specific, and the class at
# an instant is:
#
#     Retrograde  when speed < 0
#     Fast        when speed >= threshold      (Atichari in the nakshatra tables)
#     Normal      otherwise
#
# NOT a fraction of the planet's maximum: that reading was tested and rejected,
# because it forces each Fast window's two crossings to be equidistant from the
# speed maximum, and Mars's are not (the rising crossing is 39 days before its
# maximum and the falling one 98 days after).
speed_classes:
  #: PORTED. Mercury's speed oscillates: it crosses its level SIX times in 2026,
  #: so six independent printed boundaries constrain one number. That is
  #: overdetermined, and it held. Mercury is the ONLY planet whose threshold is
  #: overdetermined, and THAT -- not a larger row count -- is what distinguishes
  #: it from Mars and Venus, whose tables have plenty of rows and no second
  #: crossing.
  Mercury: {threshold: 1.744909, interval: [1.743780, 1.746038], precision_days: 0.08, needs_tolerance_days: 1.1, section: B122, crossings_in_2026: 6, status: calibrated_overdetermined}
  #: WITHDRAWN, recorded as SINGLE-POINT FITS and NOT as calibrations. Mars and
  #: Venus each cross their level exactly ONCE in the whole of 2026, so each
  #: solved one equation in one unknown: the interval below is just the speed's
  #: own change across the +/-1 day scoring window, and no other printed row in
  #: the year can falsify it. ZERO DEGREES OF FREEDOM. The thresholds are not
  #: wrong -- each reproduces the one boundary it was fitted to -- but they
  #: cannot be wrong either, and a number that cannot fail is not evidence.
  #: Kept so a later year supplying a second crossing can TEST them rather than
  #: re-derive them.
  Mars:    {threshold: 0.658287, interval: [0.656927, 0.659648], precision_days: 2.00, needs_tolerance_days: 1.0, section: B120, crossings_in_2026: 1, status: withdrawn_single_point_fit, degrees_of_freedom: 0}
  Venus:   {threshold: 1.223981, interval: [1.223368, 1.224595], precision_days: 2.00, needs_tolerance_days: 1.0, section: B123, crossings_in_2026: 1, status: withdrawn_single_point_fit, degrees_of_freedom: 0}
  Jupiter: {threshold: null, reason: "no intersection: the two printed boundaries are 0.013750 apart in threshold space, about 4.8 days of tolerance. An orbital-period result, not a tolerance", section: B121, crossings_in_2026: 0, status: blocked}
  Saturn:  {threshold: null, reason: "no intersection at +/-1 d (0.002594 apart); the sliver that exists at +/-2.2 d is 0.000125 wide, which is not a threshold. Blocked on the slow-planet speed doctrine of B30", section: B124, crossings_in_2026: 0, status: blocked}
  #: THREE INDEPENDENT MEASUREMENTS OF THE SAME STRUCTURAL FACT AGREE, which is
  #: why this withdrawal is structural and not a judgement call:
  #:   crossing count        Mercury 6,  Mars 1,  Venus 1
  #:   wheel coverage        Mercury 97%, Mars 43%, Venus 21%
  #:   printed-row agreement Mercury 45/45, Mars 20/21, Venus 30/30
  #: The third is the one that started as a false claim in this project ("all
  #: fifteen Mars Atichari rows disagree"); the correct figure is 20 of 21, and
  #: the single disagreement is the boundary day itself.
  independent_measurements_agree: true
  #: The astronomy series still emits crossings for Mars and Venus, because the
  #: crossing is a fact about the sky and removing it would lose a measurement.
  #: What changed is the GRADE each record carries. A level with zero degrees of
  #: freedom cannot support certainty B, so Mars's and Venus's crossings are C --
  #: the grade the project reserves for depending on an undocumented source rule
  #: -- while Mercury's stay B. The `single_point_fit` flag travels with them.
  series_certainty: {Mercury: B, Mars: C, Venus: C}
  #: The tolerance each planet NEEDS is part of the finding, not a knob. Mercury
  #: misses the 1.0-day scoring by 6e-5 deg/day, i.e. by 1.8 days -- so an
  #: earlier sweep at +/-1.0 d was correct to report "5/6" and wrong to conclude
  #: that no threshold exists.
  retrograde_rule: "speed < 0; reproduces the source's stations to the day"
  slow_planet_doctrine:
    section: B30
    title: "Demoted and Shadow Speed of Saturn"
    defines: >-
      A LONGITUDE band, not a speed. Saturn is in Demoted or Shadow Speed from
      11-Dec-2026 until it crosses back over 20 deg 31' of Pisces direct on
      15-Mar-2027; the interval runs from its retrograde crossing of that
      longitude to the direct crossing of the same longitude.
    verified: >-
      The engine puts Saturn at 20.508963 deg of Pisces on 27-Jul-2026 and
      20.507990 deg on 15-Mar-2027, both 20 deg 31' to the arcminute as the
      table prints, and at 13.694991 deg (13 deg 42') on 11-Dec-2026, which is
      the Direct row's printed value.
    supplies_a_speed_threshold: false
    therefore: >-
      Jupiter and Saturn stay blocked, and the missing input is a slow-planet
      speed doctrine -- not a failed absolute threshold.

# ---------------------------------------------------------------- dignity
# SOURCE-VALIDATED. Re-derived from data/source_2026.html (437578 bytes,
# md5 5e098446d6dd13d3df8443528db5dd95) by sweeping every table cell in the
# document for a parenthetical dignity word. Provenance is no longer owner
# assertion: every label below is quoted from a named section.
#
# The labels the source actually prints, with the section each was read from:
#   Mars     "Capricorn (Exalted)"          Journey of Mars p.5
#            "Aries (Own, Trine)"           Journey of Mars p.5
#            "Cancer (Debilitated)"         Journey of Mars p.5
#            "Scorpio (Own)"                Mars Combust Rise Cycle p.6
#   Mercury  "Gemini (Own)"                 Journey of Mercury p.8
#            "Virgo (Own, Trine, Exalted)"  Journey of Mercury p.8
#            "Pisces (Debilitated)"         Journey of Mercury p.8
#   Venus    "Taurus (Own)"                 Journey of Venus p.12-13
#            "Libra (Own, Trine)"           Journey of Venus p.12-13
#            "Pisces (Exalted)"             Journey of Venus p.12-13
#            "Virgo (Debilitated)"          Journey of Venus p.12-13
#   Jupiter  "Cancer (Exalted)"             Journey of Jupiter p.18-19
#            "Sagittarius (Own, Trine)"     Jupiter in Navmansh (D9) p.22
#            "Pisces (Own)"                 Jupiter in Navmansh (D9) p.22
#            "Capricorn (Debilitated)"      Jupiter in Navmansh (D9) p.22
#   Saturn   "Capricorn (Own)"              Saturn in Navmansh (D9) p.25
#
# No planet/sign pair outside the Parashari table below is labelled anywhere in
# the document, so the source contradicts nothing here and adds nothing here.
# The scheme is still Parashari; what changed is that five of the seven planets
# now have it witnessed rather than assumed. See source_witness below for which.
dignity:
  scheme: parashari_sign_level
  source: parth_2026_labels_source_validated
  signs:
    Sun:     {own: [Leo],                  trine: [Leo],         exalted: Aries,     debilitated: Libra}
    Moon:    {own: [Cancer],               trine: [Taurus],      exalted: Taurus,    debilitated: Scorpio}
    Mars:    {own: [Aries, Scorpio],       trine: [Aries],       exalted: Capricorn, debilitated: Cancer}
    Mercury: {own: [Gemini, Virgo],        trine: [Virgo],       exalted: Virgo,     debilitated: Pisces}
    Jupiter: {own: [Sagittarius, Pisces],  trine: [Sagittarius], exalted: Cancer,    debilitated: Capricorn}
    Venus:   {own: [Taurus, Libra],        trine: [Libra],       exalted: Pisces,    debilitated: Virgo}
    Saturn:  {own: [Capricorn, Aquarius],  trine: [Aquarius],    exalted: Libra,     debilitated: Aries}
  nodes:
    dignity: null
    use_lord_relationship: true
  # Informational only. Exposed as deep_exaltation_deg for later depth-of-
  # exaltation work. NEVER used to decide a dignity label -- dignity is
  # whole-sign, exactly as the source labels it.
  exaltation_degrees:
    Sun: 10
    Moon: 3
    Mars: 28
    Mercury: 15
    Jupiter: 5
    Venus: 27
    Saturn: 20
  # Frame: this omission is a row in the NAVAMSA (D9) table, so the engine
  # checks it against the navamsa sign and flags it as
  # navamsa_dignity_corrects_source_omission. Checked against the rashi sign it
  # could never fire -- Saturn's rashi sign never reaches Libra in 2026 or 2027.
  source_omissions:
    - "Saturn in Libra (exalted) is unlabelled in the 2026 source D9 table"
  # The omission, located exactly. Saturn's D9 row reads a bare "Libra", with
  # no "(Exalted)", while rows in the same table label "Capricorn (Own)" twice
  # -- so the table does carry dignity labels and simply missed this one. The
  # engine emits the label and flags the record with
  # dignity_corrects_source_omission rather than reproducing the gap.
  source_omission_detail:
    Saturn_Libra_D9:
      section: "Saturn in Navmansh (D9) p.25"
      row: "Libra | 21-Mar-26 15:00 | 17-Apr-26 14:57 | Venus"
      frame: navamsa
      rashi_sign_at_the_time: Pisces
      printed_label: null
      correct_label: exalted

  # ------------------------------------------------- what the source witnesses
  # Which of the seven planets' dignities are observed in the 2026 document and
  # which are carried from the Parashari scheme with no direct source evidence.
  # Derived, not asserted: "occupied" means the planet is shown in that sign by
  # a journey, navamsa, motion or combust table somewhere in the document.
  source_witness:
    derived_from: "data/source_2026.html md5 5e098446d6dd13d3df8443528db5dd95"
    witnessed: [Mars, Mercury, Venus, Jupiter, Saturn]
    not_witnessed: [Sun, Moon]
    # What the engine does with the row above, stated here so the list is not
    # merely descriptive. A navamsa_ingress record for a body in
    # `not_witnessed` that carries a non-empty navamsa_dignity is flagged
    # `navamsa_dignity_not_witnessed_in_source`. The value is emitted normally
    # -- it is the same Parashari rule every other body gets -- and the flag
    # carries the provenance with the row, so an audit downstream cannot count
    # it as source-witnessed without contradicting the record in its hand.
    #
    # It became load-bearing on 21-Sep-2026, when the Moon acquired a navamsa
    # ingress series. The engine now prints a D9 dignity for the one body the
    # detail below says has no journey and no navamsa table in the source, and
    # the sentence stays true only because the record says so itself.
    not_witnessed_engine_flag: navamsa_dignity_not_witnessed_in_source
    # ------------------------------------------- which CHART witnessed each row
    # The block above is a single Parashari sign-dignity table, but the labels
    # that confirm it were not all read off the same chart. Three planets were
    # confirmed from rashi (D1) journey tables and two from navamsa (D9) tables,
    # and the two frames give different answers for the same planet at the same
    # instant -- so a reader has to be able to see which frame each row came
    # from rather than assume one. Held to the same standard as `witnessed`
    # above: stated, not left to be inferred from the section names.
    #
    # The frames are measurably distinguishable, not a distinction on paper:
    # Saturn's rashi sign is Pisces for the whole of 2026 ("Saturn remains in
    # Pisces throughout the year", Journey of Saturn p.23), which carries no
    # dignity at all, while Saturn in Navmansh (D9) p.25 prints Capricorn (Own)
    # for 02-Jul-26 05:58 to 20-Aug-26 22:50. Read in the rashi frame that row
    # would be blank. The source is therefore using the D9 sign, unambiguously.
    witness_frame:
      rashi: [Mars, Mercury, Venus]
      navamsa: [Jupiter, Saturn]
      detail:
        Mars:    "rashi (D1) -- Journey of Mars p.5, with Vargottam Mars p.7 as the inconsistent second printing"
        Mercury: "rashi (D1) -- Journey of Mercury p.8"
        Venus:   "rashi (D1) -- Journey of Venus p.12-13"
        Jupiter: "navamsa (D9) -- Jupiter in Navmansh (D9) p.22. Sagittarius (Own, Trine), Capricorn (Debilitated), Pisces (Own), Cancer (Exalted, Vargottam), all against the D9 sign. Jupiter's rashi sign is Cancer from 02-Jun-26 to 31-Oct-26, so the rashi frame would print Exalted for the Sagittarius, Capricorn and Pisces rows alike."
        Saturn:  "navamsa (D9) -- Saturn in Navmansh (D9) p.25, Capricorn (Own), printed twice. Rashi Pisces all year, which is unlabelled, so this row exists only in the D9 frame."
      # One row cannot separate the frames and is recorded as such rather than
      # counted as evidence: Jupiter's Cancer window, 02-Jun-26 01:49 to
      # 18-Jun-26 20:59, is labelled Vargottam precisely because rashi and
      # navamsa agree there. Both frames say Cancer, both say Exalted. The
      # separation comes from Jupiter's other three rows and from Saturn.
      undetermined_by:
        - "Jupiter Cancer D9 02-Jun-26 01:49 to 18-Jun-26 20:59 -- Vargottam, so rashi == navamsa == Cancer and the two frames agree by construction"
      # Consequence for the engine: dignity is emitted per chart and under a
      # distinct name -- `dignity` from `sign` on rashi and positional records,
      # `navamsa_dignity` from `navamsa` on navamsa_ingress records. They are
      # never collapsed into one field, because the block above was assembled
      # from both frames and a single field would silently pick one.
      engine_fields: {rashi: dignity, navamsa: navamsa_dignity}
    detail:
      Mars:    "all four states labelled (Aries own+trine, Scorpio own, Capricorn exalted, Cancer debilitated)"
      Mercury: "all four states labelled (Gemini own, Virgo own+trine+exalted, Pisces debilitated)"
      Venus:   "all four states labelled (Taurus own, Libra own+trine, Pisces exalted, Virgo debilitated)"
      Jupiter: "all four states labelled (Sagittarius own+trine, Pisces own, Cancer exalted, Capricorn debilitated)"
      Saturn:  "own (Capricorn) labelled; exalted (Libra) occupied but UNLABELLED -- the omission above; Aquarius own+trine and Aries debilitated never occupied in 2026, so untested"
      Sun:     "NO dignity label anywhere in the document. Recorded once, in full, under source_findings.sun_never_labelled -- this is one half of a single editorial absence that also covers the Sun's vargottama, not a separate finding. In short: the Sun occupies all twelve signs in Sun Transgression (Sankranti) p.2 -- Aries (exalted), Leo (own+trine) and Libra (debilitated) among them -- and that table carries no dignity column at all."
      Moon:    "NO dignity label, and no opportunity for one: the document gives the Moon no journey or navamsa table, so Cancer, Taurus and Scorpio never appear as Moon positions. Carried from Parashari, untested by the source."
    # Labels the source prints inconsistently for a pair it labels elsewhere.
    # Evidence about the source's reliability, not about the scheme: the engine
    # always emits the full state set.
    internal_inconsistencies:
      - "Mars in Aries: 'Own, Trine' in Journey of Mars p.5, bare 'Own' in Vargottam Mars p.7"
      - "Venus in Libra: 'Own, Trine' in Journey of Venus p.12-13, bare 'Own' in Venus Motion p.14 and Venus Combust Rise Cycle p.14"
      - "Mercury in Virgo: 'Own, Trine, Exalted' in Journey of Mercury p.8, 'Exalted, Trine' (no Own, reordered) in Mars With or Aspecting Mercury"
    # Not dignity. The Constellation (Nakshtra) tables print "(Own)" against a
    # nakshatra LORD -- Jupiter Constellation p.21, Saturn Constellation p.24 --
    # and the journey tables' Relationship column uses Own/Trine as a relation
    # between a body and its dispositor. Neither is a sign dignity and neither
    # feeds this block.
    not_dignity_uses_of_the_same_words: ["nakshatra lordship", "journey Relationship column"]

# ----------------------------------------------------------- vargottama
# D1 sign == D9 sign. A separate state, NOT a dignity and never folded into the
# dignity list: the 2026 source prints the two together -- "Cancer (Exalted,
# Vargottam)" in Jupiter in Navmansh (D9) p.22 -- so they are states a planet
# holds at the same time, not alternatives.
vargottama:
  definition: rashi_sign == navamsa_sign
  scheme: parashari
  # Frames, named the same way the dignity block names them. Vargottama is the
  # only value in the record that is a RELATION between the two charts rather
  # than a reading of one, so both must be read off the same longitude. At an
  # ingress the sampled position can sit either side of the cusp, and a sign
  # cusp is always also a navamsa cusp -- so the engine derives whichever frame
  # it is not overriding from the crossing index instead of from the sample.
  frames: {rashi: sign, navamsa: navamsa}
  engine_field: vargottama
  emitted_on: every_positional_record
  # Not on navamsa_ingress alone: vargottama is a property of a position, not of
  # a D9 boundary crossing, and the source's own Vargottam Mars p.7 windows open
  # at RASHI ingresses (Aries 11-May-26 12:39) as often as at D9 ones.

  # ------------------------------------------------ what the source witnesses
  # Same standard as dignity.source_witness: which planets the document actually
  # shows in a vargottama state, and which are merely computable by the rule.
  source_witness:
    derived_from: "data/source_2026.html md5 5e098446d6dd13d3df8443528db5dd95"
    witnessed: [Mars, Jupiter, Rahu, Ketu, Moon, Mercury, Venus]
    not_witnessed: [Sun, Saturn, Uranus, Neptune, Pluto]
    # Three surfaces, all verified against D1 == D9. The word never appears in
    # any "Journey of X" rashi table.
    surfaces:
      dedicated_section:
        section: "Vargottam Mars p.7 (section 6)"
        planets: [Mars]
        rows: 9
        note: >
          Its own section, not a journey table. Columns Sign / Start / End /
          Sign Lord, with the dignity printed in the same parenthesis --
          "Capricorn (Exalted)", "Aries (Own)", "Cancer (Debilitated)" -- which
          is the clearest evidence that vargottama sits beside a dignity rather
          than replacing it. Remark: "Vargottam Mars is Bullish event (more
          powerful if in its own house)", so own-house is a strength modifier
          and not part of the condition.
      inline_in_d9_tables:
        sections:
          - "Jupiter in Navmansh (D9) p.22 -- Gemini (Retrograde) Vargottam; Gemini (Vargottam); Cancer (Exalted, Vargottam)"
          - "Mars in Pisces Navmansh (D9) p.6 -- Pisces - Vargottam"
          - "Rahu in Navmansh (D9) p.28 -- Aquarius (Vargottam)"
          - "Ketu in Navmansh (D9) p.30 -- Leo (Vargottam)"
        planets: [Jupiter, Mars, Rahu, Ketu]
        rows: 6
      own_nakshatra_appendix:
        section: "Planet Vargottam in Their Own Nakshatra p.133"
        planets: [Moon, Rahu, Mercury, Jupiter, Venus]
        rows: 19
        condition: vargottama AND planet_in_nakshatra_it_rules
        note: >
          A NARROWER set, not a different rule: every row is vargottama and also
          has the planet in a nakshatra it lords (Moon/Rohini, Rahu/Shatabhisha,
          Mercury/Revati, Jupiter/Punarvasu, Venus/Purva Phalguni). The engine
          does not emit this intersection as a state; it is an appendix filter
          over the same boolean. Recorded so a reader does not mistake the
          appendix for the definition.
    detail:
      Mars:    "witnessed, 9 windows, Vargottam Mars p.7, plus the Pisces row in Mars in Pisces Navmansh (D9) p.6"
      Jupiter: "witnessed, 3 windows in Jupiter in Navmansh (D9) p.22 and 2 own-nakshatra rows in the p.133 appendix"
      Rahu:    "witnessed, Aquarius 25-Jan-26 09:39 to 29-Mar-26 07:11, printed in both the D9 table and the appendix"
      Ketu:    "witnessed, Leo, the same window as Rahu and 180 degrees from it"
      Moon:    "witnessed ONLY in the p.133 appendix, 13 rows, all Rohini pada 2. The document gives the Moon no D9 table at all, so the appendix is the only place its vargottama could appear -- the opposite of its dignity, which is witnessed nowhere."
      Mercury: "witnessed ONLY in the p.133 appendix, 1 row, Revati pada 4"
      Venus:   "witnessed ONLY in the p.133 appendix, 1 row, Purva Phalguni pada 1"
      Sun:     "NOT witnessed. Recorded once, in full, under source_findings.sun_never_labelled -- the other half of the same editorial absence as the Sun's dignity, not a separate finding. In short: the Sun is vargottama on 163 of 1460 six-hourly 2026 samples and the document never says so, so the absence is editorial and not an impossibility. Contrast Saturn and the outers immediately below, whose absence IS an impossibility."
      Saturn:  "NOT witnessed, and could not have been: Saturn's rashi sign is Pisces all year while its D9 runs Cancer to Scorpio, so the two never coincide. 0 of 1460 samples. A structural absence, not an omission."
      Uranus:  "NOT witnessed and never vargottama in 2026 (0 samples), despite having its own D9 table"
      Neptune: "NOT witnessed and never vargottama in 2026 (0 samples), despite having its own D9 table"
      Pluto:   "NOT witnessed and never vargottama in 2026 (0 samples), despite having its own D9 table"

  # ------------------------------------------------------- source defects here
  # The appendix prints four end DATES one day late. The end TIMES are right to
  # within two minutes, so this is a date typo and not a different rule --
  # the same class of defect as the 17-Apr-25 year typo recorded elsewhere.
  # Listed so the regression harness can assert the times and not the dates.
  source_defects:
    appendix_p133_end_date_off_by_one_day:
      - "Moon Rohini 2nd 28-Jan-26 15:00 -> printed 29-Jan-26 20:33, computed 28-Jan-26 20:31"
      - "Moon Rohini 2nd 20-Apr-26 09:59 -> printed 21-Apr-26 15:20, computed 20-Apr-26 15:21"
      - "Moon Rohini 2nd 11-Jul-26 16:28 -> printed 12-Jul-26 21:50, computed 11-Jul-26 21:49"
      - "Moon Rohini 2nd 01-Oct-26 11:39 -> printed 02-Oct-26 17:15, computed 01-Oct-26 17:16"
    note: >
      Each printed end is 24 hours plus 1-2 minutes after the true end of the
      Rohini pada-2 window, and the other 15 appendix rows have end times that
      land inside the window. Nine of the thirteen Moon rows are clean.
    # A control was checked alongside the four, so "the source prints the end
    # date one day late" is separated from "the source's day rolls over at a
    # different hour than ours". This row genuinely crosses midnight: the
    # window opens 24-Feb and the pada ends after 00:00 the next day, and the
    # source prints the NEXT date correctly. A convention difference would
    # have moved this row too; it did not, so the defect is confined to the
    # four above.
    control_rows_that_legitimately_cross_midnight:
      rows:
        - "Moon Rohini 2nd 24-Feb-26 20:46 -> printed 25-Feb-26 02:24, computed 25-Feb-26 02:23 -- CORRECT as printed"
        - "Moon Rohini 2nd 28-Oct-26 18:55 -> printed 29-Oct-26 00:20, computed 29-Oct-26 00:18 -- CORRECT as printed"
      why_they_matter: >
        These are the appendix's only other rows whose window genuinely runs
        past midnight, and the source advances the date on both of them
        correctly. That separates "the source typed the end date one day late
        on four rows" from "the source's day rolls over at an hour other than
        midnight". A rollover or epoch convention we had not identified would
        have moved these two as well; it did not, so the defect is editorial
        and confined to the four rows above. Recorded because a defect claimed
        without a control is a convention difference waiting to be discovered
        later.
    verification:
      method: independent_swiss_ephemeris_recomputation
      by: project_owner
      scope: "the four defect rows and the two control rows"
      result: >
        Four confirmed as date typos (end time right to within 2 minutes, end
        date 24 hours late); both controls confirmed correct as printed. The
        engine reproduces the same six windows from the Rohini pada-2 boundary,
        so the finding does not rest on a single recomputation.

  # The document spells the appendix heading three different ways. Recorded so a
  # future sweep on any one spelling does not conclude the section is missing.
  title_spellings:
    body_heading: "Planet Vargottam in Their Own Nakshatra"
    table_of_contents: "Planet Vargottam in their own Nakshtra"
    nav_list: "Planet Vargottam in Own Nakshatra"

# ---------------------------------------------------------- source findings
# Findings ABOUT the 2026 document, as distinct from conventions derived from
# it. One entry per finding, cross-referenced from the blocks it touches, so a
# single editorial habit is not recorded twice as two unrelated notes.
source_findings:

  sun_never_labelled:
    summary: >
      The document never labels the Sun's state in any frame -- not its sign
      dignity and not its vargottama -- although it prints the Sun's position
      all year and labels every other classical planet it shows. This is ONE
      finding about the source's editorial treatment of the Sun, not two
      coincidental gaps, which is why it is recorded here once and referenced
      from both blocks rather than written out in each.
    cross_referenced_from:
      - dignity.source_witness.detail.Sun
      - vargottama.source_witness.detail.Sun
    derived_from: "data/source_2026.html md5 5e098446d6dd13d3df8443528db5dd95"
    evidence:
      dignity: >
        The Sun occupies all twelve signs in Sun Transgression (Sankranti) p.2,
        Aries (exalted), Leo (own + trine) and Libra (debilitated) among them,
        and that table carries no dignity column at all. Every other journey
        table in the document does carry dignity inline -- "Pisces
        (Debilitated)" in Journey of Mercury p.8, "Capricorn (Exalted)" in
        Journey of Mars p.5 -- so the column was omitted for the Sun
        specifically, not missing from the document's vocabulary.
      vargottama: >
        The Sun is vargottama on 163 of 1460 six-hourly 2026 samples, in eight
        separate windows (Sagittarius, Aquarius, Pisces, Taurus, Gemini, Leo,
        Virgo, Scorpio). The Leo window, 31-Aug-26 to 03-Sep-26, is vargottama
        AND the Sun's own sign at once -- exactly the pairing the source prints
        for other bodies as "Cancer (Exalted, Vargottam)" -- and it is not
        printed. The Sun also has no D9 table, and does not appear in the
        p.133 own-nakshatra appendix.
    classification: editorial_absence
    # The distinction that makes this finding usable rather than merely true.
    contrast_with_structural_absence: >
      The Sun's absence is EDITORIAL: the state obtains in 2026, the source
      could have printed it, and did not. Saturn and the outers are a different
      kind of absence entirely -- STRUCTURAL, meaning the state never obtains,
      so there was nothing to print. Saturn's rashi sign is Pisces for the whole
      of 2026 while its D9 runs Cancer to Scorpio, so the two never coincide:
      0 of 1460 samples. Uranus, Neptune and Pluto are likewise 0 of 1460
      despite each having its own D9 table. An editorial absence is evidence
      about the source's reliability; a structural absence is evidence about
      the sky and says nothing about the source.
    engine_consequence: >
      No change to any VALUE. The engine computes the Sun's dignity and
      vargottama by the same Parashari rule it applies to every other body and
      emits them normally. What this finding changes is the PROVENANCE claim:
      the Sun's rows are carried from the scheme and are untested by the
      source, so they must not be counted as source-witnessed in any later
      audit -- and from 21-Sep-2026 that claim is carried ON the record, as
      `navamsa_dignity_not_witnessed_in_source`, rather than left in this file
      for an auditor to remember to come and read. The flag arrived with the
      Moon's navamsa series and covers the Sun for the same reason it covers
      the Moon; it is derived from `dignity.source_witness.not_witnessed` and
      is not a second list. It is not an omission
      to correct, because the source never opened a slot to leave blank -- and
      so it is deliberately NOT listed under dignity.source_omissions, which is
      reserved for a row the source printed and left unlabelled (Saturn/Libra
      D9).
    status: recorded_not_blocking

# ------------------------------------------------------- cross-section defects
# Defects that show up as a disagreement BETWEEN two printings of the same event,
# rather than inside one table. The appendix end-date defect lives with the block
# it belongs to, at vargottama.source_defects, and is not repeated here.
source_defects:

  anuradha_on_sunday_28_jun_one_day_late:
    summary: >
      "Anuradha on Sunday - Bearish p.80" prints two rows, 31-May-26 and
      28-Jun-26. The Moon is in Jyeshtha for the whole of 28-Jun-26. Anuradha
      runs 26-Jun-26 19:16 (Fri) to 27-Jun-26 22:11 (Sat) and never touches a
      Sunday in that lunation, so the rule cannot fire on 28-Jun under any
      convention.
    correct_value: "no qualifying Sunday in that window; the Anuradha day is Saturday 27-Jun-26"
    incorrect_value: "28-Jun-26 (Anuradha on Sunday p.80)"
    classification: off_by_one_day
    same_class_as: "vargottama.source_defects.appendix_p133_end_date_off_by_one_day -- the printed date is one day after the true one, and the Anuradha window ends 27-Jun 22:11, just before the printed day begins"
    verification:
      method: nakshatra_span_scan_over_the_whole_civil_day
      implemented_in: "tests/test_2026_regression.py::test_weekday_source_defects"
      convention_independent: >
        Asserted as absence across the ENTIRE civil day at 10-minute resolution,
        not as a miss under one convention. Sunrise-at-dawn, civil-day overlap,
        sunrise-to-sunrise and market-session therefore all agree it is not a
        qualifying day. This is what separates a source defect from a
        convention difference: no choice of day boundary can produce the row.
    engine_consequence: >
      The row is excluded from the weekday pass rate via
      WEEKDAY_SOURCE_DEFECTS and asserted as a defect in its own check, so it
      is subtracted from the denominator openly rather than silently tolerated.

  monthly_calendar_bhadra_13_jan_start:
    summary: >
      The document prints its Bhadra (Vishti karana) windows twice and the two
      printings disagree on one row. "Bhadra -- verified against Swiss
      Ephemeris" pp.120-124 prints 13-Jan-26 02:00 -> 15:18; "JANUARY 2026
      EVENTS" pg.270-271 prints 13-Jan-26 3:59 -> 15:18. Same event, same end
      time, starts 1h58m54s apart.
    resolved: true
    correct_value: "13-Jan-26 02:00 -> 13-Jan-26 15:18 IST (the section is right)"
    incorrect_value: "13-Jan-26 3:59 (monthly calendar, pg.270-271)"
    error_magnitude: "the monthly start is printed 1h 58m 54s late"
    computed: "opens 13-Jan-26 02:00:06 IST, closes 13-Jan-26 15:18:25 IST"
    verification:
      method: vishti_karana_elongation_bisection
      implemented_in: "tests/test_2026_regression.py::test_bhadra_two_printings"
      rule_source: >
        The Bhadra section states its own method, which was implemented rather
        than trusted: a Vishti karana is a 6-degree step of Moon-Sun elongation,
        the eight windows of each lunar month fall on karana numbers 8, 15, 22,
        29, 36, 43, 50 and 57, boundaries by bisection on the exact 6-degree
        multiples, times IST. Karana n spans [(n-1)*6, n*6) degrees; 13-Jan-26
        is karana 50, elongation 294 to 300 degrees.
      frame_independent: >
        Elongation is a DIFFERENCE of two longitudes, so the ayanamsha cancels
        and the computation is identical in the sidereal and tropical frames.
        No frame choice can move these times.
      timezone_independent_cross_check: >
        The section's Day/Night column is read from karana parity -- odd number
        = Day Bhadra, even = Night Bhadra -- which is a property of the
        tithi-half and not of daylight, so it cannot shift with timezone.
        Computed parity reproduces the printed column 8/8, which confirms the
        karana NUMBERING is aligned and is what the start times depend on. A
        timezone error therefore cannot explain the 1h59m gap: one printing is
        simply wrong.
    why_it_is_a_bad_cell_and_not_a_different_rule: >
      The row's END time, 15:18, is correct in BOTH printings and matches the
      computed 300-degree crossing. A different window definition would have
      moved both boundaries; only the start moved. The same reasoning that the
      control rows provide for the appendix defect, supplied here by the row's
      own other boundary. No boundary of any kind sits near 3:59 either -- the
      neighbouring tithi start is 12-Jan 12:43, the Moon's nakshatra change
      12-Jan 21:05, its sign change 13-Jan 17:21 -- so 3:59 corresponds to no
      rule, only to a mistyped cell.
    all_eight_january_windows_checked:
      # computed | which printing each agrees with
      - "02-Jan-26 18:53 -> 03-Jan-26 05:11  (karana 29, Day)   section only; ABSENT from the monthly table"
      - "05-Jan-26 20:54 -> 06-Jan-26 08:02  (karana 36, Night) section only; ABSENT from the monthly table"
      - "09-Jan-26 07:05 -> 09-Jan-26 19:39  (karana 43, Day)   section and monthly both agree"
      - "13-Jan-26 02:00 -> 13-Jan-26 15:18  (karana 50, Night) section agrees; MONTHLY START WRONG by 1h58m54s"
      - "16-Jan-26 22:22 -> 17-Jan-26 11:16  (karana 57, Day)   section only; ABSENT from the monthly table"
      - "22-Jan-26 14:41 -> 23-Jan-26 02:28  (karana 8,  Night) section and monthly both agree"
      - "25-Jan-26 23:10 -> 26-Jan-26 10:17  (karana 15, Day)   section only; ABSENT from the monthly table"
      - "29-Jan-26 03:17 -> 29-Jan-26 13:55  (karana 22, Night) section and monthly both agree"
    agreement_measured:
      bhadra_section: "all 16 January boundaries within 30 seconds of the computed value (25 on Moshier, 26 worst on the Swiss Ephemeris files) -- the section's 'verified against Swiss Ephemeris' claim holds"
      monthly_calendar: "7 of its 8 boundaries within 79 seconds; the eighth is the 13-Jan start, off by 7134 seconds"
    scope: >
      A single bad row, not a systematic offset. The monthly calendar also omits
      four of the eight January windows entirely (02-Jan, 05-Jan, 16-Jan,
      25-Jan), so it is an incomplete secondary printing; where it does print a
      window it is otherwise right to the minute.
    engine_consequence: >
      None yet -- Bhadra is not an emitted event class in the astronomy layer.
      The consequence is for Step 4: when Bhadra enters the rule layer, it must
      be computed by the karana rule above and must NOT be read from the monthly
      calendar. Recorded here so the precedence between the two printings is
      settled before anything depends on it.

  chaturthi_krishna_03_jun_end_time_against_the_wrong_date:
    summary: >
      "Chaturthi - Krishna Paksh (Dark Fortnight) - Bearish p.65" annotates its
      03-Jun-26 row "Till 23:31". Krishna Chaturthi that month runs 03-Jun-26
      21:21:45 to 04-Jun-26 23:30:59 IST. The printed time is the correct END
      of the tithi to one second; the date beside it is the day the tithi
      STARTED.
    resolved: true
    correct_value: "either '04-Jun-26, Till 23:31' or '03-Jun-26, From 21:22'"
    incorrect_value: "03-Jun-26, Till 23:31 (p.65)"
    error_magnitude: "2h 09m after the last boundary on the printed date, and 1 second from the boundary on the next"
    classification: right_value_wrong_cell
    same_class_as: >
      source_defects.monthly_calendar_bhadra_13_jan_start -- a correct computed
      value typed into the wrong cell, identified by the fact that the value
      itself lands on a real boundary to the second while nothing sits near it
      on the printed date.
    verification:
      method: tithi_elongation_bisection
      implemented_in: "tests/test_2026_regression.py::test_printed_tithi_times_reproduce"
      frame_independent: >
        A tithi is a 12-degree step of the Moon-Sun elongation, which is a
        DIFFERENCE of two longitudes, so the ayanamsha cancels exactly as it
        does for the Bhadra karana. No frame choice can move this boundary.
      why_it_is_a_bad_cell: >
        Thirty-six tithi boundary times are printed across B65, B73, B74, B75,
        B76 and B109. Thirty-five reproduce within 68 seconds. This one is 7755
        seconds out against its own date and 1 second out against the next,
        which is not a tolerance question.
    engine_consequence: >
      None. b076_chaturthi_krishna_paksha fires on the tithi span itself and
      emits both 03-Jun and 04-Jun as days that Chaturthi touches, so the
      printed date is reproduced and the printed time is reproduced; only the
      pairing in the document is wrong.

  amavasya_ghadi_third_row_date_cell:
    summary: >
      "Amavasya Ghadi Lesser than Chaturdashi - Bearish p.84" prints four rows.
      Its third reads "28-Mar-25 *" with a start time of 08:27. The Amavasya
      satisfying the condition in that lunation opens 18-Mar-26 08:25 IST. The
      time identifies the row; the date is wrong in the day (28 for 18) and in
      the year (25 inside a 2026 calendar), and the document marks the cell
      with its own asterisk.
    resolved: true
    correct_value: "18-Mar-26, 08:25 IST"
    incorrect_value: "28-Mar-25 *, 08:27 (p.84)"
    classification: right_value_wrong_cell
    same_class_as: >
      The year typo README records at "17-Apr-25 inside a 2026 calendar", with
      a transposed day on top of it. Identified the way the Bhadra row was: by
      the value that is right, not by the cell that is wrong.
    verification:
      method: consecutive_tithi_length_comparison
      implemented_in: "tests/test_2026_regression.py::test_b106_ghadi_comparison_and_its_broken_date_cell"
      note: >
        A ghadi is 24 minutes, a sixtieth of the day, and a tithi's length is
        the difference of two consecutive boundaries -- so the condition needs
        the boundary series and no other input. The condition holds six times
        in 2026 (18-Jan, 16-Feb, 18-Mar, 16-Apr, 16-May, 14-Jun); the section
        prints four of them, each within two minutes of the computed start, and
        stops in April.
    engine_consequence: >
      None. b106_amavasya_ghadi_lesser_than_chaturdashi computes the comparison
      from the tithi series; the section's broken cell is never read.

  yoga_in_panchak_06_jun_row_has_no_overlap:
    summary: >
