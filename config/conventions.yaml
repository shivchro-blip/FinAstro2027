  pradosh_01_jan_occurrence_not_printed:
    summary: >
      The same section omits a Pradosh it should print. Shukla Trayodashi runs
      01-Jan-26 01:48:28 to 22:22:45 and Mumbai sunset falls at 18:08:43 inside
      it, so 01-Jan-26 is a Pradosh under every reading tested. The section's
      table begins at 16-Jan-26.
    classification: omitted_occurrence
    not_the_same_as: >
      The two-day artefact. A tithi runs about 23h40m and touches two civil
      days more often than one, so a section printing one of them is omitting
      nothing -- that is the B75 and B95 shape. This is the B74 and B100 shape
      instead: a whole occurrence, on a day no printed row is adjacent to. The
      distinction is kept per section rather than reported as one
      undifferentiated count of extras.
    engine_consequence: >
      b064_pradosh emits the row. The title is the rule, per STEP4_DECISIONS
      section 12.4.

# ------------------------------------------------------------- rise and set
# Sunrise and sunset are a LOCATION PROPERTY and the only emitted classes that
# are. A tithi or yoga boundary is an angle reaching an exact multiple and the
# whole Earth shares the instant; the Sun meets one horizon at one place. So
# every record of these two classes carries its venue, events.LOCATION_REQUIRED
# makes a location-free one a build error, and both configured venues are
# generated, with neither a default nor a fallback for the other.
rise_set:
  convention: disc_center_no_refraction     # same string as combustion.rise_set_flags
  certainty: B
  stated_in_code: "finastro/panchang.py::RISE_SET_CONVENTION"
  why_b: >
    A rise depends on which part of the disc is taken to touch the horizon, on
    whether refraction is applied, and on the horizon's own height. Across the
    four Swiss Ephemeris conventions a Mumbai sunrise moves by about four and a
    half minutes, so the quantity is definition-sensitive however exactly it is
    computed. That is what grade B means, and it is not a statement about the
    arithmetic.
  why_this_convention:
    - >
      It is the one the kalamsha calibration was fitted under. Kalamsha is the
      gap between a planet's rise and the Sun's rise, so a sunrise taken under
      a different convention from the combustion thresholds would not be the
      quantity those thresholds are thresholds on. One convention, stated in
      two places, checked by test_the_convention_matches_the_combustion_calibration.
    - >
      One row of the document decides it independently, and it is worth exactly
      what one row is worth. B66 prints 23-Feb-26, Saptami, as a Kshay tithi.
      Shukla Saptami runs 23-Feb 09:09:45 to 24-Feb 07:02:37, and Mumbai
      sunrise on 24-Feb is 07:05:07 without refraction and 07:02:29 with it --
      one side of the tithi's end and then the other. Without refraction the
      Saptami holds no sunrise and is Kshay on 23-Feb, which is the printed
      row; with refraction it is not Kshay and the following Ashtami is, on
      24-Feb. An eight-second margin, one row in twenty-eight, pointing the
      same way as the kalamsha calibration. Corroboration, not the ground.
  what_the_source_prints: >
    No rise or set table. Four Mumbai times to the minute, inside the Bhadra
    section's prose explaining why its reference place matters -- 09-Jan
    sunrise 07:13, 27-Apr sunrise 06:16, 28-Jul sunset 19:16, 29-Sep sunrise
    06:29. The engine reproduces all four within 4m43s.
  the_four_do_not_decide_the_convention: >
    Measured rather than assumed. Worst error over the four: disc-centre
    no-refraction 283 s, disc-centre with refraction 114 s, upper-limb
    no-refraction 208 s, upper-limb with refraction 168 s. Every convention has
    errors of BOTH signs across the four, so none is a fixed offset from the
    source's and no correction recovers one from another. Times printed to the
    minute cannot separate conventions whose spread is 4.5 minutes. Recorded so
    that "the convention is pinned" is never read as "the source pinned it".
  where_the_b_grade_lands: >
    On the published time of a rise, and almost never on a rule conditioned on
    one. Twenty-seven of the twenty-eight Kshay and Vriddhi rows are identical
    under all four conventions; the twenty-eighth is B66's 23-Feb Saptami
    above. Pradosh is convention-independent on all 25 of its 2026 rows.
  venues_are_not_interchangeable: >
    The two venues' sunrises are about ten and a half hours apart, and the
    consequence is not cosmetic. Of the Kshay tithis in the generated span,
    Mumbai has 10 in the bright fortnight and New York 11, with NONE in common:
    a Kshay tithi is one whose 21-hour span falls entirely between two
    consecutive sunrises, so agreement between two venues half a world apart
    would be a coincidence rather than a rule.

# ------------------------------------------------ node lord relationship
# The nodes carry no dignity, so the source prints a Relationship column
# instead: the sign-count relation between the node's sign and the sign its
# dispositor occupies. It is a PERIOD value, not an instant value.
node_lord_relationship:
  evaluation: at_node_sign_ingress
  period_constant: true
  anchor: most_recent_node_sign_ingress_at_or_before_instant
  source: >
    2026 source Rahu/Ketu journey tables print one Relationship value per
    sign-period. All four 2026 values reproduce at the 05-Dec-2026 21:52 IST
    node ingress; year-start and year-end each fail two of four. Moon case
    holds only ~36h of a 26-day period, beginning at the ingress instant.
  # The engine's own mean-node ingress lands 05-Dec-2026 22:32 IST; 21:52 is
  # the time the source prints. The 40-minute gap is the same one recorded
  # under `node: mean` above and does not move any of the four values.
  # Quantified rather than merely noted: the mean node moves 360 deg per
  # 6798.38 days = 190.6 arcsec/day, so 40 minutes is 5.3 arcseconds of node
  # motion. That is the scale that separates one mean-node formulation from
  # another, and one Lahiri variant from another -- i.e. the gap is inside the
  # noise floor of the convention choice itself, not evidence of a different
  # rule. A sign boundary is 108000 arcsec away from the next one, so nothing
  # sign-level can turn on 5.3 arcsec; the four Relationship values are
  # unmoved, and the dispositor positions read at the anchor shift by far less
  # than the sign granularity the Relationship column is computed at.
  no_anchor_flag: no_anchor_ingress_in_span

# --------------------------------------------------- conjunctions/oppositions
conjunctions:
  bodies: [Sun, Mercury, Venus, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto]
  exclude_moon: true
  source: >
    SOURCE-VALIDATED against data/source_2026.html (md5
    5e098446d6dd13d3df8443528db5dd95). The two headings carrying the exclusion,
    quoted exactly: "Pluto Conjunction with Other Planets (Except Moon) p.41"
    and "Pluto Opposition with Other Planets (Except Moon) p.42". All eight
    pair tables in the document were then read row by row -- those two,
    "Herschel Conjunction with Other Planets p.34", "Herschel Opposition with
    Other Planets p.34", "Neptune Conjunction with Other Planets p.37",
    "Neptune Opposition with Other Planets p.37", "Mars Mercury Conjunction
    p.12" and "Venus Mercury Conjunction p.16" -- and none carries a Moon row.
    The exclusion is stated twice and honoured everywhere. Moon-planet
    relationships are handled in the rule layer at sign/nakshatra granularity,
    not as degree-exact conjunctions.
  sun_moon: lunation_class_only

# ------------------------------------------------------- deferred to Step 4
# Moon-planet material the conjunction class deliberately drops. Recorded here
# so it is not silently lost; implemented in the rule layer at sign/nakshatra
