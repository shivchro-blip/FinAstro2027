  pradosh_24_aug_one_day_before_its_own_trayodashi:
    summary: >
      "Pradosh pp.52-53" prints 24 dated rows and one of them, 24-Aug-26
      (Monday, Bright), names a day on which no Trayodashi is in force at any
      hour. Shukla Trayodashi that month opens 25-Aug-26 06:21:21 and closes
      26-Aug 07:59:37; Mumbai sunset on 24-Aug falls at 18:55 inside Dwadashi.
      No reading of Pradosh -- sunset, pradosh kala, sunrise or civil-day
      overlap -- can reach 24-Aug, because the tithi the word names has not
      begun.
    correct_value: "25-Aug-26 (Mumbai sunset 18:55:32, inside Shukla Trayodashi)"
    incorrect_value: "24-Aug-26 (Pradosh pp.52-53)"
    classification: off_by_one_day
    internal_contradiction: >
      The strongest class of finding available: the document contradicts
      itself. "Vriddhi Tithi - Shukla Paksh p.57" (B68) lists the same tithi as
      a Vriddhi Trayodashi on 25-Aug-26 -- the day this engine computes --
      while the Pradosh table dates its Pradosh to 24-Aug. Two of the
      document's own pages disagree by one day about one tithi, exactly as p.43
      and p.44 disagree about the 06-Jun Panchak start.
    same_class_as: >
      source_defects.anuradha_on_sunday_28_jun_one_day_late and
      vargottama.source_defects.appendix_p133_end_date_off_by_one_day -- a
      printed date one day away from the true one, with the rest of the row
      correct.
    verification:
      method: tithi_boundary_bisection_against_mumbai_sunset
      implemented_in: "tests/test_2026_regression.py::test_pradosh_reproduces_against_mumbai_sunset"
      scope: >
        All 25 Trayodashis of 2026 were computed and set against the section's
        24 printed rows. 23 reproduce exactly and in the right fortnight. The
        two remaining divergences are held apart and are different findings:
        24-Aug is this defect, and 01-Jan-26 is an occurrence the section
