# ---------------------------------------------------------------- labels
labels:
  data_certainty:
    A: "computed exact, under 1 minute"
    B: "computed but definition-sensitive (stations, combust/rise, Abhijit boundaries)"
    C: "depends on something that is not evidenced"
  #: C has TWO INDEPENDENT GROUNDS, and every C record must say which one it is
  #: on. They are not the same defect and they do not have the same remedy:
  #:
  #:   undocumented_source_rule            the RULE is missing. The source
  #:       applies a selection we cannot state -- B70's "sorted on multiple
  #:       parameters", the benefic/malefic valence behind Paap Kartari. Remedy:
  #:       recover the rule.
  #:   parameter_not_constrained_by_evidence   the rule is stated and the METHOD
  #:       is sound, but a NUMBER in it was fitted to fewer constraints than it
  #:       has free parameters. Mars's and Venus's Fast levels: each crosses
  #:       exactly once in 2026, so one equation in one unknown. Remedy: a year
  #:       supplying a second crossing.
  #:
  #: The distinction matters because "undocumented" invites the reader to go and
  #: look for the rule, and in the second case there is nothing to find: the rule
  #: is documented and the parameter is simply unevidenced. Calling a
  #: single-point fit "an undocumented source rule" would send a reader hunting
  #: for a page that does not exist.
  #:
  #: A station has no fitted parameter -- it is where the longitude is
  #: stationary, and no level stands between the sky and the instant. It is
  #: NOT frame-free, which this comment claimed until 18-Nov-2026: the sidereal
  #: speed is the tropical speed minus the ayanamsha and nutation rates (~6e-5
  #: deg/day), and that moves a slow planet's zero by hours. Stations are
  #: computed on the speed of date (ephem.Position.speed_of_date): all 18
  #: printed 2026 station times reproduce within 1.7 min that way, against
  #: misses of up to 3h20m (Pluto) on the sidereal speed. A crossing of 0.6583
  #: deg/day is only as meaningful as 0.6583 is.
  data_certainty_grounds:
    undocumented_source_rule: "the rule itself is not recoverable from the source"
    parameter_not_constrained_by_evidence: "the method is sound; a fitted parameter has fewer constraints than free parameters"
  claim_tag: [Classical, Framework, Observed, Historical, Verify]
  confidence_default: untested
  # The six buckets the source prints. ONLY THREE SURVIVE TRANSFER TO 2027 --
  # Reasonable, Good and High. Every Low, every Very High and the single
  # Intense and High Reliable is excluded by the transfer test, so the usable
  # range after transfer is 2-4. The map is kept complete because it describes
  # the SOURCE, not the carried field. See top-level source_probability, and
  # source_probability.scale_collapse in particular, before using either.
  source_probability_map: {Low: 1, Reasonable: 2, Good: 3, High: 4, "Very High": 5, "Intense and High Reliable": 5}
  source_probability_layer: source_probability   # the carried-label block, defined 13-Sep-2026
  impact_tier:
    T1: "eclipses, slow-planet ingresses and stations, major conjunctions"
    T2: "inner-planet stations, combust/rise, ingresses"
    T3: "lunar and panchang daily events"

# ---------------------------------------------------------------- still open
open_questions:
  # speed_class_thresholds: RESOLVED FOR THE INNER PLANETS, BLOCKED FOR THE SLOW
  # ONES. Recalibrated 14-Sep-2026. THIS SUPERSEDES an earlier entry that
  # reported "no threshold exists" -- that result was a METHOD ARTEFACT and the
  # correction is recorded here in full, because the wrong version is the kind
  # of finding that gets quoted for years.
  #
  # THE ERROR. The first pass read speed_deg_day AT each printed boundary date
  # and asked whether the Fast and Normal samples separate. A printed boundary
  # is a DAY, not an instant. Near a speed maximum the whole above-threshold
  # window can be a few days wide -- Mercury's February maximum is 1.773 against
  # a threshold near 1.745 -- so an arbitrary sample inside the boundary day
  # lands on whichever side the sample instant happens to fall, and the samples
  # "overlap" whether or not a clean threshold exists. Mercury's case, which the
  # first pass called decisive, was exactly this. The kalāṃśā work never did it
  # that way: it proposed a threshold, computed the instants the body CROSSES it,
  # and scored those against the printed dates. That is what is done here.
  #
  # THE METHOD NOW. For each printed Fast/Normal boundary, compute the interval
  # of threshold values T that could place a crossing on that date (+/-1 day),
  # restricted to the correct branch -- a rising crossing into a speed maximum
  # for a Normal->Fast boundary, a falling crossing out of one for Fast->Normal.
  # The threshold of a planet exists iff those intervals share a point. A
  # Normal->Retrograde or Retrograde->Normal boundary is a STATION and is NOT
  # fitted; the stations are already reproduced by the sign of the speed.
  #
  # RESULT. Threshold intervals, at the tolerance each needs:
  #   Mercury  T = 1.7438 .. 1.7460   needs +/-1.1 d   precision_days 0.08
  #   Venus    T = 1.2234 .. 1.2246   needs +/-1.0 d   precision_days 2.00
  #   Mars     T = 0.6569 .. 0.6596   needs +/-1.0 d   precision_days 2.00
  #   Jupiter  NO INTERSECTION -- the two boundaries are 0.013750 apart in
  #            threshold space, about 4.8 days of tolerance. An orbital-period
  #            result, not a tolerance.
  #   Saturn   NO INTERSECTION at +/-1 d (0.002594 apart). A T does exist at
  #            +/-2.2 d but the feasible window is 0.000125 wide -- a sliver
  #            fitted to a 2.2-day rounding, which is not a threshold.
  #
  # Note the thresholds are ABSOLUTE and planet-specific: Mercury's 1.7449 and
  # Mars's 0.6583 are in the same units and differ by 2.6x. They are NOT
  # fractions of each planet's maximum, which was tested and rejected: that
  # reading forces Mercury's two crossings to be equidistant from its maximum,
  # and they are not.
  #
  # WHAT THIS UNBLOCKS. Mercury, Venus and Mars can be given a speed class at an
  # arbitrary instant, so the Vedha families are unblocked FOR THOSE THREE. The
  # class is: Fast/Atichari when speed >= T, Retrograde when speed < 0, Normal
  # otherwise. Doing so needs a speed-crossing series in the astronomy layer --
  # the layer emits speed on every record but emits no crossing of a level, so a
  # rule cannot build the spans today. That is new Step-3 work of exactly the
  # kind the tithi, yoga and sunrise series were, NOT a rule-layer approximation.
  #
  # WHAT STAYS BLOCKED. Jupiter and Saturn, on a SLOW-PLANET SPEED DOCTRINE
  # rather than on a failed threshold. The source carries a dedicated section
  # "Demoted and Shadow Speed of Saturn" (B30, p.26) precisely because the slow
  # planets are treated differently, and B30 defines its interval by LONGITUDE,
  # not by speed: Saturn is "in Demoted or Shadow Speed" from 11-Dec-2026 to
  # 15-Mar-2027, the interval between its 20 deg 31' crossing retrograde and the
  # same 20 deg 31' crossing direct. Verified: the engine puts Saturn at
  # 20.508963 deg in Pisces on both 27-Jul-2026 and 15-Mar-2027, which is
  # 20 deg 31' to the arcminute as the table prints it. What that section does
  # NOT supply is a speed level, so it does not give Jupiter or Saturn a
  # threshold. The missing input is therefore named as the slow-planet doctrine.
  #
  # Retrograde/Direct is unaffected and remains the sign of the emitted speed,
  # reproducing the source's stations to the MINUTE on the speed of date --
  # all 18 printed station times within 1.7 min; see data_certainty_grounds --
  # and to the day before 18-Nov-2026 (Jupiter 11-Mar-26, Saturn
  # 27-Jul-26, Neptune 07-Jul-26, Pluto 06-May-26, Herschel 11-Sep vs 10-Sep),
  # with Mercury the documented 2-7 day lag that mercury_shar_lag records.
  - speed_class_thresholds        # RESOLVED for Mercury (1.745), Venus (1.224),
                                  # Mars (0.658) -- absolute, planet-specific.
                                  # BLOCKED for Jupiter and Saturn on a
                                  # slow-planet speed doctrine (see B30), not on
                                  # a failed threshold. Porting the Vedha
                                  # families for the inner three needs a
                                  # speed-crossing series in the astronomy layer.
  - mercury_shar_lag              # source Mercury latitude rows lag computed by 2-7 days
  - aspect_orbs                   # graha drishti vs degree orbs
  - month_system_confirmation     # Purnimanta inferred from eclipse labelling
  # sector_mapping was CLOSED at the coverage step and is now REOPENED. The two
  # decisions it raised are both DECIDED (12-Sep-2026) and are no longer open:
  #
  #   crude_significator_saturn_vs_rahu  DECIDED -- deliberately NOT resolved to
  #       one planet. Saturn and Rahu are BOTH emitted, neither primary, every CL
  #       verdict flagged. See rulership.conflicts.crude_saturn_vs_rahu.
  #   civil_day_for_gc_si                DECIDED -- the VENUE determines the civil
  #       day. See verdict_coverage.civil_day_by_venue.
  #
  # The crude decision is what reopens sector_mapping: ruling that the source's
  # own sector map is load-bearing enough to be emitted alongside the book means
  # the source's map is evidence EVERYWHERE, not only where it is convenient.
  - sector_mapping                      # REOPENED. 7 source-vs-book sector
                                        # disagreements owed the same dual
                                        # treatment CL just got, each at the
                                        # point its instrument enters scope.
                                        # See rulership.sector_mapping_reopened.
                                        # Not blocking now: no instrument in
                                        # this config maps to any of the seven.
  # label_scheme_signoff was CLOSED 14-Sep-2026 and REMOVED FROM THIS LIST. It
  # is kept as a comment rather than deleted, because it gated the verdict layer
  # for six batches and a reader meeting a "why is there no verdict here"
  # question in an old record needs to find out what it was.
  #
  # CLOSED BY, verbatim: "Verdict text ported verbatim or absent." That is the
  # most conservative scheme available and it chose itself: a verdict is either
  # the source's own words or it is null. Nothing infers Bullish or Bearish from
  # a rulership, there is no `derived` verdict anywhere in the layer, and
  # `confidence` is `untested` on every row -- no code path can raise it. See
  # verdict_coverage.status and build/STEP4_DECISIONS.md section 12.13.
  #
  #   - label_scheme_signoff   # CLOSED 14-Sep-2026: verdict text is
