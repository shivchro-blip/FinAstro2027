  # ------------------------------------------------------ corrections on record
  # Claims made while this layer was being scoped that did not survive checking.
  # Recorded rather than silently repaired, to the same standard as
  # rulership.corrections_on_record.
  corrections_on_record:

    - id: label_count_45_vs_44
      claimed: "There are 45 probability labels in the source."
      attributed_to: user_prompt
      status: corrected
      corrected_to: >
        44. All 44 are probability spans inside div.prophecy-block, lines
        4335-4909. The likely 45th is line 4971, a div.summary in the January
        calendar reading "PROBABILITY OF POSITIVITY TILL 21ST JANUARY, THEREAFTER
        NEGATIVE TILL 29TH JANUARY" -- narrative prose, no probability class, no
        block. Two further suspects were checked and are neither labels nor
        artefacts of the label scheme: "Chapter 4" is a div.chapter-label and
        "Astro-Event Calendar & Inference Tables -- 2026" is a div.subtitle.

    - id: sun_mercury_label_count
      claimed: "Sun-Mercury Conjunction carries 4 labels."
      attributed_to: user_prompt
      status: corrected
      corrected_to: "6 -- blocks 8, 17, 24, 31, 38, 48 (21-Jan, 07-Mar, 14-May, 13-Jul, 27-Aug, 04-Nov)."

    - id: five_catalogue_b_families
      claimed: "the five catalogue-B-only families"
      attributed_to: this_project_pre_implementation_report
      status: corrected
      corrected_to: >
        FOUR families carrying FIVE labels. Blocks 26 and 42 are two labels on one
        family (Mercury Venus Alone in Any Sign p.16), which is exactly why that
        family is disputed. The firing count of 11 was computed per family and is
        unaffected.

    - id: gold_and_silver_config_group_counts
      claimed: "17 named rule groups for gold and 29 for silver -- \"the largest configuration set in the document\"."
      attributed_to: this_project_config_tier_1_evidence
      status: corrected
      found_by: >
        Re-deriving every count from data/source_2026.html with
        finastro/cfgsections.py while writing the two-denominator coverage
        statement. The numbers in tier_1.evidence had never been checked against
        the document they describe.
      corrected_to: >
        GOLD carries 19 groups (13 bullish + 6 bearish) and SILVER carries 30
        (20 + 10). The gold blocks are the reason the original count was low:
        their groups are <h3> headings, not <div class="config-title">, so a
        reader reaching for the same element as silver and sugar finds 39 groups
        in the chapter and none of gold's. Sugar's 9 was right. Section totals:
        58 groups, 0 ported.
      consequence: >
        The claim being corrected was about coverage, which makes this the same
        defect as the 141/141 claim one level down: a number that reads as a
        coverage statement and had never been derived from the thing it claimed
        about. Both are now generated from the document rather than asserted.
      same_shape_as: >
        the 141-of-141 claim itself. A count taken from our own config describes
        our config; the document is what the claim is about, and a count that is
        never re-derived cannot fail.

    # FOUND 14-Sep-2026, by the verdict layer failing to attach the label.
    - id: family_key_is_read_two_ways
      claimed: "the rule layer attaches source_probability by matching `family` against the emitted rule_family"
      attributed_to: this_project_verdict_layer_first_implementation
      status: corrected
      found_by: >
        Comparing the attached count against this block's own declared list of
        eleven carried families. A check phrased as "did anything attach" PASSED
        on the broken version -- five families attached and the result looked
        sparse rather than wrong.
      corrected_to: >
        `family` is READ TWO WAYS and both readings are live. For the aspect and
        visibility families it is the emitted rule_family
        ("aspect/conjunction Sun-Mercury", "visibility/combust"). For five others
        it is the SOURCE SECTION AS PRINTED, page marker and all -- "Mercury
        Venus Alone in Any Sign p.16", "Mars Ahead of Jupiter in Same Sign p.69",
        "Venus Jupiter in the Same Sign p.67". Matching only the first silently
        dropped 5 of the 11 families: b016, b078, b086 and the Rahu-Mars family
        attached to nothing, and the emitted label set was plausible-looking and
        wrong.
      same_shape_as: >
        blank reference views for a slow body (a body matching no record renders
        as a quiet year) and the null-key regression (a new field added to all
        4163 pre-existing records). All three are a wrong answer that renders as
        a plausible empty one, and none of them raises an error.
      fix: >
        Match either the emitted rule_family OR the section title with its page
        marker stripped. After the fix 11 of 11 families attach, 14 rules carry a
        label, and 344 verdict rows are annotated.
      superseded_by: label_attached_at_section_level
      superseded_note: >
        THAT FIX WAS ITSELF THE NEXT DEFECT. Matching the section title made the
        SECTION the unit of attachment, which is the correction below. The 344
        figure was measured under it and is not a figure about the source.

    # FOUND 15-Sep-2026, by an independent verification pass over
    # build/calendar_2027.json.
    - id: label_attached_at_section_level
      claimed: "source_probability attaches to the rule the source labelled."
      attributed_to: this_project_family_key_is_read_two_ways_fix
      status: corrected
      found_by: >
        Reading the emitted labels per RULE rather than per family or per total.
        b015, b015a, b015b and b015c all sit in "Venus Combust Rise Cycle p.14"
        and all four carried Reasonable, although b015b and b015c are RISE rules
        and the source's only rise label is block 46's High. A per-family or
        per-total count passes on that build; only a per-rule census sees it.
      corrected_to: >
        The section title was matched as a substring of rule.section.title, so
        every rule of a labelled section took that section's label and the first
        matching family won. Three consequences, all silent: rise_venus's High
        reached no row of the calendar at all, because combust_venus is listed
        first and its title match is the same string; all three firing b041
        Herschel partners carried conj_venus_uranus's High, although block 23 is
        titled "Venus Herschel Conjunction" and labels one partner; and
        cfg_silver_bearish_10_venus_rise_in_west held a High from a section it is
        not in. THIS IS THE FAMILY-READ-TWO-WAYS BUG IN A THIRD COSTUME and it
        belongs in verdict_coverage 12.16 as the sixth instance: a key that
        identifies a GROUP used to identify a MEMBER.
      same_shape_as: >
        family_key_is_read_two_ways, one level down. That correction widened the
        match to make five missing families attach; widening a match is how a
        member key becomes a group key, and nothing then distinguished "this rule
        is the one the source labelled" from "this rule is filed next to it".
      fix: >
        carried_families[].rules enumerates the rule ids, probability_for is a
        dict lookup on rule.id, and a rule id claimed by two families raises on
        import instead of taking whichever family is listed first. After the fix
        14 rules carry a label across 533 verdict rows of 6,677, down from 536
        rows -- three rows, which is exactly why the pinned table in
        tests/test_rule_layer.py is per rule and not per total.
      not_fixed_here: >
        The 344 in actual_figures_2026 was measured under the section-level
        attachment and has not been re-measured: the 2026 fixture runs the rule
        layer against a config whose `year` is 2027, so the figure cannot be
        reproduced without flipping the year. It is stale in the same direction
        as projected_population, and is left labelled rather than rewritten.

    # FOUND 15-Sep-2026, while enumerating the rule ids for rahu_mars_together.
    - id: rahu_mars_is_not_a_catalogue_b_section
      claimed: >
        Block 13 (Rahu Mars) passes transfer test 3 through catalogue B, and is
        one of "the five co-location labels (blocks 13, 26, 29, 42, 50)" the
        b_counts_ruling counts as catalogue-B passes.
      attributed_to: this_project_transfer_test_b_counts_ruling
      status: open
      found_by: >
        Looking for the catalogue-B section a rule id could be taken from. There
        is none: "Rahu Mars Together in Any Sign" appears twice in
        data/source_2026.html, at line 3402 as a bare h3 gold configuration
        heading and at line 3685 as a silver div.config-title. Neither is an
        h3.section, so neither is in the 141.
      consequence: >
        The family attaches to two CONFIGURATION rules and to no catalogue-B
        rule. Test 3's pass count of 19 counts it as a B pass, and the honest
        reading is that it passes through the 58-group configuration catalogue --
        a third catalogue that did not exist when the ruling was written and now
        renders into the calendar.
      left_open_because: >
        Re-ruling test 3 changes the 19/12/12/1 arithmetic and the classification
        block that tests/test_2026_regression.py asserts against the document.
        That is a ruling, not a repair, and the label attachment does not depend
        on it: the two configuration rules carry block 13's Reasonable either way.

  # ------------------------------------------------------------- asserted by
  asserted_by:
    source_side: "tests/test_2026_regression.py::test_source_probability_labels"
    build_side: "tests/test_2027_astronomy.py::test_source_probability_population"
    ban_on_leaking: "tests/test_2027_astronomy.py::test_no_interpretation_leaked"
    drift_intent: >
      The population counts are asserted EXACTLY, not as a range. The point of the
      assertion is that a field populated on 26 rows cannot drift without someone
      noticing: if a later change populates 400 rows or zero rows, the harness
      fails.
