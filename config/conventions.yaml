  # ============================================ unported configuration sections
  # RECORDED 14-Sep-2026, found by asking why SUGAR emitted zero rows.
  #
  # THE COMMODITY CONFIGURATION SECTIONS ARE NOT CATALOGUE B AND WERE NEVER
  # PORTED. They are `<section id="...">` blocks with `<h2>` headings, while
  # catalogue B is `<h3 class="section">` -- 141 of those. So the rule layer's
  # "141/141 sections" is TRUE OF CATALOGUE B and says nothing about these.
  #
  # This is bigger than sugar. The counts, from the document:
  #   silver-bullish  pp.149-161  20 named groups
  #   silver-bearish  pp.162-167  10 named groups
  #   sugar-bullish   pp.168-173   7 named groups
  #   sugar-bearish   pp.174-175   2 named groups
  #   gold-bullish    pp.136-144  groups carried as <h3> headings, not config-titles
  #   gold-bearish    pp.145-148  as above
  #
  # CONSEQUENCE, stated rather than left to be noticed: GC, SI, MCXGOLD,
  # MCXSILVER and SUGAR are all listed under tier_1 with a named evidence block
  # -- 17 rule groups for gold, 29 for silver, 9 for sugar -- and the verdict
  # layer reaches them only through catalogue-B rules whose bodies happen to
  # resolve to gold or silver. SUGAR reaches nothing at all, because no
  # catalogue-B rule conditions on it and its own nine groups are these blocks.
  #
  # Not ported, and not approximated. What porting needs is a reader for the
  # `<section>` shape and a mapping from each group's condition to machinery the
  # rule layer already has (many conditions are panchang or vedh families that
  # already exist). That is a batch of its own, not a patch to the verdict layer,
  # and inventing verdicts to fill the gap is what the label-scheme ruling
  # forbids.
  # ------------------------------------------------ the two denominators
  # WHAT THIS BLOCK IS: the pair of rates the 2026 monthly-calendar fixture
  # produces, and the rule that neither may be quoted without the other. It is
  # a key rather than prose in three documents because the pair had already
  # been split once -- 141/141 and 0/58 both travelled alone and both were read
  # as claims they did not make.
  two_denominators:
    recorded: 2026-09-16
    fixture: build/MONTHLY_2026_FIXTURE.md
    generator: tools/monthly_match.py
    fixture_year: 2026
    coverage:
      rate: [168, 354]
      means: >
        OF EVERYTHING THE SOURCE PRINTED, how much the layer reproduces. 354 is
        the distinct dated windows of the source's own monthly calendar, after
        the 53 carry-over copies are folded. 47%.
    precision:
      rate: [168, 175]
      means: >
        OF THE ROWS SOME RULE CLAIMS, how many land -- conditional on a rule
        existing and firing at all. 96%.
    why_neither_travels_alone: >
      96% WOULD READ AS 100% FOR A LAYER WITH ONE PERFECT RULE AND NOTHING
      ELSE, so it is not a quality score; it answers "when we do claim a row,
      do we get it right". And 47% is not a failure score: 131 of the 188
      misses at the baseline were rows no rule was ever written for. STATE THE
      RELATIONSHIP, NOT JUST THE PAIR.
    baseline_before_the_configuration_wiring: [166, 354, 166, 173]
    what_moved: >
      The port moved coverage 166 -> 168 of 354 and event names 88 -> 90 of
      147. The two windows are `Rahu Mars in the same sign` (23-Feb-26) and
      `Rahu Mars in the same Nakshatra` (03-Mar-26) -- the only two of the
      source's 147 event names that no catalogue-B section states at all.
    these_figures_are_a_dated_record_and_not_a_live_count: >
      DELIBERATELY NOT PINNED BY THE HARNESS. tests/test_monthly_fixture.py
      pins the fixture and the map -- both read off the document -- and
      explicitly refuses to pin the match result, because the match result is
      what the fixture MEASURES and is expected to move whenever the layer
      improves. A check that froze it would be a record of edits rather than a
      check. So the pair above is re-read from tools/monthly_match.py after any
      change that could move it, and carries the date it was read.
    quoted_on: >
      build/calendar_2027.html, in the apparatus panel -- the one place both
      numbers meet a reader who has read none of the reports. Also
      build/NEXT_SESSION.md and build/MONTHLY_2026_FIXTURE.md.

  unported_configuration_sections:
    # 14-Sep-2026, SECOND ENTRY: this block is no longer wholly unported. The
    # key keeps its name because renaming it would break every citation of it
    # in the reports and in STEP4_DECISIONS, and because 20 of the 58 ARE still
    # unported and this is still where that is recorded.
    status: partially_ported
    ported_by: finastro/rules/config_rules.py
    shape: '<section id="..."> with <h2>, outside the <h3 class="section"> catalogue'
    # ------------------------------------------------ counted from the document
    # 14-Sep-2026: the per-block counts below were re-derived from
    # data/source_2026.html by finastro/cfgsections.py rather than from this
    # file, because `named_groups` here was partly a phrase ("carried as <h3>
    # headings") for the two gold blocks and the totals in tier_1.evidence were
    # stated without saying how they had been reached. Two of them were wrong.
    # The document wins, and the corrections are recorded in
    # corrections_on_record below rather than quietly rewritten, because a
    # coverage number nobody can re-derive is the defect this whole block exists
    # to name.
    counted_from_document_by: finastro/cfgsections.py
    blocks:
      silver-bullish: {pages: "pp.149-161", named_groups: 20}
      silver-bearish: {pages: "pp.162-167", named_groups: 10}
      sugar-bullish:  {pages: "pp.168-173", named_groups: 7}
      sugar-bearish:  {pages: "pp.174-175", named_groups: 2}
      gold-bullish:   {pages: "pp.136-144", named_groups: 13}
      gold-bearish:   {pages: "pp.145-148", named_groups: 6}
    total_named_groups: 58
    per_instrument: {gold: 19, silver: 30, sugar: 9}
    ported: 38
    blocked: 20
    # Counted off finastro/rules/config_rules.CONFIG_REGISTRY, not typed here:
    # config_rules.missing_input_counts() is the source of these numbers and the
    # harness re-derives them. silver-bearish#9 is blocked on TWO inputs and so
    # appears in two rows; the group total is 20, not 21.
    blocked_by_input:
      valence: 9
      darshan: 4
      month_system: 3
      aspect_orb: 2
      vedha_wheel: 2
      no_dated_window: 1
    port_report: build/CONFIG_PORT_REPORT.md
    scope_said_41_port_delivered_38: >
      The scope survey classed 41 groups READY. Three of them were blocked
      during the port, on evidence found while writing them, and one group the
      survey did not count as READY was ported. Net 38.
        gold-bullish#6  "If Mars is Aspected by Saturn and Jupiter is
          Retrograde" -- the survey called the aspect already-used; the layer
          emits conjunction and opposition only and the group's printed row is
          a 10th-house graha drishti. Blocked on aspect_orbs, which is still
          one of the five.
        silver-bullish#10 "Mercury or Jupiter Do Vedh of Venus" and
        silver-bearish#6  "Mercury Venus or Moon Venus Mutual Vedh" -- both
          need a per-planet Vedha wheel that is not ported (Jupiter B135 has no
          speed doctrine, Venus B134 was withdrawn on a single-point fit).
          This is a SIXTH missing input, not one of the five, and is recorded
          as such rather than folded into the nearest existing one.
        silver-bullish#11 "Mercury Combust and Retrograde Does Mutual Vedh with
          Moon" -- ported as a resolved ambiguity. Both printed rows resolve out
          of Mercury's own wheel, so no Moon wheel is needed.
    verdict_composition: >
      THE STRUCTURAL DIFFERENCE FROM CATALOGUE B, and the defect it was going to
      cause. A configuration verdict is stated in TWO elements: the block's <h2>
      carries the direction ("Silver -- Bullish Configuration") and the group
      heading carries the condition and sometimes sharpens the direction. A port
      that sliced only the group heading would have produced null verdicts for
      every group whose heading states no direction -- 36 of the 58 -- and each
      would have rendered as a blank rather than as an error. That is the same
      shape as the `family` half-match. finastro/rules/config_catalogue.py
      refuses the registration instead: check_verdict raises SilentVerdict at
      import for any rule under a directional block that carries no verdict, for
      a verdict that is not a substring of the document, or for one with no
      attribution. 36 verdicts come from block_h2 and 22 from the group title;
      none is null.
    # --------------------------------------------- the FULL scope, not an estimate
    scope_report: build/CONFIG_SECTIONS_SCOPE.md
    scope_report_note: >
      Every one of the 58 groups with the class of its condition and the grounds
      for that class. Generated by tools/gen_cfg_scope.py; the counts come from
      finastro/cfgsections.py reading the document. Result: 41 of 58 need no
      astronomy the layer lacks, and the remaining 17 sit behind five distinct
      missing inputs -- benefic/malefic valence (8), first-sighting darshan (4),
      the lunar month system (3), the aspect orb (1), and one group with no dated
      table to port (1). Two of those five (aspect_orbs,
      month_system_confirmation) are already open questions here and are owed an
      answer for catalogue-B sections regardless.
    gold_and_silver_groups_are_h3_not_config_title: >
      The only structural difference between the blocks. Gold carries its groups
      as <h3> headings (13 bullish + 6 bearish); silver and sugar carry theirs as
      <div class="config-title"> (20/10 and 7/2). They play the same role and are
      counted the same way. A reader who greps for `config-title` will find 39
      groups and conclude gold has none.
    affected_instruments: [GC, SI, MCXGOLD, MCXSILVER, SUGAR]

    sugar_specifically: >
      SUGAR'S ZERO WAS THE BODY-SCOPING FIX, AND THE FIX IS THE SECTOR ALIAS.
      Diagnosed rather than assumed, and the first diagnosis was WRONG: this note
      originally blamed only the unported blocks. The actual cause is that
      the rulership lookup asked for a `sugar` sector, and the table spells it
      `sugar_and_soft_goods` (from book_ch15's "sugar and soft/luxury goods"),
      so Venus resolved to nothing for that sector and the body-scoping step
      excluded SUGAR from every rule. Adding the alias restored it: SUGAR now
      emits 396 rows, 134 carrying a verdict and 262 null. The rows come from
      VENUS-ruled catalogue-B rules, which is the correct channel -- SUGAR's
      rulership is Venus per ch15, and this block's own `resolution` field says
      "SUGAR is tier 1 and takes its verdicts from the source's own
      configuration sections, so no rulership is needed to reach it".
      THE UNPORTED BLOCKS ABOVE ARE STILL A REAL GAP and still mean SUGAR's own
      nine named groups (pp.168-175) are not in the layer. They are the reason
      SUGAR's coverage is thin rather than the reason it was empty. Both facts
      are recorded; neither is allowed to hide the other.
    sugar_diagnosis_corrected: 2026-09-14
    same_shape_as: [family_key_is_read_two_ways, blank_reference_view_for_a_slow_body, null_key_added_to_every_record]

  # ======================================================================= axes
  # CANONICAL 13-Sep-2026. The coverage model has TWO fields, not one. They are
  # `evidence_source` and `construction`, and they are what a rule is written
  # against. `tier` is a DERIVED convenience name over the pair -- kept because
  # eleven instruments and three reports already speak in tier names, demoted
  # because it answers two questions at once and therefore answers neither
  # cleanly. See build/STEP4_DECISIONS.md section 3.
  #
  # Made canonical BEFORE any rule reads it, deliberately. Nothing emits these
  # fields today -- no verdict record exists to carry them -- so this block
  # changes no output. It exists so the rule layer is built against the right
  # shape instead of being retrofitted once it has consumers.
  axes:
    canonical: true
    canonical_since: 2026-09-13
    fields: [evidence_source, construction]
    emitted_today: false
    emitted_today_note: >
      No verdict record exists yet, so nothing carries either field. This block
      is a schema decision, not an emit. The build hash must not move when it
      lands, and that is checked.

    evidence_source:
      question: "Where does the claim come from?"
      values: [source, book, source_and_book, none]
      meanings:
        source:          "data/source_2026.html states it."
        book:            "The Celestial Ledger states it; the source does not."
        source_and_book: "Both state it and they agree."
        none:            "No witness states it."
      widened_from_three_values: >
        STEP4_DECISIONS section 3.1 named three values -- source / book / none --
        and section 3.2's cross-tabulation then used a fourth, "source + book",
        on the BANKNIFTY Jupiter sector overlay row, where book_ch16, book_appB
        and the source all make the same assignment. The cross-tabulation
        enumerates actual rows and governs, so the value list is widened to four
        rather than the row being flattened into one witness. Recorded because
        collapsing it to `source` would have hidden a two-witness agreement and
        collapsing it to `book` would have dropped the source's own map -- the
        exact error rulership.corrections_on_record.ch15_silence_read_as_agreement
        was raised against.

    construction:
      question: "How is the verdict produced?"
      values: [printed, derived, null]
      meanings:
        printed: "The witness states the VERDICT itself. Nothing is inferred."
        derived: "A rulership is applied to a significator's condition."
        "null":  "No verdict is produced. The verdict field is null."
      null_is_a_value: >
        YAML null, not the string "null". It is a real member of the value set
        -- tier_4 constructs nothing -- and is the one construction under which
        a null verdict is legal.

    # -------------------------------------------- the pair is not sufficient
    # Checked against section 3.2 rather than assumed. (source, printed) appears
    # TWICE in that table with two different tiers: the Indian-equity rows at
    # tier 1 and the SPX/NDX rows at tier 2. The pair alone therefore cannot
    # reproduce the tier, and a third discriminator is required.
    #
    # This is not a third axis. It is a property of the EVALUATION, not of the
    # claim: whether the rule is evaluated on a civil day other than the one it
    # was authored against. Both axes are about the claim; this is about where
    # the claim is being applied.
    localized:
      is_an_axis: false
      is_a: evaluation_property
      question: "Is the rule evaluated on a civil day other than its authored one?"
      values: [true, false]
      set_by: civil_day_by_venue
      carried_as: >
        Already carried as flags, not invented here: SPX and NDX carry
        source_authored_for_indian_equities, and GC, SI and CL carry
        authored_ist_evaluated_venue_day. Both mean "authored against one civil
        day, evaluated against another" about two different mismatches.
      why_recorded_here: >
        Because without it the derivation below is not a function. Stated rather
        than resolved by picking one of the two (source, printed) rows, which
        would have silently reassigned either the Indian equities or SPX/NDX.

  # ================================================================ tier
  # DERIVED. Not a field a rule is written against; a name computed from the
  # pair above plus `localized`, kept for continuity with the eleven-instrument
  # table and the three reports that already use the names.
  tier_derivation:
    status: derived_convenience_mapping
    derived_from: [evidence_source, construction, localized]
    authority: >
      The axes are authoritative. Where a tier name and the pair disagree, the
      pair is right and the tier name is the lossy rendering -- which is the
      whole reason for the demotion. The known case is CL_rahu: the pair reads
      (source, derived), unambiguous and needing no flag, while the tier name
      reads source_backed, whose own definition says "nothing is derived".
    rules:
      # First match wins; the list is ordered, and `localized` is only consulted
      # where the pair is ambiguous.
      - {evidence_source: none,            construction: null,    tier: no_rule}
      # ADDED 13-Sep-2026, by the rule layer rather than by design. Catalogue B
      # contains sections that state a CONDITION and print no verdict at all --
      # Mars Combust Rise Cycle p.6 and Mercury Combust Rise Cycle p.10 are two
      # of them, bare tables with no remark and no inference. Ported faithfully,
      # such a rule fires with no verdict, and the pair it emits is
      # (source, null), which the six rows below did not cover.
      #
      # Its tier is NULL, and that is not the same as no_rule. no_rule means no
      # defensible rulership exists and nothing will ever attach; here the rule
      # exists, is source-backed and fires on real dates -- the source simply
      # declined to say what it means. The tier names classify a VERDICT, and
      # there is no verdict to classify.
      - {evidence_source: source,          construction: null,    tier: null,
         note: "condition-only section; the source prints no verdict"}
      - {evidence_source: source,          construction: printed, localized: false, tier: source_backed}
      # `localized` WAS ONE BOOLEAN AND IS NOW TWO SITUATIONS. 14-Sep-2026.
      # Folding them into one value put two different facts under one word:
      #
      #   cross_market   a rule the source authored for INDIAN equities, applied
      #                  to a DIFFERENT market -- SPX, NDX. The claim is carried
      #                  across a market boundary, which is a real extension.
      #                  Flag: source_authored_for_indian_equities.
      #   venue_shifted  the SAME instrument, the same rule text, the same sky,
      #                  differing only in which venue's midnight bounds the
      #                  civil day -- GC and SI against MCXGOLD and MCXSILVER.
      #                  Nothing is extended; only the day is localised.
      #                  Flag: authored_ist_evaluated_venue_day.
      #
      # Both answer yes to `axes.localized`'s question ("evaluated on a civil day
      # other than its authored one?"); the split says WHICH, so a reader never
      # has to guess whether the instrument moved or the clock did.
      - {evidence_source: source,          construction: printed, localized: cross_market,  tier: cross_market_localized}
      - {evidence_source: source,          construction: printed, localized: venue_shifted, tier: venue_shifted}
      - {evidence_source: source,          construction: derived, tier: source_backed}
      - {evidence_source: book,            construction: derived, tier: book_derived}
      - {evidence_source: source_and_book, construction: derived, tier: book_derived}
    localized_values: [cross_market, venue_shifted]
    localized_note: >
      The values `localized` may take. `false` means the rule is evaluated on the
      civil day it was authored against, which is every instrument except the
      five in civil_day_by_venue.changed_by_this_decision and the two SPX/NDX
      rows.
    unmapped_is_an_error: >
      A pair with no rule above is a build error, not a default. In particular
      (book, printed) has no row: the book prints no dated verdict for any
      instrument in scope, and inventing a tier for it would invent the claim.
    cross_tabulation: "build/STEP4_DECISIONS.md section 3.2"

  # ------------------------------------------------------------------- emit
  # `evidence_source` and `construction` are the REQUIRED fields on every
  # emitted verdict. `tier` is emitted too, but as a derived rendering of them:
  # it is not a comment, not a footnote and not inferable from the instrument,
  # so it travels with the verdict and no downstream consumer can mistake a
  # localized or derived verdict for a source-backed one.
  emit:
    canonical_fields: [evidence_source, construction]
    evidence_source_values: [source, book, source_and_book, none]
    construction_values: [printed, derived, null]
    tier_field: tier                 # DERIVED from the pair; still emitted
    tier_values: [source_backed, cross_market_localized, venue_shifted, book_derived, no_rule]
    tier_is_derived: true
    tier_must_agree_with_axes: >
      The emitted tier must equal tier_derivation applied to the emitted pair.
      A record where they disagree is a build error: it means one of the two was
      set by hand.
    also_required:
      - claim_tag                    # from labels.claim_tag
      - provenance                   # section or derivation the verdict came from
      - flags                        # list; may be empty, never absent
    null_verdict_allowed_only_at: {evidence_source: none, construction: null}
    null_verdict_allowed_only_at_tier: no_rule   # the same rule, in tier names
    rejection_rule: >
      A verdict record without evidence_source or construction, or with a value
      outside the sets above, is a build error and must fail the emit, not be
      defaulted. The same applies to a tier that is absent, outside tier_values,
      or disagreeing with the pair it is supposed to be derived from.

  # ------------------------------------------------------------------ tiers
  # Retained in full. The four entries below are no longer the model -- they are
  # the four DERIVED names, each now carrying the axis pair it renders. The
  # evidence, instrument lists, derivations and civil-day rulings inside them are
  # unchanged and remain load-bearing.
  tiers:

    tier_1:
      name: source_backed
      means: "The 2026 source states the verdict itself. Nothing is derived."
      # The pair this name renders. Two pairs render to it, which is precisely
      # why the name was demoted: the CL Rahu path is (source, derived) and its
      # means clause above says "nothing is derived".
      axes: {evidence_source: source, construction: printed, localized: false}
      axes_also_rendering_to_this_name:
        - {evidence_source: source, construction: derived, applies_to: CL_rahu}
      claim_tag: Classical           # as printed by the source; per-rule tag may
                                     # be narrowed at rule-writing time
      flags_added: []
      instruments: [MCXGOLD, MCXSILVER, NIFTY, BANKNIFTY, SUGAR]
      # GC AND SI MOVED OUT OF THIS LIST 14-Sep-2026, and the note is the reason.
      # They were listed here because their rule text is source-backed, which is
      # true. But `axes.localized` asks a different question -- whether the rule
      # is evaluated on a civil day other than the authored one -- and
      # civil_day_by_venue.changed_by_this_decision names GC and SI as exactly
      # two of the instruments whose day boundary MOVED. So they emit
      # `venue_shifted` now, while MCXGOLD and MCXSILVER -- the same metal, the
      # same rule, the same sky, a different venue's midnight -- emit
      # `source_backed`. The asymmetry is the civil-day decision showing through,
      # and tier_derivation.authority says the pair wins where a name disagrees.
      #
      # SUGAR STAYS LISTED AND EMITS NOTHING. Its nine named rule groups are
      # Chapter 1's `<section>` blocks at Sr.No 153-154 (pp.168-175), not
      # catalogue-B sections, so
      # no rule was ever registered for them and there is nothing for the
      # verdict layer to attach to. Recorded in
      # verdict_coverage.unported_configuration_sections below rather than
      # removed from this list, because the instrument IS tier 1 and the
      # absence is a build gap, not a coverage decision.
      instruments_note: >-
        GC and SI are absent by the 14-Sep-2026 localized split; SUGAR is present
        and empty by the configuration-section gap.
      evidence:
        gold: >
          "Gold -- Bullish Configuration" pp.136-144 and "Gold -- Bearish
          Configuration" pp.145-148. 19 named rule groups across the two (13 + 6,
          counted from the document -- this read 17 until 14-Sep-2026; see
          source_probability.corrections_on_record.gold_and_silver_config_group_counts).
        silver: >
          "Silver -- Bullish Configuration" pp.149-161 and "Silver -- Bearish
          Configuration" pp.162-167. 30 named rule groups across the two (20 + 10)
          -- the largest configuration set in the document. This read 29 until
          14-Sep-2026, same correction.
        sugar: >
          "Sugar and Jaggery -- Bullish Configuration" pp.168-173 and "Sugar and
          Jaggery -- Bearish Configuration" pp.174-175. 9 named rule groups.
          The bearish section closes with the source's own note "*Moon aspects to
          be added" -- an admitted incompleteness, carried forward as-is.
        indian_equities: >
          The source's general verdicts -- the weekday/panchang/transit rule
          families already fixtured under weekday_rule.coverage (12 families, 64
          printed rows) plus the p.44-p.104 named families. These are market-wide
          verdicts, not instrument-specific ones.
      banknifty_note: >
        BANKNIFTY reaches tier 1 through the general verdicts like NIFTY. It ALSO
        has a Jupiter sector path on which book_ch16, book_appB and the source all
        agree (source: "Vargottam Jupiter is Positive for the sectors ruled by
        Jupiter, particularly Banking and Finance"). That path is a derived
        overlay and must be emitted at tier 3 with the derived flags if it is used
        at all -- it does not upgrade, and is not merged into, the tier-1 rows.
      civil_day: by_venue            # DECIDED 12-Sep-2026. See
                                     # verdict_coverage.civil_day_by_venue.
      civil_day_resolved:
        was: >
          OPEN. GC and SI are COMEX/Globex instruments carrying IST-stamped
          source rules. Tier 2 localizes MARKET-GENERAL rule families by venue
          civil day, but the gold/silver configurations are INSTRUMENT rules, not
          market rules, so the tier-2 argument does not automatically extend to
          them. Until decided, GC/SI inherited the Mumbai civil day.
        now: >
          RESOLVED. The venue determines the civil day, for instrument rules as
          well as market rules. MCXGOLD and MCXSILVER evaluate on the Mumbai day;
          GC and SI evaluate on the New York day. The gold/silver configurations
          keep their IST authorship in provenance and every affected verdict
          carries the flag authored_ist_evaluated_venue_day.
        reason: >
          The alternative has COMEX gold firing on a day the contract was not
          trading. This is not a new convention -- it is the dual-location
          evaluation already in the build, keyed on VENUE rather than on tier.

      # CL also emits a tier-1-tagged row, via the SOURCE's own sector map
      # (Rahu -> Crude oil) rather than via a configuration section. It is
      # deliberately NOT added to `instruments` above, which lists instruments
      # whose VERDICTS the source prints.
      instruments_via_source_rulership: [CL]
      instruments_via_source_rulership_note: >
        OBJECTION RECORDED, IMPLEMENTED AS RULED. tier_1.means is "The 2026
        source states the verdict itself. Nothing is derived." The CL Rahu path
        does not meet that: the source states the RULERSHIP, and the verdict is
        still derived by applying it to Rahu's condition -- which is tier_3's
        definition. The tier was assigned by verdict_coverage.precedence, which
        ranks EVIDENCE, not verdict CONSTRUCTION. Consequence: a consumer
        filtering on tier == source_backed will pick up a CL row whose verdict no
        section of the source prints. That is mitigated, not removed, by the flag
        rulership_source_stated_verdict_derived carried on every CL_rahu row.
        Raised so the tier's meaning stays honest; the ruling stands.
      see_cl: verdict_coverage.tiers.tier_3.derivations.CL.paths

    tier_2:
      name: localized
      axes: {evidence_source: source, construction: printed, localized: true}
      axes_note: >
        Same pair as tier_1. `localized` is what separates them, which is the
        row that proves the pair alone cannot reproduce the tier. See axes.localized.
      means: >
        The SAME rule families as Indian equities, evaluated on the New York
        civil day. Not a new rule, and not a chart substitution.
      justification: >
        The source's rule families here are TRANSIT and PANCHANG rules. They
        reference no natal chart -- they condition on planetary position, tithi,
        nakshatra, yoga, karana and weekday, all of which are defined
        independently of any location's chart. Evaluating them on a different
        civil day is therefore a change of DAY BOUNDARY, not a change of rule.
        The machinery already exists: weekday_rule.evaluate_per_location is true,
        Mumbai and New York already produce separate rows, and the 2026
        divergence is measured (103 IST vs 119 NY, 90 shared).
      claim_tag: Framework
      flags_added: [source_authored_for_indian_equities]
      instruments: [SPX, NDX]
      civil_day: new_york           # = by_venue for US_cash; see civil_day_by_venue
      rule_families: "identical to tier_1.indian_equities -- no additions, no substitutions"
      explicitly_not: >
        Not a US natal/foundation chart, not the NYSE 1792 chart, not a
        re-derivation. Any verdict requiring a natal chart is OUT of tier 2.
      narrative_layer: excluded      # see verdict_coverage.narrative_layer

    tier_3:
      name: book_derived
      axes: {evidence_source: book, construction: derived}
      axes_also_rendering_to_this_name:
        - {evidence_source: source_and_book, construction: derived,
           applies_to: "BANKNIFTY Jupiter sector overlay, if used at all"}
      means: >
        No source verdict exists for the instrument. The verdict is derived by
        applying the reconciled rulership to the significator's condition.
      claim_tag: Framework
      flags_added: [book_derived, no_source_verdict]
      instruments: [CL]
      derivations:
        CL:
          # DECIDED 12-Sep-2026. CL carries TWO significator paths. Both are
          # emitted. NEITHER is primary. This is a deliberate non-resolution --
          # rulership.conflicts.crude_saturn_vs_rahu records why, at length, so
          # it cannot later be read as an oversight.
          significator_resolution: dual_path_deliberately_unresolved
          emit_both: true
          primary: null
          primary_note: >
            MUST stay null in the emitted record. The config records that the
            book favours Saturn; the OUTPUT must not pre-judge. Path order in
            this list is alphabetical by id and carries no ranking.
          flag_on_every_cl_verdict: crude_significator_contested
          contested: rulership.conflicts.crude_saturn_vs_rahu
          civil_day: new_york        # CME_Globex venue; see civil_day_by_venue
          path_overlap_2027: 0
          path_overlap_note: >
            The two paths are DISJOINT in 2027: 26 Saturn events + 8 Rahu events
            = 34, intersection empty. No CL verdict is ever produced by both
            paths, so they cannot contradict each other on a single event. The
            intended divergence test is population-level, not per-event. See
            rulership.conflicts.crude_saturn_vs_rahu.test_design.

          paths:

            - id: CL_rahu
              significator: Rahu
              axes: {evidence_source: source, construction: derived}
              axes_note: >
                Unambiguous under the canonical pair, and needs no flag to be
                legible. rulership_source_stated_verdict_derived stays on the
                row for consumers reading the derived tier name, and becomes
                redundant rather than load-bearing once the pair is emitted.
              tier: source_backed        # DERIVED from the pair above
              tier_number: 1
              tier_basis: verdict_coverage.precedence
              claim_tag: Classical
              flags: [crude_significator_contested,
                      source_sector_map,
                      rulership_source_stated_verdict_derived]
              rulership_witnesses: [source]
              cited_sections:
                - "source pp.210 and 214-218 -- Rahu row: '... Logistics, Crude oil, Pharmaceuticals ...'"
                - "source, same table -- Saturn's row carries 'Oil-seeds', an agricultural commodity, NOT crude"
                - "source scope clause -- 'Rahu rules all the commodities of any Nakshatra (Star) or Sign where it stays'"
                - "source usage -- 'Positive for Sectors ruled by Rahu' drives verdicts throughout the monthly event tables, so this map is the one the source's own verdicts run on"
              scope: "events whose bodies include Rahu -- 8 in calendar 2027, on the New York civil day"
              cross_reference: CL_saturn
              tier_objection: verdict_coverage.tiers.tier_1.instruments_via_source_rulership_note

            - id: CL_saturn
              significator: Saturn
              axes: {evidence_source: book, construction: derived}
              tier: book_derived         # DERIVED from the pair above
              tier_number: 3
              tier_basis: "no source verdict and no source rulership for this path"
              claim_tag: Framework
              flags: [crude_significator_contested,
                      book_derived,
                      no_source_verdict,
                      rulership_contested_by_source]
              rulership_witnesses: [book_ch15, book_ch16, book_appB]
              cited_sections:
                - "book_ch15 -- 'Saturn ... Iron, oil and crude, coal'; significator table 'Saturn | Oil / iron'"
                - "book_ch16 -- 'Saturn . Sun -> Oil, Energy, PSU, Heavy Industry'; table 'Saturn | oil / PSU / metals'"
                - "book_appB -- B.5 'Saturn | Oil, PSUs, mining, infrastructure, labour'"
              scope: "events whose bodies include Saturn -- 26 in calendar 2027, on the New York civil day"
              cross_reference: CL_rahu

    tier_4:
      name: no_rule
      axes: {evidence_source: none, construction: null}
      means: "No defensible rulership exists. The verdict field is null."
      verdict: null
      claim_tag: null
      flags_added: [no_defensible_rulership]
      instruments: [USDINR]
      reason: >
        A currency pair is a RATIO OF TWO ECONOMIES, not a thing a significator
        maps to. Do not assign Mercury, and do not assign anything else.
      corroborated_by_absence: >
        Checked rather than assumed. None of book_ch15, book_ch16, book_appB or
        the source's own sector map contains a currency row. The nearest item in
        any of them is book_appB's Mercury -> "trading/brokerage", which is about
        brokers, not FX.
      emit_anyway: true
      emit_anyway_reason: >
        USDINR rows are still emitted with verdict null, so the absence is VISIBLE
        in the output rather than looking like a gap in the build.

  # ------------------------------------------------------- civil day by venue
  # DECIDED 12-Sep-2026. The evaluation civil day is a property of the VENUE,
  # not of the rule type and not of the tier. This is NOT a new convention: it
  # is the dual-location evaluation already in the build
  # (weekday_rule.evaluate_per_location, Mumbai and New York rows already
  # produced side by side), re-keyed from rule type onto venue.
  civil_day_by_venue:
    rule: "Every instrument evaluates on the civil day of its venue's location."
    supersedes: >
      The provisional rule under tier_1 that had GC and SI inheriting the Mumbai
      civil day because their rules were authored in IST. Authorship is not
      venue.
    reason: >
      The alternative has COMEX gold firing on a day the contract was not
      trading. A verdict that cannot be acted on at its own venue is not a
      verdict about that instrument.
    map:
      NSE:         mumbai
      NSE_FX:      mumbai
      MCX:         mumbai
      physical_IN: mumbai
      US_cash:     new_york
      CME_Globex:  new_york
    by_instrument:
      mumbai:   [NIFTY, BANKNIFTY, MCXGOLD, MCXSILVER, USDINR, SUGAR]
      new_york: [SPX, NDX, GC, SI, CL]
    changed_by_this_decision: [GC, SI, CL]
    unchanged_by_this_decision:
      already_new_york: [SPX, NDX]        # tier 2 was always evaluated on the NY day
      already_mumbai:   [NIFTY, BANKNIFTY, MCXGOLD, MCXSILVER, USDINR, SUGAR]

    provenance_unchanged: >
      The source's gold and silver configuration sections keep their IST
      authorship in provenance. Nothing about the rule text, its page citation or
      its authored timezone is re-stamped. Only the day boundary the rule is
      evaluated against moves.
    flag_on_every_affected_verdict: authored_ist_evaluated_venue_day
    flag_means: >
      "This rule was authored against the Mumbai civil day and is being evaluated
      against the venue civil day." Carried on every GC, SI and CL verdict. SPX
      and NDX already carry source_authored_for_indian_equities, which says the
      same thing about a different mismatch; both flags may appear together.

    # ------------------------------------------------------ measured divergence
    # The user asked how many gold/silver verdicts land on a different date under
    # the venue day than under the Mumbai day. No verdicts exist yet, so this is
    # measured on the ADDRESSABLE EVENTS -- the upper bound on affected verdicts.
    measured_divergence_2027:
      basis: >
        build/astronomy_2027.json, comparing time.start_stamp.ist_date against
        time.start_stamp.et_date on the event classes each instrument addresses.
        Scope is every event landing in calendar 2027 under EITHER civil day.
      gold_classes:
        in_scope: 1277
        different_calendar_date: 536
        pct: 42.0
      silver_classes:
        in_scope: 1282
        different_calendar_date: 537
        pct: 41.9
      cl_classes:
        in_scope: 34
        different_calendar_date: 19
        pct: 55.9
        split: {saturn_path: "17 of 26", rahu_path: "2 of 8"}
      direction: >
        Always -1, never +1. IST is UTC+5:30 and ET is UTC-5/-4, so the New York
        civil date is either the same day or one day EARLIER; it is never later.
        Every one of the 536/537 shifts is a same-or-previous-day shift.
      year_membership_effect:
        gold:   {mumbai_day_2027: 1276, new_york_day_2027: 1276, shared: 1275}
        silver: {mumbai_day_2027: 1281, new_york_day_2027: 1281, shared: 1280}
        boundary_events:
          - "sign_ingress:moon:20261231T231708Z -- 01-Jan-2027 IST / 31-Dec-2026 ET. IN under the Mumbai day, OUT under the New York day."
          - "sign_ingress:moon:20271231T211011Z -- 01-Jan-2028 IST / 31-Dec-2027 ET. OUT under the Mumbai day, IN under the New York day."
      reading: >
        THE NUMBER IS LARGE AND THE USER ASKED TO SEE IT IF SO: roughly 42% of
        addressable gold and silver events -- 536 and 537 respectively -- land on
        a different calendar date under the venue day than under the Mumbai day.
        This is not a defect and not a surprise: a 9.5-to-10.5 hour offset moves
        any event stamped before about 10:30 IST back a day, and the Moon
        ingresses that dominate these populations are uniformly distributed
        across the clock, so a ~40% shift rate is exactly what a uniform
        distribution predicts. What it means practically: the SIZE of the
        gold/silver population is nearly unchanged (1276 vs 1276; one event in,
        one out, both Moon sign ingresses on a New Year boundary), but the DATE
        two in five of them carry changes. Anything that joins these verdicts to
        price data by date must key on the instrument's venue day, not on a
        single global date column, or roughly two in five GC/SI rows will be
        joined to the wrong session.
      cl_reading: >
        CL's shift rate is higher (19 of 34, 55.9%) purely because Saturn's 2027
        events cluster in the Indian morning; the population size is unchanged at
        26 + 8 under either day.

  # ------------------------------------------------------------- precedence
  precedence:
    rule: "Where a source-backed verdict and a derived verdict would both apply to the same event AND the same instrument, source-backed wins."
    loser_is_retained: true
    loser_flag: superseded_by_source
    do_not_drop: >
      The derived verdict is kept alongside the winner, flagged. A SYSTEMATIC
      disagreement between the two is a finding about the derivation -- if
      derived verdicts are silently dropped, that finding can never surface.
    audit_intent: "Count agreements and disagreements between the kept pairs once the rule layer runs."

  # --------------------------------------------------------- narrative layer
  narrative_layer:
    scope: "The source's Salient Features / prophecy prose (pp.192-231 and the dated prophecy entries)."
    anchored_to: india_chart
    localizes: false
    flag: india_chart_anchored
    do_not_extend_to: [SPX, NDX, GC, SI, CL, USDINR]
    reason: >
      This layer is natal, not transit. The source computes it from a chart cast
      for "January 1, 2026, 0:00:00, 72E50'00, 18N58'00 -- Mumbai, India" and
      reasons in house lords off that chart ("Presence of Mercury (1st and 10th
      Lord) ... in the 4th house"), and it repeatedly invokes India's own natal
      chart ("There are many planets in Ashlesha in India's natal chart";
      "Venus is Lagnesh in the natal chart of India"). Tier 2's justification --
      that the rules reference no natal chart -- is exactly what fails here, so
      tier 2 does not reach this layer.
    tier_2_covers: rule_layer_verdicts_only

  # ------------------------------------------------- addressable event counts
  # NOT a verdict count -- no verdicts exist yet. This is the count of 2027
  # astronomy records a tier's rules could attach to: the UPPER BOUND on how many
  # events could carry a verdict once the rules are written. Method: map each
  # named rule group in the governing sections to the event_class it anchors on,
  # then count build/astronomy_2027.json records of those classes whose civil
  # date falls in calendar 2027.
  addressable_events_2027:
    basis: "build/astronomy_2027.json, 1569 records over 01-Dec-2026 -> 01-Feb-2028"
    in_year_total: {ist_civil_2027: 1347, et_civil_2027: 1348}
    # UPDATED 12-Sep-2026 for two decisions: (a) the civil day is now set by
    # venue, so gold and silver split into a Mumbai-day and a New-York-day
    # count; (b) CL carries two significator paths, so tier 3 is the UNION of
    # both, counted on the New York day.
    recount_note: >
      Counts are per CIVIL DAY now, not per instrument-family. Where a family
      splits across venues the two counts are given separately even when they
      are numerically equal -- equal size does not mean the same events, and on
      the New Year boundary it demonstrably is not (see
      civil_day_by_venue.measured_divergence_2027.year_membership_effect).
    tier_1:
      gold:
        classes: [sign_ingress, nakshatra_ingress, navamsa_ingress, conjunction, station, combustion, lunation]
        MCXGOLD: {count: 1276, civil_day: mumbai}
        GC:      {count: 1276, civil_day: new_york}
        same_size_different_membership: true
        date_shifted_between_the_two: 536
      silver:
        classes: [sign_ingress, nakshatra_ingress, navamsa_ingress, conjunction, station, combustion, eclipse, lunation]
        MCXSILVER: {count: 1281, civil_day: mumbai}
        SI:        {count: 1281, civil_day: new_york}
        same_size_different_membership: true
        date_shifted_between_the_two: 537
      sugar:    {count: 795,  civil_day: mumbai, classes: [sign_ingress, nakshatra_ingress, conjunction, combustion, eclipse, lunation]}
      indian_equities: {count: 1347, civil_day: mumbai, classes: all_eleven}
      distinct_union_mumbai_day: 1347
      cl_rahu_path: {count: 8, civil_day: new_york, basis: "events whose bodies include Rahu", see: tier_3}
      cl_rahu_path_note: >
        Counted here as well as under tier 3 because the CL Rahu path emits at
        tier 1. It is NOT added into distinct_union_mumbai_day -- different
        instrument, different civil day, and the union above is the Indian-day
        population.
    tier_2: {count: 1348, civil_day: new_york, classes: all_eleven}
    tier_3:
      CL_total: {count: 34, civil_day: new_york, basis: "union of both significator paths"}
      by_path:
        CL_saturn: {count: 26, tier: book_derived,  basis: "events whose bodies include Saturn"}
        CL_rahu:   {count: 8,  tier: source_backed, basis: "events whose bodies include Rahu"}
      overlap: 0
      overlap_note: >
        Verified against the build, not assumed: no 2027 record carries both
        Saturn and Rahu, so 26 + 8 = 34 exactly and the union is a clean sum.
      previous_ceiling: 26
      change: "+8, from adding the Rahu path. Nothing was removed."
      civil_day_effect_on_count: >
        None. Both paths count 26 and 8 under either civil day; only the DATES
        move (17 of 26 Saturn events and 2 of 8 Rahu events shift by one day).
      book_derived_subtotal: 26
      book_derived_subtotal_note: >
        tier_3's own name is book_derived, but only 26 of the 34 CL rows are.
        The other 8 sit under tier 3 structurally, as CL derivations, while
        emitting tier source_backed. Recorded so the tier-3 count is not read as
        a count of book-derived verdicts.
    tier_4: {count: 0, reason: "verdict is null by construction"}
    caveat: >
      Gold's and silver's counts are dominated by Moon nakshatra/navamsa
      ingresses, which are in scope as ANCHORS but which most rule groups will
      further condition on planet, sign, vedha or weekday. The realised verdict
      count will be far smaller. These are ceilings, not forecasts.

# =========================================================== calendar rows
# WHAT THIS BLOCK IS: the shape of a row in build/calendar_2027.json, .csv and
# .html, and specifically the DISCRIMINATOR that says what kind of thing a row
# is.
#
# ADDED 15-Sep-2026, BEFORE the astronomy base track was added and not after.
# The ordering is the point. Until this block existed every row in the calendar
# was a verdict row, so `records: 6677` and `by_tier.no_rule: 3285` were counts
# of one population and could be read as such. Adding 405 astronomy rows to that
# file without a discriminator would have made both numbers mean something else
# while looking unchanged -- `no_rule` would have absorbed the base track, and
# every meta figure would have silently changed its denominator.
#
# That is the stale-denominator failure this build has now recorded three times
# (see source_probability.corrections_on_record and STEP4_DECISIONS section 12).
# The rule learned from the first two is that the discriminator is a
# PRECONDITION for the population it discriminates, never a follow-up.
row_kinds:
  status: defined
  defined: 2026-09-15
  field: row_kind
  required: true
  null_is_not_a_value: >
    Unlike `construction` and `tier`, where null is a member of the value set,
    row_kind has no null. A row whose kind is unknown is a build error. The
    renderer sets it at construction and the harness refuses a row without it.
  values:
    - id: verdict
      what: >
        One rule, one instrument, one venue civil day. The population that was
        the whole calendar until 15-Sep-2026. Carries the two canonical axes,
        the derived tier, a claim tag, a confidence, and a verdict or a null
        verdict.
      carries_instrument: true
      carries_tier: "the derived tier, which may be null for a condition-only rule"
      carries_verdict: "printed verbatim, or null"
    - id: event
      what: >
        One astronomy record from build/astronomy_2027.json, rendered as itself.
        The BASE TRACK. It is not a claim about any instrument and it is not the
        absence of one: it is the sky, which is the layer every rule row is
        computed from and which the calendar could not previously show.
      carries_instrument: false
      carries_tier: false
      carries_verdict: false
      evidence_source: none
      forbidden_fields_are_structural: >
        An event row is built from a different dataclass, BaseEvent, which has
        no instrument, tier, claim_tag, construction, verdict_text or
        source_probability field to set. It cannot acquire a verdict because
        there is nowhere on it to put one -- not because a check forbids it. The
        harness asserts the outcome anyway, since a later renderer could add the
        key by hand.
  every_meta_count_is_split_by_row_kind: >
    RULED 15-Sep-2026. `meta.records` is a total over both kinds and every count
    beneath it is keyed by row_kind first. A consumer reading `by_tier.no_rule`
    gets a figure whose denominator is stated. The one number that is NOT split
    is the grand total, and it is named `records` with `records_by_row_kind`
    immediately beside it so it cannot be read alone.

  # ------------------------------------------------- the base track's scope
  base_track:
    what: "the CORE EVENTS of build/astronomy_2027.json, on IST civil dates in the named year"
    event_classes: [sign_ingress, lunation, conjunction, opposition, apsis,
                    combustion, station, speed_crossing, eclipse, total_day]
    excluded:
      panchang_ingresses:
        classes: [tithi_ingress, nakshatra_ingress, yoga_ingress, navamsa_ingress]
        reason: >
          These are the Moon's own subdivisions of the day and they recur four
          to six times a day between them. Rendering them as calendar rows would
          put about 2000 rows of lunar bookkeeping in front of 405 events, and
          the panchang for any day is already carried ON every row that falls in
          it.
      horizon:
        classes: [sunrise, sunset]
        reason: >
          A sunrise is a location property, two per venue per civil day, every
          day of the year. It is an INPUT to the rules that use it, not an event
          the calendar reports.
    count: 405
    count_basis: >
      Counted off build/astronomy_2027.json by IST civil date of the start
      stamp. The file spans 01-Dec-2026 to 01-Feb-2028, so 67 core records fall
      outside IST civil 2027 and are not rendered: 472 core records in the file,
      405 in the year.
    empty_days_are_output_not_gaps:
      the_argument: >
        THE REASON THIS TRACK EXISTS, and the strongest of the three. A day
        carrying no row is a MEASUREMENT -- nothing the layer tracks happened --
        and a calendar that cannot be empty cannot report absence at all. A
        reader then has no way to tell "nothing happened" from "nothing was
        computed".
      measured: >
        MEASURED 15-Sep-2026, AND THE NUMBER IS NOT WHAT THE ARGUMENT ASSUMED.
        105 of the 365 days of 2027 carry no EVENT row, and those 105 are the
        absence the base track can now report. But ZERO days carry no row of any
        kind, and that is not because every day has an event -- it is because
        tier_4 emits a verdict-null USDINR row for every catalogue-B firing, and
        those blanket all 365 days. The combined calendar is never empty.
      days_with_no_event_row: 105
      days_with_no_row_of_any_kind: 0
      days_with_no_row_carrying_a_verdict_text: 2
      consequence: >
        Absence is reportable on the BASE TRACK, which means it is reportable
        only through `row_kind`. Filter to row_kind=event and the empty days
        appear; read the calendar whole and they do not. That is a second use
        for the discriminator that the argument for it did not anticipate, and
        it is recorded here rather than smoothed into the original claim --
        which said 32 days and was not measured against this build.
    rejoinable_to_the_ephemeris: >
      The second reason. Every base-track row carries the astronomy record's own
      id and its t_utc, so a reader can match a calendar row to the record it
      came from by key rather than by guessing at event name and date.
    the_sky_is_not_a_verdict: >
      The third reason, and the one the discriminator protects. An ingress is
      not a claim and carries no confidence, no tier and no claim tag. It is
      shown because it happened.

  # --------------------------------------------------------- eclipse contacts
  eclipse_contacts:
    ruled: 2026-09-15
    rule: >
      An eclipse row names its CONTACT. The astronomy record carries
      `time.contacts_global` fully stamped -- begin, max, end, and for a total
      or annular eclipse totality_begin and totality_end -- so a row that emits
      one unlabelled time is choosing one of five and not saying which.
    emit: [first_contact, maximum]
    emit_reason: >
      First contact is when the event begins and maximum is the instant the
      source's own eclipse material is stated about. The remaining contacts stay
      on the record and are reachable by id; they are not dropped, they are not
      rendered.
    never_emit_an_unlabelled_eclipse_time: true

  # ------------------------------------- the SECOND discriminator: row_span
  # Landed 21-Sep-2026 with the collapse, and defined for every row in the
  # file rather than only for the rows the collapse produced. See
  # finastro/render.py `collapse_windows`.
  row_span:
    status: defined
    defined: 2026-09-21
    field: row_span
    required: true
    why_it_is_a_second_field_and_not_a_third_row_kind: >
      `row_kind` means VERDICT vs SKY. Giving it a second axis -- window vs day
      -- would make `records_by_row_kind` a count over a cross product no
      denominator in `meta` is keyed to, which is the stale-denominator failure
      this file has recorded four times. SPAN_VS_DAILY_PROPOSAL.md section 3
      named the remedy before the collapse existed: a SECOND, SEPARATE
      discriminator, and it lands on every row, not only on the collapsed ones.
      A row that is still one civil day says so positively.
    values:
    - id: day
      what: >
        The row stands for ONE civil day at one venue. Every timed span row
        (the condition holds over an interval but its start is a measured
        instant, so those are left daily by decision -- Model B, deferred),
        every `anchored` point row, and every eclipse row.
    - id: window
      what: >
        The row stands for an INTERVAL of civil days in view, and carries
        `first_held` / `last_held` / `days_in_view` / `contiguous` from
        timezones.SpanDates. Produced only by `render.collapse_windows`.
    the_model_is_A_and_only_A: >
      Model A of SPAN_VS_DAILY_PROPOSAL.md: collapse the three no-instant
      causes whose daily rows carry nothing their window does not, and leave
      the two point-row causes and every timed span alone. Model B -- collapsing
      the timed spans too -- is REFUSED here and not merely deferred: it takes
      days_with_no_row_of_any_kind from 0 to 19 and falsifies a sentence the
      apparatus panel already publishes, so it is a different change with a
      different review.
    what_collapses:
      date_only: >
        Both halves of it -- the ephemeris date-granular windows AND b101's
        sky.civil_day_span. The census splits those two by rule id because the
        FIGURES need the split; the collapse does not, because neither half has
        an instant at either end and both repeat one pair of endpoints on every
        day they cover.
      period_cut: >
        Collapsed, and the open end is not a date the row asserts.
        `first_held` / `last_held` are VIEW properties by construction --
        SpanDates is built from the days civil_days returned, which are already
        cut by the period and clipped by the year -- so a row printing them
        asserts no boundary. `open_start` / `open_end` and `clipped_start` /
        `clipped_end` say which of the two ends is real. This supersedes
        section 2.3's `date_start: null`, which predates the year_clip ruling
        below; emitting a view property under a name that says it is one is
        what that section was asking for.
    what_does_not_collapse:
      anchored: >
        12 rows, 11 rules, all on 01-Jan-2027. A DECISION, not an oversight.
        The obvious span-model move is to give them the year -- "this body did
        not cross its frame all year" -- and that would be a measurement where
        there is none. The anchored date is one this build chose because
        nothing crossed; a year-long window reads as a state that was observed.
      named_contacts: >
        5 eclipse rows. Not a span question: an eclipse has SEVERAL instants,
        not none, and the contacts block is how it says so.
      timed_spans: >
        Model B. The rows carrying a clock time. A timed row's start is a real
        instant and collapsing it discards a per-day statement a reader may be
        using; whether that is worth the rows is a genuine question and a
        different one.
    duration_days_is_still_absent: >
      SpanDates carries `days_in_view` and no duration, and the collapse adds
      none. A duration asserts two REAL boundaries; an open span has at most
      one and a year-clipped span's other end is outside the file. Section 2.1
      asked for `duration_days` on the ephemeris windows because the source
      prints a Duration column; section 5.1 ruled it out generally and is the
      later ruling. Where all four of open_start / open_end / clipped_start /
      clipped_end are false, `days_in_view` IS that duration in days, and where
      they are not, no field here will say so.
    the_date_filter_is_an_overlap_test: >
      Section 5.3, landed with the collapse. A window row carries one sort date,
      so an HTML filter comparing it against from/to would drop a window running
      06-Feb -> 20-Feb from a reader's "from 10-Feb" view although it is live on
      every day they asked about. Every date-keyed consumer in the build now
      tests the row's COVERED DAYS: the HTML filter (iso_date_end beside
      iso_date), render._days_without, and tools/cause_census.py's firing,
      rule-venue-day and venue-date units.
    no_count_changed_meaning: >
      A FIRING IS STILL A FIRING. rules.base.fire emits one per (rule, firing
      location, civil day) and the collapse is a RENDERING operation downstream
      of it, so every count in the unit `firings` is identical before and
      after -- 331 / 142 / 105 / 11 -- and cause_census.py gets there by
      expanding a window row back over its covered days. What genuinely changed
      is the count of RENDERED ROWS, and that is published under its own name
      beside the daily-row equivalent rather than left to move underneath
      `records`.
    # RE-MEASURED 18-Nov-2026 when B10 Mercury Manifestation was ported: its
    # 3 Mumbai firings render 6 one-day window rows (instrument + USDINR), all
    # under the ephemeris-dated cause. Was 8121 / 8916 / 118 / 913; the delta
    # (-795) and every other cause are unchanged, which is the check.
    measured_2027:
      # 8127 / 8922 / 8003 until 18-Nov-2026, when Kshin (Malefic) Moon was
      # ported: 525 timed day rows (13 windows x Mumbai days x instruments).
      # Timed rows are not collapsed, so window_rows and the delta hold.
      rendered_rows: 8652
      daily_row_equivalent: 9447
      delta: -795
      window_rows: 124
      day_rows: 8528
      daily_rows_collapsed: 919
      non_contiguous_groups_left_daily: 0
      per_cause_P3:
        date_only_ephemeris:
          daily_rows: 513
          window_rows: 100
          delta: -413
        civil_day_span_b101:
          daily_rows: 255
          window_rows: 17
          delta: -238
        period_cut:
          daily_rows: 151
          window_rows: 7
          delta: -144
        anchored:
          daily_rows: 12
          window_rows: 0
          delta: 0
        named_contacts:
          daily_rows: 5
          window_rows: 0
          delta: 0
      the_delta_is_invariant_across_the_populations: >
        -795 in P1, P2 and P3 alike, and the same -413 / -238 / -144 in each.
        Every row the wider populations add to a collapsed cause is its own
        span and collapses to itself: P3's ephemeris cause holds 507 rows over
        94 spans where P1's holds 431 over 18. So the saving never rested on
        which population the cause figures were measured over, which was the one
        thing section 1 was disputing when section 3 was written. The TOTALS do
        move -- P1 5,539 -> 4,744, P2 8,511 -> 7,716, P3 8,916 -> 8,121 -- and
        each is stated with its population.
      the_proposal_measured_this_at_7082_rows: >
        SPAN_VS_DAILY_PROPOSAL.md reports 7,082 -> 6,287. That was 15-Sep-2026,
        before the configuration wiring's later rows, the base track's growth,
        three sub-table ports, Bhadra and the Moon's navamsa series. The
        POPULATION grew by 1,834 rows and the SAVING did not move at all, which
        is the invariance that section predicted, measured against a build it
        could not have seen. 6,287 is withdrawn as a forecast of today's file
        and stands as a correct P3 figure of the 15-Sep build; the P3 figure
        today is 8,121.
      empty_day_figures_are_unmoved: >
        0 days carry no row of any kind, 105 carry no event row, 2 carry no row
        with a verdict text -- all three identical before and after, because
        `_days_without` counts a window row on every day it covers and because
        tier_4's verdict-null USDINR rows are timed and were never collapsible.
        This is the half of the proposal's section 4 that made Model A
        preferable to Model B, and it is now measured rather than predicted.
    every_field_but_the_date_was_identical_across_the_collapsed_group: >
      MEASURED BEFORE THE COLLAPSE WAS WRITTEN, and asserted at build time
      rather than assumed. Over the 118 groups, the only fields that differ
      between the daily rows of one group are `date` and `date_ist`; 38 groups
      differ in those two and in nothing else, and the other 80 are single-day
      groups. `collapse_windows` raises on any other disagreement, so a later
      rule that makes a per-day statement inside a no-instant span cannot be
      collapsed away silently -- it fails the build instead.

  # -------------------------------------------- the time fields on every row
  # See finastro/render.py. The contract is short and all of it is load-bearing.
  time_fields:
    ruled: 2026-09-15
    t_utc: >
      The instant, for a row that has one. Added so the calendar is
      INDEPENDENTLY REJOINABLE to its astronomy: before it, matching a calendar
      row to an ephemeris record meant matching on event name and date and
      hoping.
    span_rows: >
      A row whose condition holds over an interval emits `t_start_utc` and
      `t_end_utc` and leaves `t_utc` null. One time cannot stand for two.
    span_endpoints:
      ruled: 2026-09-15
      the_question: >
        A span is half-open, [start, end). What does a row DISPLAY at its end
        -- the last day the condition holds, or the instant it ceases?
      the_ruling: >
        BOTH, UNDER NAMES THAT CANNOT BE CONFUSED, AND THEY ARE NOT THE SAME
        DAY. `t_end_utc` is the INSTANT the condition ceases and it is
        EXCLUSIVE: the civil day it lands in is a day the condition does not
        hold. A window's displayed end is `last_held`, the last civil day a
        row existed for, which is sky.civil_days(span, loc, year)[-1].
      why_it_is_a_blocker_and_not_a_detail: >
        b101's February Mumbai window ends at 2027-02-20T18:30:00Z, which is
        21-Feb-2027 00:00 IST; the last day it holds is 20-Feb. A collapsed
        row that stamps t_end_utc prints 21-Feb and is off by one on every
        closed window whose end falls on a venue midnight, in the direction
        that makes each window one day longer than the daily rows said it
        was. 251 of the 1,626 span groups in the 2027 build would move --
        RE-MEASURED 21-Sep-2026 at 316 of 2,938, the build having grown; 251
        stays attached to the build it was measured over rather than being
        refreshed in place. It is the sunrise-anchor class exactly: a
        systematic off-by-one that renders as a plausible date and passes every
        component test, because every component is correct.
      it_has_a_reader_since_21_sep_2026: >
        NO ROW CARRIED last_held UNTIL THE COLLAPSE. The type existed, the
        harness pinned it, and the ruling was correct -- and every row was one
        civil day whose own date was trivially its own last held, so the guard
        against stamping the exclusive instant had nothing to guard. It does
        now: render.collapse_windows emits 118 window rows, of which 108 are in
        the +1 set above, so a build that took a displayed end from t_end_utc
        would print 108 wrong dates. That is why 5.1 had to be settled BEFORE
        the collapse rather than during it -- the defect it prevents is one the
        collapse would have introduced whole, at a scale no spot check reaches.
      made_unconfusable_structurally: >
        timezones.SpanDates carries first_held / last_held and is built ONLY
        by timezones.span_dates(days), which takes the civil DAYS the rows
        were built from and raises TypeError on a datetime. Handing it
        t_end_utc fails at build time rather than printing 21-Feb. The same
        move DateStamp makes for clock times, one field along: the renderer
        cannot print what it has no way to obtain.
      days_in_view_is_not_last_minus_first: >
        A weekday-filtered rule's days are not contiguous, so SpanDates
        carries days_in_view = len(days) and a `contiguous` flag rather than
        letting a window claim days no row was built for. All the no-instant
        groups are contiguous -- 135 of them at 21-Sep-2026, 99 when this was
        written -- and the collapse now EMITS that flag on all 118 window rows
        and refuses to fold a group that lacks it.
      the_179_does_not_reproduce_and_is_withdrawn: >
        THIS KEY READ "179 of the timed span groups are not [contiguous],
        which is why the flag exists before Model B does". RE-DERIVED
        21-Sep-2026 against the rendered artifact under four span units --
        (row_kind, event, instrument, venue, t_start, t_end) at 2,938 groups,
        the rule-span unit at 1,434, rule+instrument at 2,938 and rule+venue at
        2,111 -- and every one gives ZERO non-contiguous groups, no-instant and
        timed alike. It does not reproduce against the pre-collapse artifact
        either, so this is not a collapse effect and the collapse is not what
        found it; re-measuring the claim the collapse depends on is. 179 was
        recorded against the 1,626-group build of 15-Sep-2026, no generator for
        it exists, and it is WITHDRAWN rather than corrected in place --
        section 12.16's shape, and the fourth figure on this page to go that
        way. NOTHING RESTED ON IT: no check asserted 179, and the `contiguous`
        flag is justified by what it PREVENTS and not by a count of live cases.
        A collapsed row over a group with a hole would claim days no daily row
        was built for, and render.collapse_windows refuses to fold one whether
        or not any exists today -- which is the only reading under which the
        flag's value does not depend on this number.
      duration_is_absent_by_design: >
        A duration asserts two REAL boundaries. An open span has at most one,
        and a year-clipped span's other end is outside the file. Emitting
        "364 days" for a state whose ends are both outside the year is the
        same wrong-answer-that-renders-plausibly shape in a new field.
      pinned_by: >
        tests/test_rule_layer.py::test_a_spans_displayed_end_is_the_last_day_
        it_holds -- which fails if a collapsed end is ever taken from
        t_end_utc, and fails equally if span_dates is "corrected" to agree
        with it.

    year_clip:
      ruled: 2026-09-15
      fields: [clipped_start, clipped_end]
      the_distinction: >
        THERE ARE TWO CUTS AND open_start / open_end ONLY MARK ONE. open_* is
        Sky.span_start's edge -- the condition was already running when the
        generated period began, so there is no boundary at all. clipped_* is
        sky.civil_days' second cut, which drops the days falling outside the
        calendar year. A span can have a REAL, MEASURED boundary and still be
        clipped: b009_mercury_combust_cycle starts 2026-12-13T18:30:00Z with
        open_start false, because Mercury genuinely went combust that day, and
        the calendar's first row for it is 01-Jan-2027.
      why_it_lands_before_any_collapse: >
        A daily render needs no such field: the out-of-year days simply have
        no rows and nothing is claimed about them. A COLLAPSED ROW ASSERTS AN
        EXTENT. One printing the true boundary starts before the file does;
        one printing the first day in view asserts a boundary the sky did not
        supply. Emitting one of the two and choosing silently is the shape
        12.16 is about, with every clipped span already waiting for it -- so
        the discriminator lands on the daily rows first, exactly as row_kind
        did.
      measured_2027:
        span_unit: (row_kind, event, instrument, venue, t_start_utc, t_end_utc)
        span_groups: 2983   # 2938 -> 2944 (B10) -> 2983 (Kshin Moon), 18-Nov-2026
        span_groups_note: >
          2,202 until 21-Sep-2026, when the Moon's navamsa series unblocked
          b071d and split b105, adding 736 span groups and -- this is the
          reading the note below set up -- MOVING NOTHING ELSE IN THIS BLOCK.
          clipped_start, clipped_end, both open_* pairs,
          real_endpoint_outside_the_year, of_which_no_instant and
          of_which_timed all held at 10, 27, 7, 22, 29, 1 and 28. So the two
          new families are bounded inside 2027 and neither reaches across a
          year edge, which is what Bhadra did and is the only thing this
          census is watching for.
          1,626 until the first sub-table ports of 20-Sep-2026, which added 81
          span groups and moved NOTHING ELSE in this block; 1,707 until Bhadra
          landed the same day and added 495. The reading the earlier note set
          up is what makes Bhadra interesting: a port adding spans is expected
          and uninteresting, and a port moving `clipped_start`, `clipped_end`
          or `real_endpoint_outside_the_year` means a new rule reaching across
          the year boundary. Bhadra DOES, and it is the first port that has.
        what_bhadra_moved_and_why: >
          Five of the seven figures moved, all by exactly 5, and the cause is
          ONE window: a Vishti karana opening 2027-12-31T16:03:14Z and closing
          2028-01-01T05:25:53Z -- 31-Dec 21:33 IST to 01-Jan 10:55 IST. It
          appears as 5 span groups because the span unit repeats a window per
          (instrument, venue), so one astronomical event moves every one of
          clipped_end, clipped_end_with_open_end_false,
          real_endpoint_outside_the_year and of_which_timed by 5.
          `open_end` is FALSE on all five, which is the point of the field:
          the sky supplied a real measured end and the CALENDAR is what cuts
          it, so a collapsed row printing 31-Dec would assert an extent the
          sky did not give. clipped_start held at 10 and
          clipped_start_with_open_start_false at 7, because no Bhadra window
          was already running when 2027 opened; of_which_no_instant held at 1,
          because a karana boundary is an instant and always has a clock time.
          A karana is about ten hours long, so roughly a one-in-two chance
          that the last window of the year straddles the boundary -- this is
          the expected behaviour of a short-span rule at a year edge and not a
          defect.
        # 10 / 27 / 7 / 22 / 29 / 28 until Kshin Moon (18-Nov-2026): its
        # windows that open in Dec-2026 and run past 31-Dec-2027 are clipped
        # at both year edges, three instrument rows each, all timed.
        clipped_start: 13
        clipped_end: 30
        clipped_start_with_open_start_false: 10
        clipped_end_with_open_end_false: 25
        real_endpoint_outside_the_year: 35
        of_which_no_instant: 1
        of_which_timed: 34
        under_the_rule_span_unit: >
          18 spans, 1 no-instant and 17 timed, grouping by (row_kind, event,
          location, t_start_utc, t_end_utc) instead -- the unit fire() emits,
          which does not repeat a window per instrument.
        the_22_that_was_recorded_is_a_different_set: >
          SPAN_VS_DAILY_PROPOSAL.md 5.2 reported "22 spans have a real
          endpoint outside the year and are not marked open -- 1 no-instant
          and 21 timed". 22 is the count of clipped_end groups ALONE: it
          leaves out the 10 clipped_start groups and does not apply its own
          open_* filter, so 5 of its 22 are already marked open_end. The
          re-derived figure is 24 under the same unit.
      both_ends_are_emitted: >
        The condition's true boundary stays on t_start_utc / t_end_utc and the
        in-year extent is SpanDates.first_held / last_held. clipped_* says
        which of the two a reader is looking at. Neither is dropped and
        neither is chosen silently.

    instant_precision:
      field: instant_precision
      values:
        exact: >
          Both endpoints are computed instants. The astronomy layer's own
          `time.precision` (exact / minutes / hours) rides on the record and is
          a statement about ACCURACY; this field is a statement about EXISTENCE.
        date_only: >
          The endpoints are civil-day boundaries. There is no instant, because
          the thing that produced the row was date-granular: a combust or rise
          record the ephemeris emits as a date, a window built by
          sky.civil_day_span, or a total day.
        anchored: >
          The endpoint is a DATE THIS BUILD CHOSE, not one the sky or the
          calendar supplied. The reference-table carried-in rows are the only
          case: a body that did not cross its frame inside the span has no
          crossing to be dated at, so the row is anchored at the named year's
          first instant. That anchor is a rendering decision and must never read
          as a measurement.
      no_instant_reason:
        what: >
          A row without an instant carries WHY, and the why is not one answer
          but three. `instant_precision` is a property of the span; this is the
          property of the ROW, and it adds the fourth case, which is not a
          precision at all.
        values:
          date_only: "the ephemeris never resolved this to a moment"
          period_cut: >
            the boundary is where the GENERATED PERIOD was cut, not where the
            sky changed -- Span.open_start / open_end. The span's own precision
            is `exact` and its other end may well be an instant; this end is
            not. 142 catalogue-B firings over 7 spans, on b079, b084, b086 and
            b099, whose shared-sign windows were already running at the carry-in.
            (RE-MEASURED 15-Sep-2026. This key read `147 firings, on b084, b086
            and b099`. Both halves were wrong: 147 reproduces against nothing,
            and b079 is a fourth rule in the population -- the three named total
            133. See time_fields.the_four_causes_were_re_derived below.)
          anchored: "the date was chosen by this build"
          named_contacts: >
            the row has SEVERAL instants and names them, so one unlabelled time
            would be choosing among them without saying which. Eclipses: the
            record carries begin, maximum, end and, for a central eclipse, both
            totality contacts, every one fully stamped. This is the same rule as
            the other three pointing the other way -- a row may not print a time
            it cannot identify -- and it is the only reason here that is not a
            shortage of information.
        the_remedies_differ: >
          Kept as three values rather than one boolean because they are not
          interchangeable. A date_only endpoint would need a new ephemeris
          scan; a period_cut endpoint would need a wider generated span; an
          anchored one cannot be remedied at all, because the thing it reports
          is that nothing happened.
      a_row_without_an_instant_cannot_emit_a_clock_time: >
        STRUCTURAL, NOT DISCOURAGED. `date_only` and `anchored` rows are stamped
        by timezones.date_stamp, which returns a DateStamp carrying dates and
        weekdays and NO time attribute at all. Code in that branch that tries to
        read a clock time raises AttributeError at build time. The previous
        arrangement -- one stamp type with times always present -- emitted
        "00:00 IST" on every one of them, and there was no way to write the
        renderer that did not.
      why_the_display_string_was_not_the_test: >
        THE PRINCIPLE, which does not depend on the count: b102_anuradha_on_sunday
        on 03-Oct-2027 is a nakshatra ingress at 00:00:22 IST -- a genuine
        instant that renders as 00:00 -- so no rule phrased over the printed
        time could keep it while dropping the rows that have no instant at all.
        The artifact's surface is not the thing to test; the property behind it
        is. (The figures this key carried, 663 rows across 28 events by display
        string and 662 across 27 structurally, are WITHDRAWN -- see
        the_four_causes_were_re_derived.)
      the_four_causes_were_re_derived:
        re_derived: 2026-09-15
        why: >
          The four cause figures were recorded as 249 / 147 / 45 / 12 firings
          over 662 rows and 27 rules. Measured against the rendered artifact
          three of the four reproduce against nothing, and a proposal measured
          later reported 331 / 282 / 105 / 11 -- of which one figure was a
          second measurement of the FIRST cause written into the SECOND cause's
          slot. Neither set was adopted; both were re-derived.
        the_population_is_now_stated_not_described: >
          894 rows over 99 spans carry no clock time -- 858 verdict and 36
          event, 9 of them configuration-sourced. Every one of those numbers is
          on the rendered artifact under meta.time and is recomputable by
          grouping the rows, which is the property the withdrawn figures lacked.

          THE UNIT UNDER meta.time MOVED ON 21-SEP-2026 AND THIS FIGURE IS
          RESTATED RATHER THAN LEFT STANDING. The collapse made
          `rows_without` a count of RENDERED rows -- 135 -- and the daily count
          it used to be lives beside it as
          `by_no_instant_reason_daily_row_equivalent`, summing to 930 over the
          grown build. 894 remains a correct count of the 15-Sep-2026 file in
          the unit that file had. The recomputability claim is unchanged: both
          numbers are still obtained by grouping the rows, one of them through
          render.covered_days.
        the_unit_must_travel_with_the_figure: >
          A FIRING is one (rule, location, civil day) -- what rules.base.fire
          emits. A ROW is one firing resolved to one instrument, so tier_4's
          USDINR row and a SUGAR row from the same firing are two rows and one
          firing. The recorded table mixed them in a single row of four: three
          columns were firings and the fourth was headed "12 rows". 12 rows and
          11 firings are both correct and neither moved.
        the_three_axes_travel_with_the_four_figures:
          ruled: 2026-09-16
          why: >
            A COUNT IS NOT A MEASUREMENT WITHOUT ITS POPULATION, ITS UNIT AND
            ITS FILTER. Every figure this build withdrew was arithmetically
            correct over a set nobody had named: 282 was the first cause on a
            second key, 45 was the Mumbai half of 105, 12 counted rows where
            its neighbours counted firings. Recording `331` alone would leave
            the four indistinguishable from exactly those near-misses, so the
            axes are keys here and are pinned by the harness beside the values.
          population: >
            P1 -- catalogue-B verdict rows only: row_kind == "verdict" and the
            rule id does not start with `cfg_` or `sub_`. 5,539 DAILY rows,
            rendered as 4,744 after the collapse of 21-Sep-2026, out of 8,916
            daily and 8,121 rendered. The figures below are firings and are
            unmoved by that, because a firing is one (rule, firing location,
            civil day) and the collapse is a rendering operation downstream of
            it -- see row_kinds.row_span.no_count_changed_meaning. The two
            population sizes are stated together for the same reason the
            figures carry their unit: 5,539 and 4,744 are the same population
            counted in the two units this file now has. Reconstructed by filter
            rather than by rebuild, which is what makes the pre-wiring figure
            checkable against today's artifact.

            IT WAS 5,209 UNTIL 21-SEP-2026 AND THE MOVE IS THE LEGITIMATE CASE
            the sub-table leak below was contrasted against. Two catalogue-B
            rules changed: b071d unblocked when the Moon's navamsa series
            arrived, and b105 split into a window and a verdict when its
            vargottama defeater became computable. A catalogue-B population
            moving because catalogue-B rules moved is the figure working. The
            20-Sep-2026 move from 5,209 to 5,314 was the opposite -- sub-table
            rows walking into a population defined as "not cfg_" with no
            catalogue-B rule changing at all -- and that is why the two are
            recorded side by side rather than as one number with a history.
          unit: >
            firings -- distinct (rule, FIRING LOCATION, civil day), the unit
            rules.base.fire emits. Firing location is verdicts.VENUE_OF applied
            to the instrument, NOT the venue field: Mumbai carries three
            venues, so counting by venue turns b101's 105 into 150.
          filter: >
            no_instant_reason is not null. Not a display-string test -- b102
            renders 00:00 IST from a real instant at 00:00:22 and is outside
            this population, which is how the withdrawn 662 was built.
          generator: tools/cause_census.py
          asserted_by: >
            tests/test_rule_layer.py::test_the_cause_census_figures_carry_the_
            population_that_produced_them -- which IMPORTS the generator rather
            than recounting, so a drift in either fails rather than agreeing
            with itself.
          census_cause_of_each_key:
            date_only_ephemeris: date_only_ephem
            period_cut: period_cut
            civil_day_span: date_only_b101
            anchored: anchored
        # 331 / 431 until 18-Nov-2026; B10 adds 3 firings, 6 daily rows.
        catalogue_b_firings:
          date_only_ephemeris: 334
          period_cut: 142
          civil_day_span: 105
          anchored: 11
        catalogue_b_rows:
          date_only_ephemeris: 437
          period_cut: 151
          civil_day_span: 255
          anchored: 12
        population_sensitivity:
          what: >
            ONLY ONE OF THE FOUR MOVES WITH THE POPULATION, and knowing which
            is the difference between a figure that needs its population
            stated and three that would survive a wrong one. The ephemeris
            windows gain rows from the configuration port (P2), from the
            sub-table port (P2 again, 20-Sep-2026) and from the base track
            (P3); b101, the carry-in cuts and the anchored rows are catalogue
            B's alone and are identical in all three.

            P1x IS A SLICE AND NOT A NESTED POPULATION, and it is listed with
            the other three because leaving it out is how a population goes
            unnoticed. P1, P2 and P3 nest; P1x is the sub-table rows ALONE,
            disjoint from P1, and P1 + the configuration rows + P1x is P2. It
            is what the third registry contributes, stated on its own so the
            P2 figures cannot absorb it silently -- which is exactly what
            happened to P1 itself on 20-Sep-2026, when `sub_` rows walked into
            a catalogue-B population defined as "not cfg_" and took it from
            5,209 to 5,314 with no catalogue-B rule changing.

            P1x's three zeros are a RESULT and not an omission: they say the
            sub-table port contributes no carry-in cut, no b101 window and no
            anchored row, which is the same sentence "catalogue B's alone"
            makes about the other populations.
          the_trap_this_closes: >
            An invariant figure passes a check that names the wrong population.
            331 does not, and it is the one the harness therefore pins in all
            three -- 331 occupies exactly ONE cell of the census grid's 108.
          date_only_ephemeris: {P1: 334, P1x: 12, P2: 355, P3: 386}
          b010_port_2026_11_18: >
            331 / 352 / 383 before B10 was ported; its 3 firings move all three
            nested populations by exactly 3 and leave P1x and the other three
            causes where they were.
          period_cut:          {P1: 142, P1x:  0, P2: 142, P3: 142}
          civil_day_span:      {P1: 105, P1x:  0, P2: 105, P3: 105}
          anchored:            {P1:  11, P1x:  0, P2:  11, P3:  11}
          superseded_before_the_sub_table_port: >
            P2 read 340 and P3 read 371 for the ephemeris cause until
            20-Sep-2026, over a build with two registries. The sub-table port
            added 12 date-only firings -- the 12 Total Days, Mumbai only --
            and both figures moved by exactly that: 340 + 12 = 352,
            371 + 12 = 383. P1 did not move, and that is the check: a port
            that changed a catalogue-B figure would have been a port that
            reached into catalogue B.
        the_near_misses_are_pinned_as_absences: >
          249, 147, 662 and 45 appear in NO cell of the grid -- three
          populations x six causes x six units -- and the harness asserts that
          rather than leaving them withdrawn only in prose. 282 appears in
          exactly one cell and it is the FIRST cause's (venue, date) count in
          P3, not anything of the second cause it was filed under. 11 is also
          the anchored RULE count, stated here because it is the one place two
          units agree and a check that did not say so would look stronger than
          it is.
        what_moved_and_what_did_not: >
          NOTHING MOVED BECAUSE THE POPULATION MOVED. The same rule families
          counted against the pre-wiring, pre-base-track 5,209-row build give
          the same figures: 431 rows / 331 firings for the ephemeris windows,
          255 / 105 for b101, 398 rows for the four carry-in rules. The base
          track added 31 event rows and 5 eclipse rows to the no-instant
          population and the configuration wiring added 9 -- 45 rows of 894,
          none of them catalogue B. Every difference between the two recorded
          sets is a unit or a derivation defect.
        the_diagnosable_ones_measured:
          at_282s_cell: 305   # 300 until B10 added its 3 Mumbai dates
          what: >
            THE CELL, NOT THE VALUE. 282 was diagnosed by finding WHERE it
            came from: the first cause's distinct (venue, date) count in P3,
            filed under the second cause's firings. That diagnosis is a
            statement about a CELL of the grid, and the cell goes on existing
            after the number in it changes. The sub-table port took it from
            282 to 300 on 20-Sep-2026 by adding 18 (venue, date) pairs, and
            nothing about the diagnosis moved.

            Pinning 282 itself would have gone stale there, and would have
            gone stale as a PASS turning into a FAIL for a reason that is not
            a defect -- which is the stale-denominator failure row_kind
            landed to prevent, arriving from the other direction.
        the_diagnosable_ones: >
          45 was the Mumbai half of 105: b101 is per_location and fires 45 times
          at Mumbai and 60 at New York. 12 counted rows where its neighbours
          counted firings. 282 is the count of distinct (venue, date) pairs
          among the 471 date_only ephemeris rows -- the first cause measured on
          a different key and filed under the second. 249, 147 and 662 are
          diagnosed as nothing; they reproduce against no slicing of this build
          or of the one before it.
        the_rule_this_leaves: >
          A FIGURE WITHOUT A GENERATOR IS NOT A MEASUREMENT, AND A GENERATOR
          WITHOUT A CHECK IS NOT ONE EITHER. Both withdrawn sets were written by
          hand into prose. The four above are keys, and tests/test_rule_layer.py
          recomputes them off the artifact, so a figure and the build can no
          longer disagree quietly.
          (THIS SENTENCE WAS WRITTEN BEFORE IT WAS TRUE. From 15-Sep-2026 the
          four were keys and cause_census.py regenerated them, but no check
          failed when they drifted -- the census was the one number-producing
          tool in the build with nothing behind it. The check named in
          the_three_axes_travel_with_the_four_figures.asserted_by landed
          16-Sep-2026 and was falsified three ways before it was believed: the
          recorded sensitivity flattened to 331/331/331, the axis map re-pointed
          so civil_day_span claimed the ephemeris cause, and the generator's own
          P1 widened to include cfg_ rules. Each fails; the third fails seven
          checks.)

# ====================================================== source probability
# WHAT THIS BLOCK IS: the 2026 source's own probability labels, carried forward
# as PROVENANCE and as nothing else. It records which labels transfer, to what,
# and -- at length, because the populated count is tiny and the field is easy to
# misread -- what the field must never be used for.
#
# NO VERDICTS ARE GENERATED HERE. Nothing in build/astronomy_2027.json carries
# this field: tests/test_2027_astronomy.py::test_no_interpretation_leaked bans
# `source_probability` from the astronomy layer, and that ban STAYS. The field
# attaches to rule-layer verdicts, when a rule layer exists.
#
# Every count in this block was verified against data/source_2026.html
# (437578 bytes, md5 5e098446d6dd13d3df8443528db5dd95) and against
# build/astronomy_2027.json, and is locked by the harness -- see `asserted_by`
# at the foot of the block.
source_probability:
  status: annotation_layer_defined_no_verdicts_generated
  defined: 2026-09-13
  field: source_probability
  emitted_on_astronomy_records: false
  attaches_to: rule_layer_verdicts

  # -------------------------------------------------------------- description
  # REQUIRED READING BEFORE USING THE FIELD. This text exists so that a later
  # reader who meets a mostly-empty column does not draw the wrong conclusion
  # from its emptiness.
  description: >
    AN ANNOTATION, NOT A COMPUTABLE COLUMN. source_probability records that the
    2026 source asserted a likelihood for a named configuration, in the source's
    own words. It is populated on roughly 26 rows out of thousands -- 15
    astronomy records and about 11 rule-layer firings, against a Step-4
    denominator that runs into the thousands once the weekday and panchang
    families are written (12 weekday families alone produced 103 Mumbai and 119
    New York qualifying dates in 2026, and the source's rule catalogue holds 141
    sections). The populated share is under 1%.

    It is therefore NOT FILTERABLE, NOT WEIGHTABLE and NOT AGGREGABLE: no query
    may select on it, no scoring may weight by it, and no summary may average,
    rank or count over it. It carries NO CALIBRATION -- the source states no
    basis, no sample and no hit rate for any label, and the labels are shown
    below to be per-occurrence editorial judgements rather than properties of a
    rule (see headline_finding).

    THE REASON THIS IS WRITTEN HERE: a field this sparse looks like a field that
    failed to populate. It did not. 26 rows is the true and complete extent of
    what the source's label scheme transfers to 2027, measured rather than
    estimated. Sparsity here is the finding, not a defect, and must never be
    read as absence of signal or as missing data awaiting a backfill.

  # ---------------------------------------------- separation from `confidence`
  # The two fields are unrelated and must stay unrelated in code as well as in
  # documentation.
  not_a_confidence:
    separate_field: confidence
    confidence_value: untested              # labels.confidence_default
    confidence_raised_only_by: pre_registered_backtest
    no_derivation_in_either_direction: >
      source_probability MUST NOT feed confidence, and confidence MUST NOT be
      derived from source_probability. No code path may map one onto the other,
      in either direction, by any rule -- not as a default, not as a prior, not
      as a tie-break. A label with no stated basis, no sample and no hit rate
      cannot raise a confidence, and naming it confidence would import an
      authority the source never earned.
    why_the_name: >
      The field is named for what it is: the SOURCE's probability, as printed.
      The name states its provenance rather than its standing.

  # ------------------------------------------------------------ transfer test
  # All three must hold. Objective, not editorial; each was computed rather than
  # judged by reading.
  transfer_test:
    test_1_generic_configuration: >
      The block's title names a CONFIGURATION generically, not an instance.
      "Venus Combust in the East" transfers although its 2026 window is dated --
      the dates are that year's occurrence of a recurring rule. "Jupiter
      Vargottam in Gemini" and "Rahu in Dhanistha" do not: the sign or nakshatra
      binding IS the configuration.
    test_2_recurs_in_span: >
      The configuration actually recurs inside the generated span
      (01-Dec-2026 -> 01-Feb-2028 IST). Computed from build/astronomy_2027.json,
      never judged by reading.
    test_3_maps_to_a_catalogue: >
      The configuration maps to a rule family that exists. Evaluated against the
      union of BOTH catalogues -- see catalogues below. A label mapping to
      neither is an ORPHAN: recorded, never given a family of its own.
    catalogues:
      A:
        what: "the 20 emitted rule_family values in build/astronomy_2027.json"
        count: 20
      B:
        what: >
          the 141 Chapter-1 rule sections of data/source_2026.html -- every
          h3.section element in the document (142) except the Table of Contents
          heading. This is the catalogue Step 4's rule layer is being built FROM.
        count: 141
        carries_labels: 0
      C:
        what: >
          the 58 named instrument configuration groups of Chapter 1's
          configuration blocks, Sr.No 149-154 --
          13 + 6 gold, 20 + 10 silver, 7 + 2 sugar. Counted from the document by
          finastro/cfgsections.py, never from this file.
        count: 58
        carries_labels: 0
        added: 2026-09-15
        added_by: test_3_recount_against_all_three_catalogues
      union_rule: "a label passes test 3 if it maps into A, into B, or into C"

      # ---------------------------------------------------------- THE RECOUNT
      # RULED 15-Sep-2026. `b_counts_ruling` below is kept as written and is
      # SUPERSEDED, not replaced: it decided that catalogue B counts, and the
      # reasoning it gave applies with equal force to the configuration
      # catalogue, which did not exist when it was written.
      test_3_recount_against_all_three_catalogues:
        ruled: 2026-09-15
        supersedes: b_counts_ruling
        the_same_reasoning: >
          b_counts_ruling excluded nothing on evidence; it included catalogue B
          because "excluding them because the astronomy layer has not reached them
          yet would make the answer depend on BUILD ORDER rather than on
          evidence." The 58 configuration groups were ported after that ruling was
          written. Leaving them out for that reason is the same dependence on the
          order we happened to do the work.
        arithmetic_before: "19 pass / 12 fail test 1 / 12 fail test 2 / 1 orphan = 44"
        arithmetic_after: "19 pass / 12 fail test 1 / 12 fail test 2 / 1 orphan = 44"
        # The same two lines as numbers. The prose above names the tests, and a
        # harness reading digits out of it picks up the 1 in "test 1" and the 2
        # in "test 2" -- which it did, and still summed to 44, by coincidence. A
        # check that passes for the wrong reason is the thing this whole block
        # is about, so the figures are stated as figures.
        counts_before: {pass: 19, fail_test_1: 12, fail_test_2: 12, orphan: 1}
        counts_after:  {pass: 19, fail_test_1: 12, fail_test_2: 12, orphan: 1}
        labelled_blocks: 44
        # ON RECORD as STEP4_DECISIONS.md 12.16's SEVENTH INSTANCE, and the
        # first one in which the CHECK was the defect and the code it checked
        # was correct. Recorded as a key rather than only in the comment above,
        # because every other instance of the shape is addressable by one and
        # this was the hardest of the seven to see.
        the_first_check_read_test_names_as_figures:
          found: 2026-09-15
          recorded_as: "STEP4_DECISIONS.md 12.16, seventh instance"
          what_it_read: [19, 12, 1, 12]
          what_it_should_have_read: [19, 12, 12, 1]
          why_it_passed: >
            The 1 and the 2 in "fail test 1" and "fail test 2" are the test
            NAMES. A regex over the prose line cannot tell a name from a figure,
            so it took the first 1 as the third count, never reached the orphan
            count at all, and read 12 once instead of twice. 19 + 12 + 1 + 12 =
            44 by coincidence, so the arithmetic closed and the check passed on
            four numbers, three of them wrong and one of them a label.
          what_caught_it: >
            PRINTING THE INTERMEDIATE VALUE -- the list the scraper had built --
            rather than the pass/fail line, which read [PASS] both before and
            after the fix. No re-run and no before/after comparison could have
            separated them; only the value the check had actually read.
          the_lesson: >
            Before believing any new CHECK, print what it read. A boolean is the
            one output of this build that carries no evidence of what produced
            it. This and the sixth instance both came out of work done to FIX
            earlier instances, which is why remediation gets the same treatment
            as a new emit rather than more trust.
          fix: >
            counts_before and counts_after above. The harness reads four NAMED
            keys and raises KeyError on a missing one; the prose line stays
            prose and nothing parses it.
        the_totals_do_not_move: >
          AND THAT IS NOT THE INTERESTING PART. Adding a catalogue can only turn a
          test-3 failure into a pass, and the tests are ordered: a block failing
          test 1 or test 2 never reaches test 3, so the 24 blocks in those two
          columns cannot move. Only the single orphan and the 19 passes were
          re-evaluated.
        what_actually_changed: >
          ONE PASS CHANGED ITS ROUTE, AND IT WAS THE ONE THAT DID NOT HAVE ONE.
          Block 13, rahu_mars_together, is recorded as catalogue B. It is not in
          catalogue B: zero of the 141 h3.section titles name Rahu and Mars
          together, which corrections_on_record.rahu_mars_is_not_a_catalogue_b_section
          already found. It is not in catalogue A either -- the astronomy layer
          emits no conjunction or opposition record for a node, so no Rahu pair
          exists in any of the 26 families. Under catalogues A and B alone, as this
          file's own `catalogue` fields are written, block 13 is an ORPHAN and the
          arithmetic is 18 / 12 / 12 / 2.
        so_the_recorded_19_was_right_by_accident: >
          The figure 19 was correct and the reason given for it was not. Catalogue
          C is what makes it true: "Rahu Mars Together in Any Sign" is gold-bullish
          group 3 and silver-bullish group 26, and the family's own `rules` list
          has named cfg_gold_bullish_03 and cfg_silver_bullish_07 since the
          per-rule attachment. The recount does not change the count; it supplies
          the count's missing ground.
        checked_per_family: >
          All 11 carried families were re-tested against all three catalogues, not
          only the disputed one. Ten pass through A or B exactly as recorded --
          conj_sun_mercury, conj_mercury_venus, conj_venus_uranus, combust_venus,
          combust_saturn, combust_jupiter and rise_venus through A;
          mercury_venus_alone, venus_jupiter_same_sign and mars_ahead_of_jupiter
          through B. Block 13 is the only one whose recorded catalogue does not
          hold.
        the_orphan_stays_an_orphan:
          block: 4
          title: "Mars (Sagittarius) Tenth to Saturn"
          result: "still fails test 3 under all three catalogues"
          catalogue_a: "no relative-house family among the 26 emitted rule_family values"
          catalogue_b: >
            no relative-house section among the 141. Zero titles match tenth,
            twelfth, 10th, 12th, house or aspect.
          catalogue_c: >
            ONE CANDIDATE, AND IT IS DECLINED. Gold-bullish group 6, "If Mars is
            Aspected by Saturn and Jupiter is Retrograde". Mapping block 4 onto it
            takes three re-derivations: asserting the Parashari special aspect
            (Saturn aspects its 3rd, 7th and 10th) that the source states in
            neither place; dropping the group's Jupiter-retrograde conjunct; and
            reading a ONE-position condition as a THREE-position one. A narrower
            condition mapped onto a broader group and called the same family is
            the group-key-for-a-member-key error running backwards, which is the
            error this file exists to keep recording.
          and_its_twin_settles_it: >
            Block 12, "Mars Twelfth to Saturn", is the same shape and carries VERY
            HIGH. The twelfth is not a Saturn aspect position at all, so the aspect
            identity that would rescue block 4 leaves block 12 exactly where it is.
            A family that receives one relative-house label and not its twin is not
            a family. orphans.mars_tenth_to_saturn.do_not_create_a_family stands.
        catalogue_a_count_is_stale:
          recorded_here: 20
          # Every re-measurement, dated, rather than one field overwritten.
          # The test reads the NEWEST `measured_*` key it finds instead of
          # naming one, so a new series moves this record by adding a line and
          # cannot move it by quietly editing the old number. The drift is the
          # thing worth keeping; a single mutable field would erase it.
          measured_2026_09_15: 26
          measured_2026_09_20: 27
          measured_2026_11_18: 29
          what_moved_it_2026_11_18: >
            Two families: motion/mercury_overtakes_venus and
            motion/venus_overtakes_mercury, the speed_overtake series added to
            port B10 Mercury Manifestation. Neither is a relative-house or node
            colocation family, so the recount is unaffected.
          what_moved_it_2026_09_20: >
            One family: ingress/karana, the karana boundary series added with
            the Bhadra port. 866 records a year, the tithi scan at half its
            arc. It changes nothing about the recount for the same reason the
            previous six did not -- a karana is not a relative-house family and
            not a node colocation family -- so neither block 4 nor block 13
            reaches catalogue A under 27 any more than under 26.
          effect_on_the_recount: >
            None. None of the six families the astronomy layer has added since is
            a relative-house family or a node colocation family, so neither block 4
            nor block 13 reaches catalogue A under either count. RECORDED ANYWAY:
            catalogues.A.count is a figure about the current build that was written
            once and never re-derived, which is the same shape as every other stale
            denominator in this file, and a reader re-running this test needs to
            know the number is measured rather than quoted.
        # RULED 2026-09-13. Catalogue B counts.
      b_counts_ruling: >
        DECIDED: catalogue B counts for test 3. The 141 Chapter-1 sections are
        the rule catalogue Step 4 is being built from; excluding them because the
        astronomy layer has not reached them yet would make the answer depend on
        BUILD ORDER rather than on evidence. Pass count is 19. Under catalogue A
        alone it would have been 14, and the five co-location labels (blocks 13,
        26, 29, 42, 50) would have joined the orphan list.
    where_the_labels_live: >
      All 44 labels sit in prophecy blocks in the salient-features chapter, lines
      4335-4909 of data/source_2026.html. The monthly calendar carries none and
      the 141-section rule catalogue carries none, so there is no per-rule
      probability to inherit except through these blocks. Verified by line range,
      not by sampling.

  # ---------------------------------------------------------- classification
  classification:
    prophecy_blocks: 50
    labelled: 44
    unlabelled: 6
    passes: 19
    fails: 25
    fail_by_test:
      test_1_instance_bound: 12
      test_2_does_not_recur: 12
      test_3_orphan: 1
    arithmetic: "19 + 12 + 12 + 1 = 44"
    carried_families: 11
    # The pre-implementation report classified block 20 under test 2. The
    # no-split ruling below moves it to test 1, which is why test 1 reads 12 and
    # test 2 reads 12 rather than 11 and 13. Block 20 fails test 2 independently
    # as well; the ruling changes which test is NAMED, not whether it is excluded.
    reclassified_by_the_no_split_ruling: [20]

  # ----------------------------------------------------- the no-split ruling
  # RULED 2026-09-13. Applies to the two compound blocks, 10 and 20.
  no_split_ruling:
    blocks: [10, 20]
    decision: DO_NOT_SPLIT
    recorded_as: test_1_failures
    reason: >
      Splitting a block re-authors a source block into two blocks it did not
      write. The author labelled the COINCIDENCE of Venus Rise (01-Feb-2026) and
      Mercury Rise (04-Feb-2026) falling three days apart -- that pairing IS the
      configuration judged, and halving it invents two judgements out of one. The
      same holds for block 20, where the hemisphere turning and the Sun-Neptune
      conjunction are judged together, two days apart.
    halves_are_individually_generic: >
      Recorded because it is true and because it is the argument FOR splitting:
      each half of block 10 and of block 20 would pass test 1 on its own. That is
      not enough. A generic half is not evidence that the author labelled the
      half.
    consequence_left_latent: >
      Because block 10 is not split, visibility/rise Venus carries one label only
      (High, from block 46). The Reasonable that a split would have produced does
      not exist, so the rise-Venus conflict stays LATENT. We do not create it
      ourselves. See disputed_families.latent_not_created.

  # ------------------------------------------------ carried families and values
  # 11 distinct families receive a carried label. `keyed` states the key the
  # label attaches to -- load-bearing for the combust family, below.
  #
  # `rules` IS THE ATTACHMENT. RULED 2026-09-15, after a verification pass found
  # the label attaching at SECTION level: every rule in "Venus Combust Rise
  # Cycle p.14" carried combust_venus's Reasonable, so b015b_venus_rise_west was
  # labelled Reasonable and rise_venus's High reached no row at all; all three
  # live b041 Herschel partners carried conj_venus_uranus's High although the
  # source labelled only the Venus one. A section is not a rule. The label is a
  # per-occurrence editorial judgement (headline_finding) and it attaches to the
  # CONDITION a block names, so the rule ids are enumerated here and matched by
  # id -- never by title, never by rule_family, never by body. A rule absent
  # from every `rules` list carries no label, and that is a correct outcome.
  #
  # `rules_declined` records the rules a reader would expect to see in the list
  # and the reason they are not, so the absence is a ruling on record rather
  # than an oversight. `family`, `source_section`, `keyed` and `body` are kept
  # as the PROVENANCE of the attachment -- how the block was traced to the rule
  # -- and are no longer read by any matcher.
  carried_families:

    - id: conj_sun_mercury
      family: "aspect/conjunction Sun-Mercury"
      catalogue: [A]
      blocks: [8, 17, 24, 31, 38, 48]
      value: [Reasonable, Good]
      disputed: true
      rules: []
      rules_empty_is_correct: >
        The largest label family in the document reaches no verdict row, and
        that is the right outcome rather than a gap. This family passes test 3
        through catalogue A -- the emitted astronomy class `aspect/conjunction`
        with bodies {Sun, Mercury} -- and catalogue A carries no verdicts. There
        is no Chapter-1 section and no configuration group for a Sun-Mercury
        conjunction, so no rule states this condition and none can carry the
        label. Six blocks, seven astronomy records, zero rows.
      note: >
        Six blocks, two values: Reasonable x5, Good on the 04-Nov-2026 instance.
        The source prints no Sun-Mercury pair table, so this family passes test 3
        through catalogue A only.

    - id: conj_mercury_venus
      family: "aspect/conjunction Mercury-Venus"
      catalogue: [A, B]
      source_section: "Venus Mercury Conjunction p.16"
      blocks: [9, 14]
      value: [Reasonable, High]
      disputed: true
      rules: [b017_venus_mercury_conjunction]
      note: "29-Jan-2026 Reasonable, 28-Feb-2026 High. Five weeks apart, same configuration."

    - id: conj_venus_uranus
      family: "aspect/conjunction Venus-Uranus"
      catalogue: [A, B]
      source_section: "Herschel Conjunction p.34"
      blocks: [23]
      value: High
      rules: [b041_herschel_conjunction_venus]
      rules_declined:
        b041_herschel_conjunction_sun: >
          Block 23 is titled "Venus Herschel Conjunction". The source labelled
          the Venus partner and no other. B41 states the condition for four
          partners in one section; giving all four the Venus label would hand
          three of them a judgement the document never made.
        b041_herschel_conjunction_mercury: "Same ruling as the Sun partner."
        b041_herschel_conjunction_mars: "Same ruling as the Sun partner."

    # ---- visibility/combust is KEYED PER BODY, not at family level ----------
    # RULED 2026-09-13, and the ruling is what keeps this out of the disputed
    # list. At family level visibility/combust carries Venus Reasonable, Saturn
    # High and Jupiter Good -- a three-way conflict. Per body it is three
    # families with one value each and no conflict at all. The source labels a
    # BODY's combustion, never "combustion"; family-level keying would be our
    # aggregation, not the source's claim.
    - id: combust_venus
      family: "visibility/combust"
      keyed: [rule_family, body]
      body: Venus
      catalogue: [A, B]
      source_section: "Venus Combust Rise Cycle p.14"
      blocks: [2, 44]
      value: Reasonable
      rules: [b015_venus_combust_cycle, b015a_venus_combust_east]
      rules_note: >
        Block 44 "Venus Combust" is the unqualified condition and is b015's
        cycle; block 2 "Venus Combust in the East" is b015a by name. Both
        Reasonable, so the pair agrees and the split between them costs nothing.
      rules_declined:
        cfg_silver_bullish_12_venus_combust_in_west: >
          A configuration group, not B15, and the source labels no west
          combustion. The east has its own block and the west has none; reading
          block 44's generic title as covering the west would re-derive a label
          the document withheld.

    - id: combust_saturn
      family: "visibility/combust"
      keyed: [rule_family, body]
      body: Saturn
      catalogue: [A, B]
      source_section: "Saturn Combust Rise Cycle p.24"
      blocks: [18]
      value: High
      rules: [b027_saturn_combust_cycle]

    - id: combust_jupiter
      family: "visibility/combust"
      keyed: [rule_family, body]
      body: Jupiter
      catalogue: [A, B]
      source_section: "Jupiter Combust Rise Cycle p.20"
      blocks: [32]
      value: Good
      rules: [b022_jupiter_combust_cycle, b022w_jupiter_combust_west]
      rules_note: >
        Block 32 "Jupiter Combust" is unqualified and B22 states the cycle and
        its western half in one section, so both rules state the condition the
        block names. Contrast combust_venus, where the source itself qualified
        one hemisphere and left the other unlabelled.

    - id: rise_venus
      family: "visibility/rise"
      keyed: [rule_family, body]
      body: Venus
      catalogue: [A, B]
      source_section: "Venus Combust Rise Cycle p.14"
      blocks: [46]
      value: High
      rules: [b015b_venus_rise_west, b015r_venus_rise_uttara_bhadrapada,
              b015c_venus_rise_star_list]
      rules_note: >
        Block 46 "Venus Rise" is unqualified, and B15's three rise rules are the
        section's statement of it. Before the per-rule attachment this High
        appeared in no row of the calendar: the rise rules sat in the same
        section as combust_venus and took its Reasonable instead.
      rules_declined:
        cfg_silver_bearish_10_venus_rise_in_west: >
          A silver configuration group, not B15. It held this High by accident
          -- it is the one rule the old family/body matcher reached correctly
          while the rules the label belongs to were shadowed by the section
          match -- and it is declined for the same reason the west combustion is.

    # ---- catalogue-B-only families: no emitted astronomy class matches them --
    - id: mercury_venus_alone
      family: "Mercury Venus Alone in Any Sign p.16"
      catalogue: [B]
      blocks: [26, 42]
      value: [Reasonable, High]
      disputed: true
      rules: [b016_mercury_venus_alone_in_a_sign]
      rules_declined:
        cfg_silver_bullish_15_sun_or_moon_with_mercury_alone: >
          "Only Sun Mercury or Moon Mercury Alone in Any Sign" is a different
          pair in a different catalogue. It shares the alone-in-sign family and
          nothing else.
      note: "THE HEADLINE PAIR. See headline_finding."

    - id: rahu_mars_together
      family: "Rahu Mars Together in Any Sign"
      catalogue: [C]
      catalogue_was: [B]
      catalogue_claim_disputed: >
        RESOLVED 15-Sep-2026 by
        transfer_test.test_3_recount_against_all_three_catalogues. SEE ALSO
        corrections_on_record.rahu_mars_is_not_a_catalogue_b_section. The title
        is an h3 gold configuration heading (source line 3402) and a silver
        div.config-title (line 3685). It is NOT one of the 141 h3.section
        elements, so this family passes test 3 through catalogue C and not
        through B -- and not through A either, since the astronomy layer emits no
        conjunction record for a node. Under A and B alone this family is an
        ORPHAN. `catalogue` below is corrected to [C]; the claim it used to make
        is kept beside it as `catalogue_was` rather than erased.
      blocks: [13]
      value: Reasonable
      rules: [cfg_gold_bullish_03_rahu_mars_same_sign,
              cfg_silver_bullish_07_rahu_mars_same_sign]
      rules_note: >
        Block 13 names both windows -- same sign 23-Feb to 02-Apr-2026 and same
        nakshatra 03-Mar to 20-Mar-2026 -- under one label, so the silver group
        that reads "more bullish when in the same Nakshatra" is inside the
        block's own scope rather than a second judgement.

    - id: venus_jupiter_same_sign
      family: "Venus Jupiter in the Same Sign p.67"
      catalogue: [B]
      blocks: [29]
      value: High
      rules: [b078_venus_jupiter_same_sign]
      rules_declined:
        b079_venus_behind_jupiter_same_sign: >
          OPEN, not settled. Block 29's title names the same-sign window AND its
          behind and ahead halves under one label, so an argument from
          no_split_ruling reaches all three rules. Attaching them would change
          what this family IS, which is a ruling and not a bug fix, so the
          per-rule attachment keeps the family as it was written and records the
          question. Same for block 50 and mars_ahead_of_jupiter.
        b080_venus_ahead_of_jupiter_same_sign: "Same open question."

    - id: mars_ahead_of_jupiter
      family: "Mars Ahead of Jupiter in Same Sign p.69"
      catalogue: [B]
      blocks: [50]
      value: High
      rules: [b086_mars_ahead_of_jupiter_same_sign]
      rules_declined:
        b084_mars_jupiter_same_sign: "See venus_jupiter_same_sign.rules_declined -- the same open question."
        b085_mars_behind_jupiter_same_sign: >
          Block 41 "Mars Behind Jupiter in the Same Sign" is its own block and
          its own label, excluded by test 2. Block 50's behind half is not a
          route around that exclusion.
        b086x_mars_crosses_jupiter_eleven_days: >
          The crossing is a different condition from the ordering, stated in the
          same section. Section adjacency is exactly what this attachment stopped
          treating as evidence.

  # ------------------------------------------------------- disputed families
  # RULED 2026-09-13. Where a family's blocks disagree, EMIT THE SET.
  disputed_families:
    count: 3
    of_carried: 11
    ids: [conj_sun_mercury, conj_mercury_venus, mercury_venus_alone]
    emit:
      source_probability: "the SET of values the source assigned, e.g. [Reasonable, Good]"
      source_probability_disputed: true
    never_collapse_to_one_value: >
      NOT min, NOT max, NOT mode, NOT first, NOT most-recent. Picking one
      manufactures an agreement the source never expressed. The set is the honest
      record and is trivially filterable; a single value would be a claim we were
      making on the source's behalf.
    why_not_per_occurrence_instead: >
      The alternative -- attach the label to the 2026 occurrence rather than to
      the rule -- is incoherent here: a 2027 occurrence then has no occurrence to
      inherit from, and the whole premise of the transfer is that the label
      attaches to a repeatable rule.
    latent_not_created:
      family: rise_venus
      would_be: [Reasonable, High]
      status: LATENT_AND_LEFT_LATENT
      reason: >
        This conflict exists only if block 10 is split into its Venus-Rise and
        Mercury-Rise halves. It is not split (see no_split_ruling), so the
        conflict does not exist and we do not create it. Recorded so that anyone
        who later argues for splitting knows exactly what splitting would cost.
    not_disputed_because_keyed_per_body:
      family: "visibility/combust"
      family_level_values: [Reasonable, High, Good]
      per_body_values: {Venus: Reasonable, Saturn: High, Jupiter: Good}
      see: "carried_families.combust_venus and the ruling comment above it"

  # ---------------------------------------------------------- HEADLINE FINDING
  # This is the ground for every ruling in this block. It is stated here, in the
  # config, and again in build/STEP4_DECISIONS.md, because every constraint above
  # follows from it and none of them makes sense without it.
  headline_finding:
    what: >
      THE TWO "Mercury Venus Alone in Any Sign" BLOCKS CARRY CHARACTER-IDENTICAL
      PROPHECY TEXT AND DIFFERENT LABELS. Block 26 (02-Jun to 08-Jun-2026, p.240)
      is labelled REASONABLE; block 42 (26-Sep to 17-Oct-2026, p.259) is labelled
      HIGH. Both print, character for character: "Whenever Mercury Venus are
      alone in any sign without any other Planet(s), Markets are sluggish." Only
      the dates and the remarks differ. The rule does not.
    verified: >
      Independently verified against data/source_2026.html by re-parsing all 50
      prophecy blocks and grouping them by exact prophecy string: 50 blocks, 44
      labelled, and the two blocks' prophecy strings compare equal.
    what_it_establishes: >
      The labels are PER-OCCURRENCE EDITORIAL JUDGEMENTS, not properties of a
      rule. Where the rule text is identical and only the date changes, the label
      still moves. Carrying such a label as a rule-level field asserts a
      stability the source does not have -- which is why the field is an
      annotation (see description), why disputes are emitted as sets rather than
      resolved (see disputed_families), and why the field may never feed
      confidence (see not_a_confidence).
    two_further_identical_text_groups:
      - blocks: [17, 24, 31, 38, 48]
        rule: "Sun Mercury Conjunction is a high vibration time and a Major Turning Date."
        labels: "Reasonable x4, Good x1 (block 48)"
        note: >
          Five blocks whose prophecy text is identical character for character.
          Block 8 is the sixth Sun-Mercury block and carries the same first
          sentence plus one extra clause, so it is not in this exact-match group;
          it is Reasonable, and it is counted in the family above.
      - blocks: [34, 49]
        rule: "Mercury Manifestation is a major Turning date."
        labels: "Reasonable (block 34), Good (block 49)"
        note: >
          Both are excluded by test 2 -- Mercury Manifestation is not an emitted
          class -- so this pair changes nothing downstream. It is recorded
          because it is a third independent instance of the same behaviour.
    strength_of_the_evidence: >
      Three groups of blocks in the document share character-identical prophecy
      text, and ALL THREE disagree with themselves on the label -- the two above
      plus the headline pair. Every repeated rule text in the document is
      labelled inconsistently; there is no counter-example. The finding does not
      rest on the single pair, and the earlier wording "two of the three"
      understated it.

  # --------------------------------------------------------- the six unlabelled
  # Evidence about the label scheme, and it belongs beside the disputed-family
  # finding rather than in a footnote.
  unlabelled_blocks:
    count: 6
    blocks:
      11: "Solar Eclipse"
      15: "Moon Eclipse"
      35: "Solar Eclipse"
      37: "Mutual Vedh of Jupiter in Ashlesha and Ketu in Magha"
      39: "Moon Eclipse"
      47: "Mutual Vedh of Mars in Ashlesha and Ketu in Magha"
    finding: >
      FOUR OF THE SIX ARE THE FOUR ECLIPSE BLOCKS -- every eclipse block in the
      document is unlabelled -- although eclipses are impact tier T1, the highest
      tier this config defines. A systematic scheme would have labelled its own
      top-tier events first. That absence is itself evidence that the labels are
      EDITORIAL rather than systematic, and it corroborates the headline finding
      from the opposite direction: the headline shows the labels moving where the
      rule does not; this shows them missing where the impact is greatest.
    consequence: >
      eclipse/solar and eclipse/lunar inherit no source_probability at all. Their
      verdicts carry the field ABSENT, not null-because-unknown.

  # ------------------------------------------------------------------ orphans
  orphans:
    count: 1
    mars_tenth_to_saturn:
      block: 4
      title: "Mars (Sagittarius) Tenth to Saturn"
      label: High
      failed_test: test_3_no_rule_family
      do_not_create_a_family: >
        RULED 2026-09-13. Recorded as an orphan; no rule family is created for
        it. Inventing a relative-house family to receive one label would build
        the catalogue around the annotation instead of the other way round.
      recurs_in_span: true
      recurrence_2027: "18-Nov-2027 -> 27-Dec-2027, 39 days -- Mars in Sagittarius, 10th from Saturn in Pisces"
      recurrence_verified_from: build/astronomy_2027.json
      explicitly_repeatable: >
        The source states the rule generically -- "Whenever Mars comes 10th to
        Saturn in transit" -- so this is a genuine rule with no home, not a
        one-off observation.
      first_in_line: >
        If a relative-house family is ever added to the catalogue, this is the
        first candidate: it passes tests 1 and 2 outright and fails only for want
        of a family to attach to.

  # --------------------------------------------------------------- exclusions
  exclusions:
    saturn_neptune_conjunction:
      label: "Intense and High Reliable"
      source_block: "Event of the Year -- 2026, Saturn Neptune Conjunction, pg. 211-213"
      excluded_by: transfer_test_2_recurrence
      reason: >
        The configuration does not recur in the generated span. Zero
        Saturn-Neptune conjunction records exist in build/astronomy_2027.json
        across 01-Dec-2026 -> 01-Feb-2028 IST; the pair's synodic period is
        ~36 years. The exclusion follows from the recurrence test alone and
        required no editorial judgement.
      note: >
        Independently, this is the block whose 2026 instant the source prints
        12h42m wrong (STEP3_REPORT section 6.1). The label was assigned to an
        event the source had mis-timed. That is not the ground of exclusion --
        test 2 excludes it on its own -- but it is recorded here because the
        source's single highest label sits on its single largest verified
        defect, and that bears on how much authority the label scheme is owed.

  # ------------------------------------------------------------ scale collapse
  scale_collapse:
    defined_buckets: 6                      # labels.source_probability_map
    survive_transfer: 3
    surviving: [Reasonable, Good, High]
    usable_range_after_transfer: "2-4 of the 1-5 map"
    excluded_values:
      Low: {blocks: [16], count: 1}
      "Very High": {blocks: [12, 21], count: 2}
      "Intense and High Reliable": {blocks: [1], count: 1}
    finding: >
      Both extremes of the scale are lost. Every Low, every Very High and the
      single Intense and High Reliable fails the transfer test -- the Low on test
      1 (Mars Vedh of Pushya: nakshatra-bound), the two Very Highs and the Intense
      and High Reliable on test 2. The source's STRONGEST claims all sit on
      once-in-decades configurations -- a Saturn-Neptune conjunction, a
      Saturn-Mars conjunction, a Mars-twelfth-to-Saturn window -- which is
      entirely coherent editorially (the rarest configuration is the most
      newsworthy) and useless for transfer (the rarest configuration is the one
      least likely to recur next year).
    consequence: >
      The carried field's range is Reasonable / Good / High only. A consumer must
      not read "no Very High in 2027" as a claim about 2027; it is a fact about
      which 2026 blocks survived a recurrence test.

  # -------------------------------------------------- projected population
  # THE EXACT COUNTS THE HARNESS ASSERTS. A field this sparse will otherwise
  # drift invisibly: if a later change populates 400 rows or zero, that must fail
  # loudly rather than pass quietly.
  #
  # RECORDED 14-Sep-2026: THIS PROJECTION IS STALE and the actual figures are
  # recorded beside it rather than replacing it, so the size of the miss stays
  # visible. The projection was made before the rule layer was complete and was
  # never a constraint -- nothing filters, weights or aggregates on the label.
  projection_status: stale_superseded_by_actual_figures
  actual_figures_2026:
    rule_layer_rules_carrying_a_label: 14
    carried_families_that_attached: 11
    rule_layer_firings_behind_them: 501
    verdict_rows_carrying_a_label: 344
    disputed_rows: 46
    miss: >
      The projection below says "about 11 rule-layer firings". The build has 14
      rules from 11 families, 501 raw firings, and 344 verdict rows carrying a
      label -- roughly an order of magnitude more. The projection counted
      label-bearing FAMILIES where the build counts rows, and the families attach
      to more rules than it assumed.
  projected_population:
    basis: "build/astronomy_2027.json, 1569 records, 01-Dec-2026 -> 01-Feb-2028 IST"
    astronomy_records_total: 15
    astronomy_records_by_family:
      conj_sun_mercury: 7
      conj_mercury_venus: 3
      conj_venus_uranus: 1
      combust_venus: 1
      combust_saturn: 1
      combust_jupiter: 1
      rise_venus: 1
    all_15_fall_in_ist_civil_2027: true
    pct_of_astronomy_layer: 0.96
    rule_layer_firings_total: 11
    rule_layer_firings_by_family:
      mercury_venus_alone: 5
      rahu_mars_together: 2          # 1 same-sign window + 1 same-nakshatra window
      venus_jupiter_same_sign: 1
      mars_ahead_of_jupiter: 3
    combined_total: 26
    computed_windows_2027:
      mercury_venus_alone: ["01-Dec-2026 Libra", "21-Mar-2027 Aquarius", "17-Jul-2027 Gemini",
                            "09-Sep-2027 Virgo", "08-Oct-2027 Libra"]
      rahu_mars_together: ["same sign 27-Dec-2027 -> 01-Feb-2028 Capricorn",
                           "same nakshatra 23-Dec-2027 -> 09-Jan-2028 Uttara Ashadha"]
      venus_jupiter_same_sign: ["16-Aug-2027 -> 09-Sep-2027 Leo"]
      mars_ahead_of_jupiter: ["01-Dec-2026 -> 25-Jan-2027 Leo", "10-Mar-2027 -> 26-Apr-2027 Cancer",
                              "26-Jun-2027 -> 05-Jul-2027 Leo"]
      mars_ahead_verified: >
        Mars is ahead of Jupiter in longitude at the start, midpoint and end of
        all three shared-sign windows, so block 50 (ahead) fires three times and
        block 41 (behind) fires zero times. That is why block 41 is a test-2
        failure and block 50 is a pass: the pair is decided by computation, not by
        reading.
    denominator_note: >
      1569 is the most favourable denominator available. The Step-4 verdict layer
      adds the weekday and panchang families and the 141-section catalogue, so the
      real denominator runs into the thousands and the populated share lands below
      1%. Stated plainly rather than buried: this is a small minority, and it is
      small enough that the field's only honest use is as provenance on about 26
