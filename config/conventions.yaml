    correct_value: "no Indra-in-Panchak overlap on 06-Jun-26 under the instant reading"
    incorrect_value: "Endra, 06-Jun-26, ending 06-Jun-26 10:05 (p.44)"
    classification: printed_row_its_own_sections_disagree_about
    competing_reading_not_rejected: >
      Reading "in Panchak" as sharing a CIVIL DAY rather than an instant
