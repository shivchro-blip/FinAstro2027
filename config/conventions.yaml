# ================================================================ rulership
# The planet -> instrument/sector map, reconciled across the three sections of
# the user's book that carry one, plus the map the 2026 SOURCE prints for
# itself. Recorded here because verdict_coverage.tier_3 derives from it and
# because the four witnesses do not agree.
#
# WITNESSES (all read in full, not sampled):
#   book_ch15  "The Celestial Ledger" Ch15 Commodities -- Gold, Silver & the Metals
#   book_ch16  "The Celestial Ledger" Ch16 Sector & Stock Selection
#   book_appB  "The Celestial Ledger" Appendix B.5 "The sector -> planet map"
#   source     data/source_2026.html, the map the source prints for its OWN
#              verdicts (pp.210, 214-218) and uses throughout its monthly tables
#              via the phrase "sectors ruled by X"
#
# The book is NOT in the project tree. It was read from
#   C:/Shiva/Horoscopes/FinAstro/FinAstro_Guide/raw/
#     Kindle_Ch15_Commodities.html
#     Kindle_Ch16_Sector_Stock_Selection.html
#     Kindle_Appendices_A-C.html   (Appendix B is inside this file)
# Recorded so the provenance is checkable and so the next reader does not search
# config/ and data/ for it.
rulership:
  status: reconciled_pending_signoff

  # --------------------------------------------------- corrections on record
  # Two claims in the instruction that built this table were wrong. Recorded as
  # the user's own, at the user's instruction, rather than silently repaired.
  # Provenance of a table is not only where the evidence came from; it is also
  # which assertions about the evidence did not survive checking.
  corrections_on_record:

    - id: ch15_silence_read_as_agreement
      claimed: "Ch15 agrees with Ch16 and Appendix B across the sector map -- three-way agreement."
      attributed_to: user_prompt
      status: corrected_and_applied_to_table
      corrected_to: >
        Ch15 is a COMMODITIES chapter. It takes part in three-way book agreement
        on exactly THREE mappings -- Sun -> gold, Mars -> base metals and
        defence, Saturn -> oil. It says nothing whatever about IT, banking,
        autos, FMCG or Rahu, and silence is not agreement. Every `witnesses`
        list in the table below therefore names only sections that actually make
        the assignment, and Mercury -> IT and Venus -> autos are recorded as
        TWO-way (book_ch16 + book_appB), not three-way.
      consequence: >
        Two of the map's most-used rows are weaker than the instruction assumed,
        and both are ALSO contradicted by the source -- see
        rulership.sector_mapping_reopened.items.it_telecom and .automobiles.

    - id: bphs_venus_silver
      claimed: "BPHS gives Venus silver alongside the diamond; the Moon holds silver alongside the pearl."
      attributed_to: user_prompt
      status: unverified_by_source
      source_checked: none
      note: >
        Cited from recall and never checked against BPHS. BPHS is not in the
        project tree and was not read. The claim may well be right -- nothing
        here refutes it -- but none of the four sections this table was
        reconciled from witnesses it, so it must not be recorded as a witnessed
        classical claim. It is kept as the STATED grounds for the Venus rival,
        marked unverified, and it does not move the Moon-primary decision, which
        rests on book_ch15's own Sun-Moon-spread construction instead.
      see: rulership.conflicts.silver_moon_vs_venus

  # ------------------------------------------------------- the reconciled map
  # "witnesses" lists only the sections that make the assignment. SILENCE IS NOT
  # AGREEMENT: Ch15 is a commodities chapter and says nothing about IT, banking,
  # autos or Rahu, so it cannot be counted as agreeing with Ch16/App B on them.
  table:
    Sun:
      primary: [gold]
      also: [government, power_energy, PSU, precious_stones, gilt_edged, renewables]
      witnesses: [book_ch15, book_ch16, book_appB, source]
      claim_tag: Classical          # book_ch15 calls Sun->gold one of only two
                                    # pedigreed asset rulerships in the whole book
      note: >
        Three-way book agreement AND source agreement. book_ch16 adds the Sun to
        Oil/Energy/PSU ("the Sun for power and government") and to gold-miners;
        book_appB prints "Government, power/energy, gold"; the source prints
        "Public Sector Enterprises, PSU Banks, Precious Stones, Gilt-edged
        securities, ... Gold (western astro)". The source additionally ties Nifty
        to the Sun -- "Vedh of Abhijeet is positive for sectors ruled by Sun and
        Nifty" and "Positive for sectors ruled by Sun including Nifty".
    Moon:
      primary: [silver]
      also: [FMCG, dairy, liquids, public_sentiment, agricultural_produce_water_linked]
      witnesses: [book_ch15, book_appB]
      claim_tag: Classical
      note: >
        See rulership.conflicts.silver_moon_vs_venus. book_ch16 does not assign
        silver at all (it is a sector chapter); the source prints no Moon sector
        row, though its monthly tables do say "Positive for Sectors ruled by
        Moon", so the source has a Moon rulership it never tabulates.
    Mars:
      primary: [base_metals, copper, defence]
      also: [real_estate, engineering, capital_goods, iron_steel_shared_with_saturn,
             healthcare_pharma_source_only, gold_source_only]
      witnesses: [book_ch15, book_ch16, book_appB, source]
      claim_tag: Framework
      note: >
        Three-way book agreement on base metals + defence. book_ch15 hedges iron
        ("also iron, in some schemes"); book_ch16 resolves it -- "Mars for base
        metals; Saturn for iron and coal". The source keeps iron DOUBLE-ruled and
        says so explicitly: "Iron and Steel ... the sector is ruled by Mars and
        Saturn both". The source also puts Gold and Healthcare/Pharma under Mars,
        which no book section does.
    Mercury:
      primary: [IT, telecom, media]
      also: [trading_brokerage, grains_as_commerce, money_flows_with_venus]
      witnesses: [book_ch16, book_appB]
      claim_tag: Framework
      note: >
        TWO-way, not three-way. book_ch15 gives Mercury only "agricultural trade
        and grains as commerce" and never mentions IT or telecom. The SOURCE
        prints no Mercury sector row at all and assigns Information Technology and
        Telecommunications to RAHU instead. So Mercury->IT is a book-only mapping
        that the source contradicts by omission-plus-reassignment.
    Jupiter:
      primary: [banking, finance]
      also: [education, pharma_appB_only, expansion_inflation_backdrop]
      witnesses: [book_ch16, book_appB, source]
      claim_tag: Framework
      note: >
        book_ch15 gives Jupiter only "the broad expansion/inflation backdrop",
        not banking. The source agrees with the book on banking through two
        constructs rather than a sector row: the Yearly Cabinet ("King (Raja) |
        Jupiter | Excess Liquidity in the Banking system; Banking and Finance will
        be in focus") and "Vargottam Jupiter is Positive for the sectors ruled by
        Jupiter, particularly Banking and Finance".
    Venus:
      primary: [autos, luxury, FMCG_ch16_only, entertainment, textiles]
      also: [sugar_and_soft_goods, silver_secondary_only]
      witnesses: [book_ch16, book_appB]
      claim_tag: Framework
      note: >
        TWO-way. book_ch15 gives Venus "an alternate silver/'value' significator;
        sugar and soft/luxury goods" and no autos. The source puts Automobiles
        under SATURN (heavy commercial vehicles) and under MARS, never Venus.
        Venus->silver is demoted to secondary -- see rulership.conflicts.
    Saturn:
      primary: [oil, crude, PSU, mining, infrastructure, labour]
      also: [iron, coal, cement, real_estate, logistics, heavy_industry]
      witnesses: [book_ch15, book_ch16, book_appB]
      claim_tag: Framework
      note: >
        Three-way BOOK agreement on oil -- one of only three mappings Ch15 takes
        part in at all (see corrections_on_record.ch15_silence_read_as_agreement).
        CONTRADICTED BY THE SOURCE, which gives Saturn "Oil-seeds" (not crude)
        and assigns "Crude oil" to Rahu. DECIDED 12-Sep-2026: not resolved to one
        planet. Saturn stays here AND Rahu's crude stays on Rahu's row; CL emits
        both. See rulership.conflicts.crude_saturn_vs_rahu.
    Rahu:
      primary: [speculation, tech, crypto]
      also: [aviation, media_entertainment, telecom, IT, AI, drones, logistics,
             crude_oil_source_only, pharmaceuticals_source_only, wind_power]
      witnesses: [book_ch16, book_appB, source]
      claim_tag: Framework
      note: >
        book_ch15 never mentions Rahu. The source's Rahu row is the widest of any
        planet and carries a scope clause the book has no equivalent for: "Rahu
        rules all the commodities of any Nakshatra (Star) or Sign where it stays".
        crude_oil_source_only is LIVE, not merely recorded: CL emits a Rahu path
        alongside its Saturn path -- see rulership.conflicts.crude_saturn_vs_rahu
        and verdict_coverage.tiers.tier_3.derivations.CL.paths. IT, telecom,
        pharmaceuticals and logistics on this row are the same kind of
        source-only assignment and are queued for the same treatment under
        rulership.sector_mapping_reopened.
    Ketu:
      primary: [pharma_niches]
      also: [spirituality, sudden_moves]
      witnesses: [book_ch16, book_appB]
      claim_tag: Framework
      note: "No source sector row. Not used by any tier below."

  # ------------------------------------------------ where the witnesses differ
  # Reported rather than averaged away. Each entry names the sections and quotes
  # them, so a later reader can re-adjudicate without re-reading the book.
  disagreements:

    crude_oil:
      severity: blocking
      book_ch15: "Saturn -- 'Iron, oil and crude, coal'; significator table 'Saturn | Oil / iron'"
      book_ch16: "Saturn (with Sun) -- 'Oil, Energy, PSU, Heavy Industry'; table 'Saturn | oil / PSU / metals'"
      book_appB: "Saturn -- 'Oil, PSUs, mining, infrastructure, labour'"
      source: "Rahu -- '... Logistics, Crude oil, Pharmaceuticals ...'; Saturn's row has 'Oil-seeds', an agricultural commodity, NOT crude"
      resolution: both_carried_neither_primary
      resolution_date: 2026-09-12
      resolution_kind: deliberate_non_resolution
      see: rulership.conflicts.crude_saturn_vs_rahu

    silver:
      severity: recorded
      book_ch15_primary: "Moon -- 'the lunar metal', Classical, and the Sun-Moon spread IS the gold-silver spread"
      book_ch15_rival: "Venus -- 'an alternate silver/value significator', listed under 'Framework ... modern practitioner convention, not classical'"
      book_appB: "Moon -- 'FMCG, dairy, liquids, silver, public sentiment'. Venus's row carries no silver."
      resolution: moon_primary_venus_secondary
      see: rulership.conflicts.silver_moon_vs_venus

    FMCG:
      severity: recorded
      book_ch16: "Venus -- 'Autos, FMCG, Luxury, Hospitality'; table 'Venus | autos / FMCG'"
      book_appB: "Moon -- 'FMCG, dairy, liquids, silver, public sentiment'. Venus's row is 'Autos, luxury, entertainment, textiles' -- no FMCG."
      resolution: not_resolved_no_instrument_depends_on_it
      note: "A flat contradiction between two book sections. No instrument in this config maps to FMCG, so nothing turns on it yet."

    pharma:
      severity: recorded
      book_ch16: "Moon, Mars, Ketu -- and the chapter itself says 'Assignment varies by scheme -- another reminder the map is convention'"
      book_appB: "Jupiter -- 'Banking/financials, education, pharma'; Ketu -- 'Pharma niches'"
      source: "Mars -- 'Healthcare & Pharma'; Rahu -- 'Pharmaceuticals'"
      resolution: not_resolved_no_instrument_depends_on_it

    iron_and_steel:
      severity: recorded
      book_ch15: "double-assigned inside one chapter -- Mars 'also iron, in some schemes' AND Saturn 'Iron, oil and crude, coal'"
      book_ch16: "resolves it -- 'Mars for base metals; Saturn for iron and coal'"
      source: "keeps both and says so -- 'the sector is ruled by Mars and Saturn both'"
      resolution: not_resolved_no_instrument_depends_on_it

    automobiles:
      severity: recorded
      book_ch16: "Venus -- 'Autos, FMCG, Luxury, Hospitality'"
      book_appB: "Venus -- 'Autos, luxury, entertainment, textiles'"
      source: "Saturn -- 'Automobiles (particularly Heavy Commercial Vehicles)'; Mars -- 'Automobile'. Venus gets no sector row at all."
      resolution: not_resolved_no_instrument_depends_on_it

    sugar:
      severity: coverage_gap_not_contradiction
      book_ch15: "Venus -- 'sugar and soft/luxury goods'"
      book_ch16: absent
      book_appB: absent
      source: "carries full Bullish and Bearish CONFIGURATION sections for Sugar and Jaggery (pp.168-173, 174-175) and names no ruling planet for it"
      resolution: >
        Irrelevant to coverage. SUGAR is tier 1 and takes its verdicts from the
        source's own configuration sections, so no rulership is needed to reach it.

  # ----------------------------------------------- the two encoded resolutions
  conflicts:

    silver_moon_vs_venus:
      decision: "SILVER = MOON, primary. Venus may enter only as a SECONDARY modifier, never as primary."
      status: settled_by_user
      reason_recorded: >
        Not convention-following. book_ch15 CONSTRUCTS the gold-silver spread as
        the Sun-Moon spread -- "The Sun-Moon separation of roughly 96.9 degrees is
        the celestial analogue a practitioner would map onto the gold/silver
        ratio" -- so a Venus-ruled silver collapses the chapter's own
        construction. That is a structural argument, not a popularity one.
      rival: Venus
      rival_status: secondary_modifier_only
      rival_never: primary
      # Recorded so the disagreement does not read as settled.
      rival_grounds_as_stated_by_user: >
        BPHS gives Venus silver alongside the diamond; the Moon holds silver
        alongside the pearl. The conflict is real in the classical literature.
      rival_grounds_attributed_to: user_prompt
      rival_grounds_status: unverified_by_source
      rival_grounds_source_checked: none
      rival_grounds_correction_ref: rulership.corrections_on_record.bphs_venus_silver
      rival_grounds_as_witnessed_in_these_three_sections: >
        DIVERGENT FROM THE ABOVE, and recorded rather than reconciled. The book
        does not cite BPHS and does not treat Venus-silver as classical. It files
        Venus under "Framework -- The extensions are modern practitioner
        convention, not classical" and calls Venus "an alternate silver/value
        significator". Appendix B.5 gives Venus no silver at all. So WITHIN THESE
        THREE SECTIONS the conflict is Classical(Moon) vs Framework(Venus), not
        Classical vs Classical. The classical-literature claim may well be right;
        it is simply not witnessed by the sections this table was reconciled from,
        and must not be recorded as if it were.
      emit:
        primary_significator: Moon
        secondary_significator: Venus
        flag_on_any_venus_contribution: silver_venus_secondary_modifier
        claim_tag_primary: Classical
        claim_tag_secondary: Framework

    crude_saturn_vs_rahu:
      decision: "CRUDE = SATURN **and** RAHU. Both significators are carried, both are emitted, NEITHER is marked primary."
      decision_date: 2026-09-12
      decided_by: user
      status: DELIBERATELY_UNRESOLVED_BOTH_EMITTED
      blocking_for: nothing        # was verdict_rule_signoff; no longer blocks
      resolved_by_precedence: false

      # ---------------------------------------------------------------- why
      # This is NOT an oversight, NOT a deferral, and NOT a failure to choose.
      # The reasoning is recorded in full so a later reader cannot mistake it
      # for one, and cannot "tidy it up" by picking a winner.
      why_not_resolved: >
        Neither witness refutes the other. The classical weight is with Saturn --
        that which is extracted from underground, dark and heavy, of which
        mineral oil is the paradigm case -- and the book says so in three
        separate sections; a book/calendar contradiction has a real cost.
        But the source says Rahu, the source is what this project reproduces,
        and Rahu-as-crude is coherent on its own terms as the modern
        imported/speculative reading. Resolving by precedence would be resolving
        by fiat: the precedence rule ranks EVIDENCE for verdicts, and applying
        it to a rulership dispute would silently convert a question about the
        world into a question about filing order.
      why_both_is_cheap: >
        Carrying both costs nothing and discards nothing. It converts an
        unresolvable rulership dispute into a TESTABLE DIVERGENCE, which is the
        only way it can actually be settled in a project built to test
        astro-financial signals empirically. Deciding by fiat now would destroy
        the experiment to save 34 rows.
      deciding_fact: >
        Volume. 26 Saturn-conditioned 2027 events against 8 Rahu-conditioned
        ones. Choosing Rahu alone would have shrunk CL's addressable population
        by roughly two thirds; choosing Saturn alone would have discarded the
        source's own map. Keeping both costs 34 rows.

      # ------------------------------------------------- the intended test
      divergence_is_the_point: true
      test_design:
        intent: >
          The two paths are the experiment. Once verdicts exist and outcomes are
          scored, the question "is crude Saturn's or Rahu's?" is answered by
          which path's verdicts land, not by which witness is older.
        not_a_per_event_test: >
          CHECKED, NOT ASSUMED, and it constrains the test. In calendar 2027 the
          Saturn set and the Rahu set are DISJOINT -- 26 + 8 = 34 with an empty
          intersection; no 2027 event carries both bodies. So every CL verdict
          comes from exactly one path, and the two paths can never contradict
          each other on the same event. The test is therefore a POPULATION-level
          comparison of hit rates, not a per-event agreement count.
        power_caveat: >
          8 Rahu-conditioned events in a year is a small sample. A single year
          cannot settle this; several years of scored outcomes will be needed
          before the divergence means anything. Recorded here so the first
          year's numbers are not over-read.
        overlap_2027: 0

      # ------------------------------------------------------- what is emitted
      emit:
        both_paths: true
        primary: null                     # MUST remain null in the OUTPUT.
        primary_note: >
          This config records that the BOOK favours Saturn (three sections) and
          that the SOURCE favours Rahu (its own sector map). The emitted record
          must not pre-judge between them: no emitted CL verdict carries a
          primary/secondary ranking, and no consumer may infer one from field
          order.
        flag_on_every_cl_verdict: crude_significator_contested
        cross_reference_required: true
        cross_reference_note: >
          Every emitted CL verdict names the other path explicitly, so a
          consumer reading one path can never be unaware of the other.
        paths_defined_at: verdict_coverage.tiers.tier_3.derivations.CL.paths

      # ------------------------------------------- superseded prior position
      superseded_decision: >
        The earlier instruction "CRUDE = SATURN, tier 3 book_derived" is
        superseded. It is kept in the record below because the CL Saturn path is
        still exactly that rule, unchanged, with its three citations intact --
        what changed is that it is no longer the ONLY thing emitted.
      user_instruction_basis_original: >
        "crude: Saturn. Backed three ways (Ch15 oil/iron, Ch16 oil/PSU/metals,
        App B oil/PSUs/mining)." All three book citations verified correct and
        quoted in rulership.disagreements.crude_oil.
      evidence_for_rahu: >
        The 2026 SOURCE prints its own planet->sector map twice (pp.210 and
        214-218) and assigns "Crude oil" to RAHU. Saturn's row in the same table
        carries "Oil-seeds" -- an agricultural commodity, not crude. The
        source's map is not decorative: the phrase "sectors ruled by X" drives
        verdicts throughout its monthly event tables (e.g. "Positive for Sectors
        ruled by Rahu", "especially in sectors ruled by Saturn"), so this is the
        map the source's own verdicts run on.
      scope_consequence_recorded:
        saturn_conditioned_events_2027: 26
        rahu_conditioned_events_2027: 8
        union_2027: 34
        intersection_2027: 0

      reopens: sector_mapping
      reopens_reason: >
        Ruling the source's map load-bearing here makes it load-bearing
        everywhere. The other seven source-vs-book sector disagreements are owed
        the same dual treatment when their instruments come into scope. See
        rulership.sector_mapping_reopened.

  # ------------------------------------------------- sector_mapping REOPENED
  # Closed at the coverage step, reopened by the crude decision on 12-Sep-2026.
  sector_mapping_reopened:
    status: reopened
    reopened_date: 2026-09-12
    trigger: rulership.conflicts.crude_saturn_vs_rahu
    trigger_reason: >
      The crude case proves the source's sector map is load-bearing. A map that
      outweighs three book sections on crude cannot be treated as decorative on
      autos, pharma, FMCG or iron.
    blocking_now: false
    blocking_now_reason: >
      No instrument currently in `instruments` maps to any of the seven. Nothing
      in the 2027 build turns on them yet.
    trigger_point: "when an instrument mapping to that sector enters `instruments`"
    treatment_owed: >
      The same shape CL just got: both mappings carried, each with its own tier,
      claim_tag and citation, NEITHER marked primary, every affected verdict
      flagged <sector>_significator_contested and cross-referenced to the rival
      path, and the divergence recorded as the intended test rather than as a
      defect.
    items:

      it_telecom:
        book: "Mercury -- book_ch16 'IT, telecom, media'; book_appB same. TWO-way only; book_ch15 never mentions IT or telecom."
        source: "Rahu -- 'Information Technology', 'Telecommunications'. The source prints NO Mercury sector row at all."
        kind: omission_plus_reassignment
        severity: high_if_scoped
        note: >
          The strongest source-vs-book disagreement after crude, and structurally
          worse: the source does not merely disagree, it gives Mercury no sector
          row at all. Would bite immediately if any IT instrument is added.

      automobiles:
        book: "Venus -- book_ch16 'Autos, FMCG, Luxury, Hospitality'; book_appB 'Autos, luxury, entertainment, textiles'. TWO-way only."
        source: "Saturn -- 'Automobiles (particularly Heavy Commercial Vehicles)'; Mars -- 'Automobile'. Venus gets no sector row at all."
        kind: reassignment_to_two_other_planets
        severity: high_if_scoped

      pharma:
        book: "book_ch16 Moon/Mars/Ketu, and the chapter itself concedes 'Assignment varies by scheme'; book_appB Jupiter + Ketu."
        source: "Mars -- 'Healthcare & Pharma'; Rahu -- 'Pharmaceuticals'."
        kind: four_way_disagreement_including_book_internal
        severity: high_if_scoped
        note: "The book is not internally agreed here either, so a dual emit would be a triple."

      iron_and_steel:
        book: "book_ch15 double-assigns inside one chapter (Mars 'also iron, in some schemes' AND Saturn 'Iron, oil and crude, coal'); book_ch16 resolves it to 'Mars for base metals; Saturn for iron and coal'."
        source: "keeps BOTH and says so outright -- 'the sector is ruled by Mars and Saturn both'."
        kind: source_declines_the_books_resolution
        severity: medium_if_scoped
        note: "Here the SOURCE is the one refusing to resolve. Dual emit is what the source itself prescribes."

      FMCG:
        book: "FLAT CONTRADICTION between two book sections -- book_ch16 Venus, book_appB Moon."
        source: "no FMCG row. The source has a Moon rulership it invokes ('Positive for Sectors ruled by Moon') but never tabulates."
        kind: book_internal_contradiction_plus_source_gap
        severity: medium_if_scoped

      gold_secondary:
        book: "Sun -- the only three-way-plus-source agreement in the table, and book_ch15 calls Sun->gold one of just two pedigreed asset rulerships in the whole book."
        source: "agrees (Sun, 'Gold (western astro)') but ALSO puts Gold under MARS."
        kind: source_internal_double_assignment
        severity: low_but_live
        note: >
          LIVE NOW, unlike the other six -- GC and MCXGOLD are in scope. It does
          not disturb them: gold reaches tier 1 through the source's own Gold
          configuration sections, not through any rulership, so no significator
          path is used and nothing here is load-bearing yet. It becomes live the
          moment a gold verdict is derived from rulership rather than read from a
          configuration section.

      logistics:
        book: "Saturn -- book_appB 'Oil, PSUs, mining, infrastructure, labour' with logistics in the extended row."
        source: "Rahu -- 'Logistics, Crude oil, Pharmaceuticals'."
        kind: same_row_same_dispute_as_crude
        severity: low_if_scoped
        note: >
          The identical Saturn-vs-Rahu split as crude, on the adjacent item of
          the same source row. Whatever settles crude should settle this.

    excluded_as_sub_threshold:
      - "Sun 'renewables' vs Rahu 'wind_power' -- adjacent rather than contradictory; no section denies the other."
      - "Mercury 'money_flows_with_venus' vs Venus -- the book states the sharing itself, so it is not a disagreement."
    excluded_note: >
      Listed so the count of seven is auditable and not the result of a quiet
      trim.

# ========================================================== verdict coverage
# WHAT THIS BLOCK IS: the definition of WHICH instruments may carry a verdict,
# on WHAT evidence, and at what PROVENANCE tier. It defines coverage only.
# NO VERDICTS ARE GENERATED HERE and no verdict rule is written here -- the rule
# layer needs labels.claim_tag / confidence sign-off first
# (open_questions.label_scheme_signoff).
verdict_coverage:
  status: verdict_layer_built_and_running
  status_history: >
    Was `axes_canonical_rules_pending_signoff` until 14-Sep-2026. The gate was
    open_questions.label_scheme_signoff, closed by "verdict text ported verbatim
    or absent" -- the most conservative scheme available. The axes block below
    was written BEFORE any rule read it, deliberately, so the layer was built
    against the right shape rather than retrofitted; that is why it still reads
    as a decision rather than a description.
  emitted_since: 2026-09-14
  emitted_by: finastro/verdicts.py
  emitted_figures_2027:
    total_rows: 4813
    carrying_a_verdict: 1720
    null_verdict: 3093
    by_tier: {source_backed: 885, cross_market_localized: 648, venue_shifted: 210, book_derived: 47, no_rule: 3023}
    confidence: "untested on every row, no exceptions"
    null_verdict_breaks_down_into:
