# FinAstro 2027 Calendar — locked conventions
# Every decision here was either confirmed by the user or empirically validated
# against the Parth Prophecies 2026 source. Do not change without re-running
# tests/test_2026_regression.py.

year: 2027

# ---------------------------------------------------------------- astronomy
ayanamsha: LAHIRI          # validated: 2026 source Sun->Capricorn 14-Jan 15:08 IST
                           # Lahiri 15:07 | KP 12:50 | Raman 13-Jan. Lahiri wins.
node: mean                 # validated: Rahu->Capricorn 05-Dec-26 21:52 source
                           # mean 22:32 | true 25-Nov. Mean wins.
nakshatra_scheme: 27       # 27 for transits; 28 (with Abhijit) only for Vedha tables
abhijit_span_deg: [276.6667, 280.8889]   # 276d40' - 280d53'20"
ephemeris:
  preferred: swisseph_files      # sepl_18/semo_18 from SE_EPHE_PATH, else ./ephe (tools/fetch_ephe.py)
  fallback: moshier              # sub-arcsecond 1900-2100; adequate but diff before publishing
  # PUBLISHED ON swisseph_files since 18-Nov-2026. The diff against the Moshier
  # run, all 6,720 records of 2027: every record matched, no date moved; 111
  # displayed IST minutes moved, by 1 min except slow-planet D9/nakshatra
  # ingresses and speed crossings (Neptune D9 8 min, Pluto 6, Venus fast-start
  # 12). Sun/Moon/lunation/tithi/karana within 4 s, sign ingresses 15 s.
  # Two latent bugs surfaced only on the files and are fixed: the ephemeris flag
  # was OR'd into rise_trans's rsmi (FLG_SWIEPH == CALC_SET, so every sunrise
  # became a sunset), and the backend probe reported swisseph_files for any
  # existing directory because Swiss Ephemeris falls back without raising.
  se_ephe_path_env: SE_EPHE_PATH

# ---------------------------------------------------------------- locations
locations:
  mumbai:
    label: Mumbai
    lat: 18.9667            # 18d58'N
    lon: 72.8333            # 72d50'E
    alt: 0
    tz: Asia/Kolkata
    role: primary           # source's own reference; NSE/BSE/MCX
  new_york:
    label: New York
    lat: 40.7128
    lon: -74.0060
    alt: 0
    tz: America/New_York
    role: secondary         # evaluated separately, emits its own rows

# ---------------------------------------------------------------- time display
display:
  primary_tz: Asia/Kolkata
  secondary_tz: America/New_York
  date_format: "%d-%b-%Y"
  time_format: "%H:%M"
  show_weekday: true
  mark_day_shift: true      # prefix shifted secondary dates
  day_shift_marker: "<"
# 2027 US DST: begins 14-Mar 02:00 local, ends 07-Nov 02:00 local.
# Offsets are resolved through the IANA zone, never hardcoded.

# ---------------------------------------------------------------- weekday rules
# VALIDATED: 74/75 source rows reproduced by civil-day overlap.
#   sunrise-at-dawn  51/75 | civil-day overlap 74/75 | sunrise-to-sunrise 73/75
#   market-session   64/75
# Source From/Till times match civil-day span boundaries exactly
#   (Mrigashira Thu 01-Jan "From 22:50" -> computed 22:50).
# G-4 CLOSED. The convention is now locked against every weekday-conditioned
# per-date table in the document, not a sample: 12 families, 64 printed rows.
# 63/63 reproduce once the one source defect above is subtracted, and no rule
# family systematically fails -- every family reproduces 100% of its printed
# rows. The 27 extra dates the convention emits are recorded, not tuned away;
# see weekday_rule.extras below and gap G-5 in build/STEP3_REPORT.md.
weekday_rule:
  convention: civil_day_overlap
  emit_span: true           # From/Till within the local civil day
  session_flag: true        # in-session / off-market annotation
  evaluate_per_location: true   # Mumbai and New York produce separate rows
                                # 2026 divergence: 103 IST vs 119 NY, 90 shared

  # ------------------------------------------------------- complete coverage
  # Which tables the convention is locked against. Stated so "all weekday rules
  # are covered" is checkable rather than an impression.
  coverage:
    families_fixtured: 12
    printed_rows: 64
    reproduced: "63/63 after subtracting the 28-Jun-26 Anuradha defect"
    families_with_zero_extras: 4      # Ekadashi/Fri, Mrigashira/Thu, Vyatipata, Uttara Ashadha/Mon
    tables_excluded_with_reason: 5    # see WEEKDAY_TABLES_NOT_FIXTURED in the harness
    fixtures: "tests/test_2026_regression.py::SOURCE_WEEKDAY_RULES"

  # ------------------------------------------------------------------ extras
  # Dates the convention emits that the source does not print. NOT tuned away:
  # they are the source's omissions unless evidence says otherwise, and no
  # evidence yet says otherwise. Recorded so the margin is known rather than
  # hidden.
  extras:
    total: 27
    status: unexplained
    by_family:
      "Ashtami on Tuesday/Saturday/Sunday (p.62)": 12
      "Ashtami on Monday/Thursday/Friday (p.63)": 6
      "Shatabhisha on Tuesday (p.80)": 2
      "Shukla Shasthi on Friday (p.80)": 2
      "Ashwini on Tuesday (p.61)": 2
      "Shukla Pratipada on Saturday/Sunday (p.77)": 1
      "Shukla Trayodashi on Tuesday/Saturday (p.86)": 1
      "Anuradha on Sunday (p.80)": 1
      "Ekadashi on Friday (p.54)": 0
      "Mrigashira on Thursday (p.82)": 0
      "Vyatipata on Tue/Sat/Sun (p.77)": 0
      "Uttara Ashadha on Monday (p.83)": 0
    pattern: >
      The extras cluster by FAMILY, not by month -- 1 to 5 per month across the
      whole year, with no part of the year favoured. Two-thirds of them (18 of
      27) are the two Ashtami tables. Four families have none at all and
      reproduce the source exactly, so those four read as exhaustive lists while
      the other eight read as selected ones. The selection criterion is not
      recoverable from the document.
    discriminators_tested_and_rejected:
      duration: >
        Extras skew short -- median 6.4h of condition inside the civil day
        against 16.0h for printed rows, and 13 of 27 extras are under 6h against
        6 of 63 printed rows -- but the distributions OVERLAP. One printed row
        holds for only 1.2h (Mrigashira Thu 01-Jan-26) and one extra holds for
        20.6h, so no duration threshold separates them.
      prevailing_at_sunrise: >
        Decisively rejected. A sunrise filter would keep 15 of the 27 extras
        while discarding 48 of the 63 printed rows. This is the same result the
        original convention sweep found (sunrise-at-dawn reproduced 51/75) and
        rules sunrise out as a secondary filter as well as a primary rule.
      occurrence_deduplication: >
        Rejected. Tested as "the source prints one row per occurrence, so an
        extra is the second civil day of a run already printed". Emitted days
        were grouped by the contiguous run of the underlying condition and each
        extra asked whether it shares a run with a printed row. Only 7 of the 27
        extras do: Ashtami Tue/Sat/Sun 4 of 12 (10-Jan, 09-May, 24-May, 04-Oct),
        Ashtami Mon/Thu/Fri 2 of 6 (09-Apr, 23-Apr), Shukla Pratipada Sat/Sun
        1 of 1 (10-Oct). The other five families with extras contribute none --
        Shatabhisha 0 of 2, Shukla Shasthi 0 of 2, Ashwini 0 of 2, Anuradha
        0 of 1, Shukla Trayodashi 0 of 1. A one-row-per-occurrence rule leaves
        20 of 27 extras unexplained, so it is not the selection criterion. It
        is, however, the whole of the p.62 Sunday story -- see p62_reread.
      one_day_per_occurrence_selection: >
        The general form of the discriminator above, and rejected with it.
        Occurrences were grouped by contiguous condition run under each
        family's PRINTED weekday set, and each candidate selection rule scored
        across all 12 families against 63 printed rows in scope:

          all qualifying days     63/63 printed,  27 extras,  0 missed
          first qualifying day    58/63 printed,  25 extras,  5 missed
          last qualifying day     61/63 printed,  22 extras,  2 missed
          longest overlap         62/63 printed,  21 extras,  1 missed

        Every rule buys a smaller extras count with printed rows it can no
        longer reproduce, and the exchange rate is close to one for one: the
        best of them, longest overlap, discards 6 extras and loses a printed
        row doing it. A criterion that were really the source's would cut extras
        while leaving all 63 standing. None does. That is the signature of an
        absent criterion rather than an unidentified one, and it generalises
        past de-duplication: it rejects the whole family of one-row-per-
        occurrence rules at once, so the shape does not need retrying.

        An independent sweep run separately reported 62 printed and 26 extras
        on the baseline, one lower in each column throughout with identical
        missed counts. The difference is scope, not arithmetic: it dropped
        Anuradha p.80 whole for containing a defective row, where the figures
        above drop only the defective row (28-Jun-26) and keep the family's one
        remaining printed row and its one extra. Anuradha is never missed under
        any rule, which is why only two columns shift. Conclusion identical
        either way.

    # --------------------------------------------------- p.62 re-read, per cell
    # The lead was that p.62's two oddities -- Sunday rows under a Tuesday /
    # Saturday title, and a reported column shear -- were one fact, a misaligned
    # date column. Tested cell by cell. They are one fact, but not that one.
    p62_reread:
      column_shear: >
        NOT PRESENT. Every one of the nine printed rows has its printed weekday
        equal to the true weekday of its printed date -- 11-Jan Sunday,
        24-Feb Tuesday, 10-May Sunday, 23-May Saturday, 21-Jul Tuesday,
        19-Sep Saturday, 03-Oct Saturday, 17-Nov Tuesday, 01-Dec Tuesday, all
        nine agreeing. Date and Day are internally consistent with each other,
        so neither column needs to be preferred and no re-derivation is
        warranted. The transcription note claiming "5 headers, 4 values per row"
        is wrong: the table has five headers and five cells per row.
      the_third_column_is_data: >
        The column mistaken for a shear is headed "Monday" and carries a date.
        It is populated on exactly the Saturday and Sunday rows and empty on
        every Tuesday row, and it always lands on a Monday -- Saturday+2d for
        23-May, 19-Sep, 03-Oct; Sunday+1d for 11-Jan and 10-May. It is the
        table's own note made into a column: "Whenever Asthami falls on a
        Saturday, the following Monday is Bullish."
      what_the_sunday_rows_are: >
        The note's rule is conditioned on SATURDAY, yet both Sunday rows carry a
        Monday value. Both are the tail of a Saturday-Sunday Ashtami run whose
        Saturday the engine emits as an extra: 10-Jan-26 Sat with 11-Jan-26 Sun
        printed, 09-May-26 Sat with 10-May-26 Sun printed. So p.62's Sunday rows
        are Saturday occurrences dated to the second civil day, not evidence of
        a third qualifying weekday.
      narrowing_to_the_title_set_is_refuted: >
        An earlier note here claimed {Tue, Sat} plus one-row-per-occurrence
        would reproduce 9 of 9 printed rows with 4 extras. That was wrong, and
        wrong in a specific way worth remembering: it counted an OCCURRENCE as
        matched (emitted 10-Jan shares a condition run with printed 11-Jan) and
        reported it as a DATE reproduced. Under date equality the figure is 7
        of 9. De-duplication selects from the qualifying set, it cannot step
        outside it, and under {Tue, Sat} that set is a single Saturday per
        occurrence -- 10-Jan-26 Sat for the January run, 09-May-26 Sat for the
        May run. The source prints 11-Jan and 10-May, both Sundays. No selection
        rule over a Sunday-excluding weekday set can emit a Sunday, so the
        printed rows themselves require {6} to qualify. {Tue, Sat} is refuted,
        not supported, and the fixture correctly carries {Tue, Sat, Sun}.

# ---------------------------------------------------------------- combustion
# VALIDATED against all 23 source combust/rise dates.
#   fixed ecliptic orbs  REJECTED (Mercury spread 10.0-15.4 deg)
#   SE heliacal_ut       REJECTED (Venus off 9-10 days, Mars 13)
#   classical kalamsha   CONFIRMED
# kalamsha = time-degree gap between planet and Sun rise (morning) or set (evening),
# measured at the primary location. 1 hour = 15 degrees.
# Thresholds below are CALIBRATED from the 2026 source, not the textbook table.
# They sit a uniform ~2.3 deg below classical values, a rise/set convention offset.
combustion:
  method: kalamsha
  rise_set_flags: disc_center_no_refraction
  thresholds_deg:
    mercury:  {direct: 11.60, retrograde: 11.60}   # classical 14 / 12
    venus:    {direct: 6.90,  retrograde: 5.40}    # classical 10 / 8
    mars:     {direct: 15.25, retrograde: 15.25}   # classical 17
    jupiter:  {direct: 9.43,  retrograde: 9.43}    # classical 11
    saturn:   {direct: 12.70, retrograde: 12.70}   # classical 15
  # Honest precision, derived from the scatter of the source calibration points
  # divided by the body's daily rate of change in kalamsha. Not a target -- a
  # measured limit. Mercury has 13 points spanning 1.66 deg at ~0.45 deg/day.
  precision_days:
    mercury: 2      # 13 calibration points, spread 1.66 deg
    venus:   1      # 4 points, spread 0.17 deg within each motion state
    mars:    2      # 2 points only (15.48, 15.03) -- weakest calibration
    jupiter: 1      # 2 points, spread 0.02 deg
    saturn:  1      # 2 points, spread 0.21 deg
  certainty:
    mercury: B
    venus:   A
    mars:    B      # upgrade to A if more calibration points become available
    jupiter: A
    saturn:  A
  direction_from_elongation_sign: true   # east/morning if planet behind Sun

# ---------------------------------------------------------------- derived lists
# VALIDATED: dd + mm = yy reproduces 12/12 source dates, zero extras.
# Pure arithmetic -- certainty A, no ephemeris involved.
total_days:
  rule: "dd + mm == yy"
  certainty: A

big_volatile:
  rule: undocumented
  certainty: C
  note: >
    All 51 source dates carry at least one major configuration (inner-planet
    conjunction, station, lunation, Sun ingress, or a slow-pair aspect within
    1 deg), but the list is over-determined and the source weighting is not
    recoverable. NO reconstruction is emitted -- see ported_as below.
  # PORTED 14-Sep-2026 AS A RECORDED ABSENCE, deliberately not reconstructed.
  # B70's date cells hold 51 dates (the source itself footnotes one typo,
  # "07-Aug-62" for 07-Aug-26). Four candidate discriminators were tested and
  # rejected in earlier work -- see build/STEP4_DECISIONS.md section 12.7. The
  # section's own remark says the dates "have been sorted on multiple
  # parameters" and names none of them, so what is missing is a
  # source_selection_rule and not an ephemeris input. The rule is registered
  # blocked with that as its named missing input and certainty C, which is the
  # grade the source's own silence earns, and it emits NOTHING: a fitted
  # candidate list would reproduce the 51 dates and predict nothing, which is a
  # description of our own fit rather than the source's rule.
  ported_as: recorded_absence
  rule_id: b070_big_volatile_major_turning_days
  emitted_dates: 0
  distinct_dates: 51

# ---------------------------------------------------------------- shar
# SETTLED 14-Sep-2026. Shar is the sign of the ecliptic LATITUDE: North above
# the plane, South below. Settled by reproducing the source's own printed dates
# from the engine, the way ayanamsha and the node were, and not from the word.
#
# B118 (pp.92) prints a North/South period per planet with the date each ends.
#   Mars     prints ONE sign change, 26-Jul-26.  Engine: 25-Jul-26 05:44 (0.76 d)
#   Venus    prints THREE interior ends.        Engine: 3 crossings, 0.54/0.01/0.85 d
#   Mercury  prints NINE interior ends.         Engine: 8 crossings
# The crossing COUNT agreeing with the printed row count is the strong part.
#
# B119 (p.93) prints the Moon's 27-row North/South alternation.
#   latitude sign      reproduces 26 of 27 ends within 1.5 d (worst 1.98 d)
#   declination sign   reproduces  0 of 27, every miss 1.5-3.7 d, same direction
#
# DECLINATION IS THE REJECTED READING, on the source's own numbers:
#   Mars    declination crosses 12-Apr-26; B118 prints South until 26-Jul-26
#           -> 104 days apart, not a tolerance
#   Saturn  declination crosses 27-Mar-26; B118 prints South for the entire year
#   B119    0/27 -- a different quantity's phase, systematically late
#
# WHAT IT COSTS. Latitude is emitted on every record but has no ingress series,
# so a zero-crossing is known only to lie in the gap between two records. Moon
# 0.23 d median / 1.03 d worst; Mercury 1.8 d; Venus 2.7 d; but Pluto has four
# records in the span and its gap runs to 163 d, so a Pluto Shar change is dated
# to within months. Grade B for exactly the reason a sunrise is B: the quantity
# is exact and the INSTANT is definition-sensitive.
shar:
  quantity: ecliptic_latitude_sign
  north: latitude > 0
  south: latitude < 0
  certainty: B
  sources: [B118, B119]
  bodies: [Mars, Mercury, Jupiter, Venus, Saturn, Herschel, Neptune, Moon]
  rejected_readings:
    - reading: declination_sign
      rejected_on: >-
        Mars's declination crosses zero on 12-Apr-26 while B118 prints South
        until 26-Jul-26 (104 d); Saturn's crosses on 27-Mar-26 while B118 prints
        South all year; and against B119's 27 printed ends the declination sign
        reproduces 0/27, every miss 1.5-3.7 d late. A different quantity's
        phase, not a tolerance to widen.
  boundary_uncertainty: >-
    A span boundary is known only to the gap between the two records that
    straddle it, because the layer emits no latitude ingress series. Every
    firing carries boundary_uncertain_to_the_record_gap.
  emission: one_row_per_change

