# ================================================================ rulership
# The planet -> instrument/sector map, reconciled across the three sections of
# the user's book that carry one, plus the map the 2026 SOURCE prints for
# itself. Recorded here because verdict_coverage.tier_3 derives from it and
# because the four witnesses do not agree.
#
# WITNESSES (all read in full, not sampled):
#   book_ch15  "The Celestial Ledger" Ch15 Commodities -- Gold, Silver & the Metals
#   book_ch16  "The Celestial Ledger" Ch16 Sector & Stock Selection
#   book_appB  "The Celestial Ledger" Appendix B.5 "The sector -> planet map"
#   source     data/source_2026.html, the map the source prints for its OWN
#              verdicts (pp.210, 214-218) and uses throughout its monthly tables
#              via the phrase "sectors ruled by X"
#
# The book is NOT in the project tree. It was read from
#   C:/Shiva/Horoscopes/FinAstro/FinAstro_Guide/raw/
#     Kindle_Ch15_Commodities.html
#     Kindle_Ch16_Sector_Stock_Selection.html
#     Kindle_Appendices_A-C.html   (Appendix B is inside this file)
# Recorded so the provenance is checkable and so the next reader does not search
# config/ and data/ for it.
rulership:
  status: reconciled_pending_signoff

  # --------------------------------------------------- corrections on record
  # Two claims in the instruction that built this table were wrong. Recorded as
  # the user's own, at the user's instruction, rather than silently repaired.
  # Provenance of a table is not only where the evidence came from; it is also
  # which assertions about the evidence did not survive checking.
  corrections_on_record:

    - id: ch15_silence_read_as_agreement
      claimed: "Ch15 agrees with Ch16 and Appendix B across the sector map -- three-way agreement."
      attributed_to: user_prompt
      status: corrected_and_applied_to_table
      corrected_to: >
        Ch15 is a COMMODITIES chapter. It takes part in three-way book agreement
        on exactly THREE mappings -- Sun -> gold, Mars -> base metals and
        defence, Saturn -> oil. It says nothing whatever about IT, banking,
        autos, FMCG or Rahu, and silence is not agreement. Every `witnesses`
        list in the table below therefore names only sections that actually make
        the assignment, and Mercury -> IT and Venus -> autos are recorded as
        TWO-way (book_ch16 + book_appB), not three-way.
      consequence: >
        Two of the map's most-used rows are weaker than the instruction assumed,
        and both are ALSO contradicted by the source -- see
        rulership.sector_mapping_reopened.items.it_telecom and .automobiles.

    - id: bphs_venus_silver
      claimed: "BPHS gives Venus silver alongside the diamond; the Moon holds silver alongside the pearl."
      attributed_to: user_prompt
      status: unverified_by_source
      source_checked: none
      note: >
        Cited from recall and never checked against BPHS. BPHS is not in the
        project tree and was not read. The claim may well be right -- nothing
        here refutes it -- but none of the four sections this table was
        reconciled from witnesses it, so it must not be recorded as a witnessed
        classical claim. It is kept as the STATED grounds for the Venus rival,
        marked unverified, and it does not move the Moon-primary decision, which
        rests on book_ch15's own Sun-Moon-spread construction instead.
      see: rulership.conflicts.silver_moon_vs_venus

  # ------------------------------------------------------- the reconciled map
  # "witnesses" lists only the sections that make the assignment. SILENCE IS NOT
  # AGREEMENT: Ch15 is a commodities chapter and says nothing about IT, banking,
  # autos or Rahu, so it cannot be counted as agreeing with Ch16/App B on them.
  table:
    Sun:
      primary: [gold]
      also: [government, power_energy, PSU, precious_stones, gilt_edged, renewables]
      witnesses: [book_ch15, book_ch16, book_appB, source]
      claim_tag: Classical          # book_ch15 calls Sun->gold one of only two
                                    # pedigreed asset rulerships in the whole book
      note: >
        Three-way book agreement AND source agreement. book_ch16 adds the Sun to
        Oil/Energy/PSU ("the Sun for power and government") and to gold-miners;
        book_appB prints "Government, power/energy, gold"; the source prints
        "Public Sector Enterprises, PSU Banks, Precious Stones, Gilt-edged
        securities, ... Gold (western astro)". The source additionally ties Nifty
        to the Sun -- "Vedh of Abhijeet is positive for sectors ruled by Sun and
        Nifty" and "Positive for sectors ruled by Sun including Nifty".
    Moon:
      primary: [silver]
      also: [FMCG, dairy, liquids, public_sentiment, agricultural_produce_water_linked]
      witnesses: [book_ch15, book_appB]
      claim_tag: Classical
      note: >
        See rulership.conflicts.silver_moon_vs_venus. book_ch16 does not assign
        silver at all (it is a sector chapter); the source prints no Moon sector
        row, though its monthly tables do say "Positive for Sectors ruled by
        Moon", so the source has a Moon rulership it never tabulates.
    Mars:
      primary: [base_metals, copper, defence]
      also: [real_estate, engineering, capital_goods, iron_steel_shared_with_saturn,
             healthcare_pharma_source_only, gold_source_only]
      witnesses: [book_ch15, book_ch16, book_appB, source]
      claim_tag: Framework
      note: >
        Three-way book agreement on base metals + defence. book_ch15 hedges iron
        ("also iron, in some schemes"); book_ch16 resolves it -- "Mars for base
        metals; Saturn for iron and coal". The source keeps iron DOUBLE-ruled and
        says so explicitly: "Iron and Steel ... the sector is ruled by Mars and
        Saturn both". The source also puts Gold and Healthcare/Pharma under Mars,
        which no book section does.
    Mercury:
      primary: [IT, telecom, media]
      also: [trading_brokerage, grains_as_commerce, money_flows_with_venus]
      witnesses: [book_ch16, book_appB]
      claim_tag: Framework
      note: >
        TWO-way, not three-way. book_ch15 gives Mercury only "agricultural trade
        and grains as commerce" and never mentions IT or telecom. The SOURCE
        prints no Mercury sector row at all and assigns Information Technology and
        Telecommunications to RAHU instead. So Mercury->IT is a book-only mapping
        that the source contradicts by omission-plus-reassignment.
    Jupiter:
      primary: [banking, finance]
      also: [education, pharma_appB_only, expansion_inflation_backdrop]
      witnesses: [book_ch16, book_appB, source]
      claim_tag: Framework
      note: >
        book_ch15 gives Jupiter only "the broad expansion/inflation backdrop",
        not banking. The source agrees with the book on banking through two
        constructs rather than a sector row: the Yearly Cabinet ("King (Raja) |
        Jupiter | Excess Liquidity in the Banking system; Banking and Finance will
        be in focus") and "Vargottam Jupiter is Positive for the sectors ruled by
        Jupiter, particularly Banking and Finance".
    Venus:
      primary: [autos, luxury, FMCG_ch16_only, entertainment, textiles]
      also: [sugar_and_soft_goods, silver_secondary_only]
      witnesses: [book_ch16, book_appB]
      claim_tag: Framework
      note: >
        TWO-way. book_ch15 gives Venus "an alternate silver/'value' significator;
        sugar and soft/luxury goods" and no autos. The source puts Automobiles
        under SATURN (heavy commercial vehicles) and under MARS, never Venus.
        Venus->silver is demoted to secondary -- see rulership.conflicts.
    Saturn:
      primary: [oil, crude, PSU, mining, infrastructure, labour]
      also: [iron, coal, cement, real_estate, logistics, heavy_industry]
      witnesses: [book_ch15, book_ch16, book_appB]
      claim_tag: Framework
      note: >
        Three-way BOOK agreement on oil -- one of only three mappings Ch15 takes
        part in at all (see corrections_on_record.ch15_silence_read_as_agreement).
        CONTRADICTED BY THE SOURCE, which gives Saturn "Oil-seeds" (not crude)
        and assigns "Crude oil" to Rahu. DECIDED 12-Sep-2026: not resolved to one
        planet. Saturn stays here AND Rahu's crude stays on Rahu's row; CL emits
        both. See rulership.conflicts.crude_saturn_vs_rahu.
    Rahu:
      primary: [speculation, tech, crypto]
      also: [aviation, media_entertainment, telecom, IT, AI, drones, logistics,
             crude_oil_source_only, pharmaceuticals_source_only, wind_power]
      witnesses: [book_ch16, book_appB, source]
      claim_tag: Framework
      note: >
        book_ch15 never mentions Rahu. The source's Rahu row is the widest of any
        planet and carries a scope clause the book has no equivalent for: "Rahu
        rules all the commodities of any Nakshatra (Star) or Sign where it stays".
        crude_oil_source_only is LIVE, not merely recorded: CL emits a Rahu path
        alongside its Saturn path -- see rulership.conflicts.crude_saturn_vs_rahu
        and verdict_coverage.tiers.tier_3.derivations.CL.paths. IT, telecom,
        pharmaceuticals and logistics on this row are the same kind of
        source-only assignment and are queued for the same treatment under
        rulership.sector_mapping_reopened.
    Ketu:
      primary: [pharma_niches]
      also: [spirituality, sudden_moves]
      witnesses: [book_ch16, book_appB]
      claim_tag: Framework
      note: "No source sector row. Not used by any tier below."

  # ------------------------------------------------ where the witnesses differ
  # Reported rather than averaged away. Each entry names the sections and quotes
  # them, so a later reader can re-adjudicate without re-reading the book.
  disagreements:

    crude_oil:
      severity: blocking
      book_ch15: "Saturn -- 'Iron, oil and crude, coal'; significator table 'Saturn | Oil / iron'"
      book_ch16: "Saturn (with Sun) -- 'Oil, Energy, PSU, Heavy Industry'; table 'Saturn | oil / PSU / metals'"
      book_appB: "Saturn -- 'Oil, PSUs, mining, infrastructure, labour'"
      source: "Rahu -- '... Logistics, Crude oil, Pharmaceuticals ...'; Saturn's row has 'Oil-seeds', an agricultural commodity, NOT crude"
      resolution: both_carried_neither_primary
      resolution_date: 2026-09-12
      resolution_kind: deliberate_non_resolution
      see: rulership.conflicts.crude_saturn_vs_rahu

    silver:
      severity: recorded
      book_ch15_primary: "Moon -- 'the lunar metal', Classical, and the Sun-Moon spread IS the gold-silver spread"
      book_ch15_rival: "Venus -- 'an alternate silver/value significator', listed under 'Framework ... modern practitioner convention, not classical'"
      book_appB: "Moon -- 'FMCG, dairy, liquids, silver, public sentiment'. Venus's row carries no silver."
      resolution: moon_primary_venus_secondary
      see: rulership.conflicts.silver_moon_vs_venus

    FMCG:
      severity: recorded
      book_ch16: "Venus -- 'Autos, FMCG, Luxury, Hospitality'; table 'Venus | autos / FMCG'"
      book_appB: "Moon -- 'FMCG, dairy, liquids, silver, public sentiment'. Venus's row is 'Autos, luxury, entertainment, textiles' -- no FMCG."
      resolution: not_resolved_no_instrument_depends_on_it
      note: "A flat contradiction between two book sections. No instrument in this config maps to FMCG, so nothing turns on it yet."

    pharma:
      severity: recorded
      book_ch16: "Moon, Mars, Ketu -- and the chapter itself says 'Assignment varies by scheme -- another reminder the map is convention'"
      book_appB: "Jupiter -- 'Banking/financials, education, pharma'; Ketu -- 'Pharma niches'"
      source: "Mars -- 'Healthcare & Pharma'; Rahu -- 'Pharmaceuticals'"
      resolution: not_resolved_no_instrument_depends_on_it

    iron_and_steel:
      severity: recorded
      book_ch15: "double-assigned inside one chapter -- Mars 'also iron, in some schemes' AND Saturn 'Iron, oil and crude, coal'"
      book_ch16: "resolves it -- 'Mars for base metals; Saturn for iron and coal'"
      source: "keeps both and says so -- 'the sector is ruled by Mars and Saturn both'"
      resolution: not_resolved_no_instrument_depends_on_it

    automobiles:
      severity: recorded
      book_ch16: "Venus -- 'Autos, FMCG, Luxury, Hospitality'"
      book_appB: "Venus -- 'Autos, luxury, entertainment, textiles'"
      source: "Saturn -- 'Automobiles (particularly Heavy Commercial Vehicles)'; Mars -- 'Automobile'. Venus gets no sector row at all."
      resolution: not_resolved_no_instrument_depends_on_it

    sugar:
      severity: coverage_gap_not_contradiction
      book_ch15: "Venus -- 'sugar and soft/luxury goods'"
      book_ch16: absent
      book_appB: absent
      source: "carries full Bullish and Bearish CONFIGURATION sections for Sugar and Jaggery (pp.168-173, 174-175) and names no ruling planet for it"
      resolution: >
        Irrelevant to coverage. SUGAR is tier 1 and takes its verdicts from the
        source's own configuration sections, so no rulership is needed to reach it.

  # ----------------------------------------------- the two encoded resolutions
  conflicts:

    silver_moon_vs_venus:
      decision: "SILVER = MOON, primary. Venus may enter only as a SECONDARY modifier, never as primary."
      status: settled_by_user
      reason_recorded: >
        Not convention-following. book_ch15 CONSTRUCTS the gold-silver spread as
        the Sun-Moon spread -- "The Sun-Moon separation of roughly 96.9 degrees is
        the celestial analogue a practitioner would map onto the gold/silver
        ratio" -- so a Venus-ruled silver collapses the chapter's own
        construction. That is a structural argument, not a popularity one.
      rival: Venus
      rival_status: secondary_modifier_only
      rival_never: primary
      # Recorded so the disagreement does not read as settled.
      rival_grounds_as_stated_by_user: >
        BPHS gives Venus silver alongside the diamond; the Moon holds silver
        alongside the pearl. The conflict is real in the classical literature.
      rival_grounds_attributed_to: user_prompt
      rival_grounds_status: unverified_by_source
      rival_grounds_source_checked: none
      rival_grounds_correction_ref: rulership.corrections_on_record.bphs_venus_silver
      rival_grounds_as_witnessed_in_these_three_sections: >
        DIVERGENT FROM THE ABOVE, and recorded rather than reconciled. The book
        does not cite BPHS and does not treat Venus-silver as classical. It files
        Venus under "Framework -- The extensions are modern practitioner
        convention, not classical" and calls Venus "an alternate silver/value
        significator". Appendix B.5 gives Venus no silver at all. So WITHIN THESE
        THREE SECTIONS the conflict is Classical(Moon) vs Framework(Venus), not
        Classical vs Classical. The classical-literature claim may well be right;
        it is simply not witnessed by the sections this table was reconciled from,
        and must not be recorded as if it were.
      emit:
        primary_significator: Moon
        secondary_significator: Venus
        flag_on_any_venus_contribution: silver_venus_secondary_modifier
        claim_tag_primary: Classical
        claim_tag_secondary: Framework

    crude_saturn_vs_rahu:
      decision: "CRUDE = SATURN **and** RAHU. Both significators are carried, both are emitted, NEITHER is marked primary."
      decision_date: 2026-09-12
      decided_by: user
      status: DELIBERATELY_UNRESOLVED_BOTH_EMITTED
      blocking_for: nothing        # was verdict_rule_signoff; no longer blocks
      resolved_by_precedence: false

      # ---------------------------------------------------------------- why
      # This is NOT an oversight, NOT a deferral, and NOT a failure to choose.
      # The reasoning is recorded in full so a later reader cannot mistake it
      # for one, and cannot "tidy it up" by picking a winner.
      why_not_resolved: >
        Neither witness refutes the other. The classical weight is with Saturn --
        that which is extracted from underground, dark and heavy, of which
        mineral oil is the paradigm case -- and the book says so in three
        separate sections; a book/calendar contradiction has a real cost.
        But the source says Rahu, the source is what this project reproduces,
        and Rahu-as-crude is coherent on its own terms as the modern
        imported/speculative reading. Resolving by precedence would be resolving
        by fiat: the precedence rule ranks EVIDENCE for verdicts, and applying
        it to a rulership dispute would silently convert a question about the
        world into a question about filing order.
      why_both_is_cheap: >
        Carrying both costs nothing and discards nothing. It converts an
        unresolvable rulership dispute into a TESTABLE DIVERGENCE, which is the
        only way it can actually be settled in a project built to test
        astro-financial signals empirically. Deciding by fiat now would destroy
        the experiment to save 34 rows.
      deciding_fact: >
        Volume. 26 Saturn-conditioned 2027 events against 8 Rahu-conditioned
        ones. Choosing Rahu alone would have shrunk CL's addressable population
        by roughly two thirds; choosing Saturn alone would have discarded the
        source's own map. Keeping both costs 34 rows.

      # ------------------------------------------------- the intended test
      divergence_is_the_point: true
      test_design:
        intent: >
          The two paths are the experiment. Once verdicts exist and outcomes are
          scored, the question "is crude Saturn's or Rahu's?" is answered by
          which path's verdicts land, not by which witness is older.
        not_a_per_event_test: >
          CHECKED, NOT ASSUMED, and it constrains the test. In calendar 2027 the
          Saturn set and the Rahu set are DISJOINT -- 26 + 8 = 34 with an empty
          intersection; no 2027 event carries both bodies. So every CL verdict
          comes from exactly one path, and the two paths can never contradict
          each other on the same event. The test is therefore a POPULATION-level
          comparison of hit rates, not a per-event agreement count.
        power_caveat: >
          8 Rahu-conditioned events in a year is a small sample. A single year
          cannot settle this; several years of scored outcomes will be needed
          before the divergence means anything. Recorded here so the first
          year's numbers are not over-read.
        overlap_2027: 0

      # ------------------------------------------------------- what is emitted
      emit:
        both_paths: true
        primary: null                     # MUST remain null in the OUTPUT.
        primary_note: >
          This config records that the BOOK favours Saturn (three sections) and
          that the SOURCE favours Rahu (its own sector map). The emitted record
          must not pre-judge between them: no emitted CL verdict carries a
          primary/secondary ranking, and no consumer may infer one from field
          order.
        flag_on_every_cl_verdict: crude_significator_contested
        cross_reference_required: true
        cross_reference_note: >
          Every emitted CL verdict names the other path explicitly, so a
          consumer reading one path can never be unaware of the other.
        paths_defined_at: verdict_coverage.tiers.tier_3.derivations.CL.paths

      # ------------------------------------------- superseded prior position
      superseded_decision: >
        The earlier instruction "CRUDE = SATURN, tier 3 book_derived" is
        superseded. It is kept in the record below because the CL Saturn path is
        still exactly that rule, unchanged, with its three citations intact --
        what changed is that it is no longer the ONLY thing emitted.
      user_instruction_basis_original: >
        "crude: Saturn. Backed three ways (Ch15 oil/iron, Ch16 oil/PSU/metals,
        App B oil/PSUs/mining)." All three book citations verified correct and
        quoted in rulership.disagreements.crude_oil.
      evidence_for_rahu: >
        The 2026 SOURCE prints its own planet->sector map twice (pp.210 and
        214-218) and assigns "Crude oil" to RAHU. Saturn's row in the same table
        carries "Oil-seeds" -- an agricultural commodity, not crude. The
        source's map is not decorative: the phrase "sectors ruled by X" drives
        verdicts throughout its monthly event tables (e.g. "Positive for Sectors
        ruled by Rahu", "especially in sectors ruled by Saturn"), so this is the
        map the source's own verdicts run on.
      scope_consequence_recorded:
        saturn_conditioned_events_2027: 26
        rahu_conditioned_events_2027: 8
        union_2027: 34
        intersection_2027: 0

      reopens: sector_mapping
      reopens_reason: >
        Ruling the source's map load-bearing here makes it load-bearing
        everywhere. The other seven source-vs-book sector disagreements are owed
        the same dual treatment when their instruments come into scope. See
        rulership.sector_mapping_reopened.

  # ------------------------------------------------- sector_mapping REOPENED
  # Closed at the coverage step, reopened by the crude decision on 12-Sep-2026.
  sector_mapping_reopened:
    status: reopened
    reopened_date: 2026-09-12
    trigger: rulership.conflicts.crude_saturn_vs_rahu
    trigger_reason: >
      The crude case proves the source's sector map is load-bearing. A map that
      outweighs three book sections on crude cannot be treated as decorative on
      autos, pharma, FMCG or iron.
    blocking_now: false
    blocking_now_reason: >
      No instrument currently in `instruments` maps to any of the seven. Nothing
      in the 2027 build turns on them yet.
    trigger_point: "when an instrument mapping to that sector enters `instruments`"
    treatment_owed: >
      The same shape CL just got: both mappings carried, each with its own tier,
      claim_tag and citation, NEITHER marked primary, every affected verdict
      flagged <sector>_significator_contested and cross-referenced to the rival
      path, and the divergence recorded as the intended test rather than as a
      defect.
    items:

      it_telecom:
        book: "Mercury -- book_ch16 'IT, telecom, media'; book_appB same. TWO-way only; book_ch15 never mentions IT or telecom."
        source: "Rahu -- 'Information Technology', 'Telecommunications'. The source prints NO Mercury sector row at all."
        kind: omission_plus_reassignment
        severity: high_if_scoped
        note: >
          The strongest source-vs-book disagreement after crude, and structurally
          worse: the source does not merely disagree, it gives Mercury no sector
          row at all. Would bite immediately if any IT instrument is added.

      automobiles:
        book: "Venus -- book_ch16 'Autos, FMCG, Luxury, Hospitality'; book_appB 'Autos, luxury, entertainment, textiles'. TWO-way only."
        source: "Saturn -- 'Automobiles (particularly Heavy Commercial Vehicles)'; Mars -- 'Automobile'. Venus gets no sector row at all."
        kind: reassignment_to_two_other_planets
        severity: high_if_scoped

      pharma:
        book: "book_ch16 Moon/Mars/Ketu, and the chapter itself concedes 'Assignment varies by scheme'; book_appB Jupiter + Ketu."
        source: "Mars -- 'Healthcare & Pharma'; Rahu -- 'Pharmaceuticals'."
        kind: four_way_disagreement_including_book_internal
        severity: high_if_scoped
        note: "The book is not internally agreed here either, so a dual emit would be a triple."

      iron_and_steel:
        book: "book_ch15 double-assigns inside one chapter (Mars 'also iron, in some schemes' AND Saturn 'Iron, oil and crude, coal'); book_ch16 resolves it to 'Mars for base metals; Saturn for iron and coal'."
        source: "keeps BOTH and says so outright -- 'the sector is ruled by Mars and Saturn both'."
        kind: source_declines_the_books_resolution
        severity: medium_if_scoped
        note: "Here the SOURCE is the one refusing to resolve. Dual emit is what the source itself prescribes."

      FMCG:
        book: "FLAT CONTRADICTION between two book sections -- book_ch16 Venus, book_appB Moon."
        source: "no FMCG row. The source has a Moon rulership it invokes ('Positive for Sectors ruled by Moon') but never tabulates."
        kind: book_internal_contradiction_plus_source_gap
        severity: medium_if_scoped

      gold_secondary:
        book: "Sun -- the only three-way-plus-source agreement in the table, and book_ch15 calls Sun->gold one of just two pedigreed asset rulerships in the whole book."
        source: "agrees (Sun, 'Gold (western astro)') but ALSO puts Gold under MARS."
        kind: source_internal_double_assignment
        severity: low_but_live
        note: >
          LIVE NOW, unlike the other six -- GC and MCXGOLD are in scope. It does
          not disturb them: gold reaches tier 1 through the source's own Gold
          configuration sections, not through any rulership, so no significator
          path is used and nothing here is load-bearing yet. It becomes live the
          moment a gold verdict is derived from rulership rather than read from a
          configuration section.

      logistics:
        book: "Saturn -- book_appB 'Oil, PSUs, mining, infrastructure, labour' with logistics in the extended row."
        source: "Rahu -- 'Logistics, Crude oil, Pharmaceuticals'."
        kind: same_row_same_dispute_as_crude
        severity: low_if_scoped
        note: >
          The identical Saturn-vs-Rahu split as crude, on the adjacent item of
          the same source row. Whatever settles crude should settle this.

    excluded_as_sub_threshold:
      - "Sun 'renewables' vs Rahu 'wind_power' -- adjacent rather than contradictory; no section denies the other."
      - "Mercury 'money_flows_with_venus' vs Venus -- the book states the sharing itself, so it is not a disagreement."
    excluded_note: >
      Listed so the count of seven is auditable and not the result of a quiet
      trim.

# ========================================================== verdict coverage
# WHAT THIS BLOCK IS: the definition of WHICH instruments may carry a verdict,
# on WHAT evidence, and at what PROVENANCE tier. It defines coverage only.
# NO VERDICTS ARE GENERATED HERE and no verdict rule is written here -- the rule
# layer needs labels.claim_tag / confidence sign-off first
# (open_questions.label_scheme_signoff).
verdict_coverage:
  status: axes_canonical_rules_pending_signoff

  # ======================================================================= axes
  # CANONICAL 13-Sep-2026. The coverage model has TWO fields, not one. They are
  # `evidence_source` and `construction`, and they are what a rule is written
  # against. `tier` is a DERIVED convenience name over the pair -- kept because
  # eleven instruments and three reports already speak in tier names, demoted
  # because it answers two questions at once and therefore answers neither
  # cleanly. See build/STEP4_DECISIONS.md section 3.
  #
  # Made canonical BEFORE any rule reads it, deliberately. Nothing emits these
  # fields today -- no verdict record exists to carry them -- so this block
  # changes no output. It exists so the rule layer is built against the right
  # shape instead of being retrofitted once it has consumers.
  axes:
    canonical: true
    canonical_since: 2026-09-13
    fields: [evidence_source, construction]
    emitted_today: false
    emitted_today_note: >
      No verdict record exists yet, so nothing carries either field. This block
      is a schema decision, not an emit. The build hash must not move when it
      lands, and that is checked.

    evidence_source:
      question: "Where does the claim come from?"
      values: [source, book, source_and_book, none]
      meanings:
        source:          "data/source_2026.html states it."
        book:            "The Celestial Ledger states it; the source does not."
        source_and_book: "Both state it and they agree."
        none:            "No witness states it."
      widened_from_three_values: >
        STEP4_DECISIONS section 3.1 named three values -- source / book / none --
        and section 3.2's cross-tabulation then used a fourth, "source + book",
        on the BANKNIFTY Jupiter sector overlay row, where book_ch16, book_appB
        and the source all make the same assignment. The cross-tabulation
        enumerates actual rows and governs, so the value list is widened to four
        rather than the row being flattened into one witness. Recorded because
        collapsing it to `source` would have hidden a two-witness agreement and
        collapsing it to `book` would have dropped the source's own map -- the
        exact error rulership.corrections_on_record.ch15_silence_read_as_agreement
        was raised against.

    construction:
      question: "How is the verdict produced?"
      values: [printed, derived, null]
      meanings:
        printed: "The witness states the VERDICT itself. Nothing is inferred."
        derived: "A rulership is applied to a significator's condition."
        "null":  "No verdict is produced. The verdict field is null."
      null_is_a_value: >
        YAML null, not the string "null". It is a real member of the value set
        -- tier_4 constructs nothing -- and is the one construction under which
        a null verdict is legal.

    # -------------------------------------------- the pair is not sufficient
    # Checked against section 3.2 rather than assumed. (source, printed) appears
    # TWICE in that table with two different tiers: the Indian-equity rows at
    # tier 1 and the SPX/NDX rows at tier 2. The pair alone therefore cannot
    # reproduce the tier, and a third discriminator is required.
    #
    # This is not a third axis. It is a property of the EVALUATION, not of the
    # claim: whether the rule is evaluated on a civil day other than the one it
    # was authored against. Both axes are about the claim; this is about where
    # the claim is being applied.
    localized:
      is_an_axis: false
      is_a: evaluation_property
      question: "Is the rule evaluated on a civil day other than its authored one?"
      values: [true, false]
      set_by: civil_day_by_venue
      carried_as: >
        Already carried as flags, not invented here: SPX and NDX carry
        source_authored_for_indian_equities, and GC, SI and CL carry
        authored_ist_evaluated_venue_day. Both mean "authored against one civil
        day, evaluated against another" about two different mismatches.
      why_recorded_here: >
        Because without it the derivation below is not a function. Stated rather
        than resolved by picking one of the two (source, printed) rows, which
        would have silently reassigned either the Indian equities or SPX/NDX.

  # ================================================================ tier
  # DERIVED. Not a field a rule is written against; a name computed from the
  # pair above plus `localized`, kept for continuity with the eleven-instrument
  # table and the three reports that already use the names.
  tier_derivation:
    status: derived_convenience_mapping
    derived_from: [evidence_source, construction, localized]
    authority: >
      The axes are authoritative. Where a tier name and the pair disagree, the
      pair is right and the tier name is the lossy rendering -- which is the
      whole reason for the demotion. The known case is CL_rahu: the pair reads
      (source, derived), unambiguous and needing no flag, while the tier name
      reads source_backed, whose own definition says "nothing is derived".
    rules:
      # First match wins; the list is ordered, and `localized` is only consulted
      # where the pair is ambiguous.
      - {evidence_source: none,            construction: null,    tier: no_rule}
      # ADDED 13-Sep-2026, by the rule layer rather than by design. Catalogue B
      # contains sections that state a CONDITION and print no verdict at all --
      # Mars Combust Rise Cycle p.6 and Mercury Combust Rise Cycle p.10 are two
      # of them, bare tables with no remark and no inference. Ported faithfully,
      # such a rule fires with no verdict, and the pair it emits is
      # (source, null), which the six rows below did not cover.
      #
      # Its tier is NULL, and that is not the same as no_rule. no_rule means no
      # defensible rulership exists and nothing will ever attach; here the rule
      # exists, is source-backed and fires on real dates -- the source simply
      # declined to say what it means. The tier names classify a VERDICT, and
      # there is no verdict to classify.
      - {evidence_source: source,          construction: null,    tier: null,
         note: "condition-only section; the source prints no verdict"}
      - {evidence_source: source,          construction: printed, localized: false, tier: source_backed}
      - {evidence_source: source,          construction: printed, localized: true,  tier: localized}
      - {evidence_source: source,          construction: derived, tier: source_backed}
      - {evidence_source: book,            construction: derived, tier: book_derived}
      - {evidence_source: source_and_book, construction: derived, tier: book_derived}
    unmapped_is_an_error: >
      A pair with no rule above is a build error, not a default. In particular
      (book, printed) has no row: the book prints no dated verdict for any
      instrument in scope, and inventing a tier for it would invent the claim.
    cross_tabulation: "build/STEP4_DECISIONS.md section 3.2"

  # ------------------------------------------------------------------- emit
  # `evidence_source` and `construction` are the REQUIRED fields on every
  # emitted verdict. `tier` is emitted too, but as a derived rendering of them:
  # it is not a comment, not a footnote and not inferable from the instrument,
  # so it travels with the verdict and no downstream consumer can mistake a
  # localized or derived verdict for a source-backed one.
  emit:
    canonical_fields: [evidence_source, construction]
    evidence_source_values: [source, book, source_and_book, none]
    construction_values: [printed, derived, null]
    tier_field: tier                 # DERIVED from the pair; still emitted
    tier_values: [source_backed, localized, book_derived, no_rule]
    tier_is_derived: true
    tier_must_agree_with_axes: >
      The emitted tier must equal tier_derivation applied to the emitted pair.
      A record where they disagree is a build error: it means one of the two was
      set by hand.
    also_required:
      - claim_tag                    # from labels.claim_tag
      - provenance                   # section or derivation the verdict came from
      - flags                        # list; may be empty, never absent
    null_verdict_allowed_only_at: {evidence_source: none, construction: null}
    null_verdict_allowed_only_at_tier: no_rule   # the same rule, in tier names
    rejection_rule: >
      A verdict record without evidence_source or construction, or with a value
      outside the sets above, is a build error and must fail the emit, not be
      defaulted. The same applies to a tier that is absent, outside tier_values,
      or disagreeing with the pair it is supposed to be derived from.

  # ------------------------------------------------------------------ tiers
  # Retained in full. The four entries below are no longer the model -- they are
  # the four DERIVED names, each now carrying the axis pair it renders. The
  # evidence, instrument lists, derivations and civil-day rulings inside them are
  # unchanged and remain load-bearing.
  tiers:

    tier_1:
      name: source_backed
      means: "The 2026 source states the verdict itself. Nothing is derived."
      # The pair this name renders. Two pairs render to it, which is precisely
      # why the name was demoted: the CL Rahu path is (source, derived) and its
      # means clause above says "nothing is derived".
      axes: {evidence_source: source, construction: printed, localized: false}
      axes_also_rendering_to_this_name:
        - {evidence_source: source, construction: derived, applies_to: CL_rahu}
      claim_tag: Classical           # as printed by the source; per-rule tag may
                                     # be narrowed at rule-writing time
      flags_added: []
      instruments: [MCXGOLD, GC, MCXSILVER, SI, SUGAR, NIFTY, BANKNIFTY]
      evidence:
        gold: >
          "Gold -- Bullish Configuration" pp.136-144 and "Gold -- Bearish
          Configuration" pp.145-148. 17 named rule groups across the two.
        silver: >
          "Silver -- Bullish Configuration" pp.149-161 and "Silver -- Bearish
          Configuration" pp.162-167. 29 named rule groups across the two -- the
          largest configuration set in the document.
        sugar: >
          "Sugar and Jaggery -- Bullish Configuration" pp.168-173 and "Sugar and
          Jaggery -- Bearish Configuration" pp.174-175. 9 named rule groups.
          The bearish section closes with the source's own note "*Moon aspects to
          be added" -- an admitted incompleteness, carried forward as-is.
        indian_equities: >
          The source's general verdicts -- the weekday/panchang/transit rule
          families already fixtured under weekday_rule.coverage (12 families, 64
          printed rows) plus the p.44-p.104 named families. These are market-wide
          verdicts, not instrument-specific ones.
      banknifty_note: >
        BANKNIFTY reaches tier 1 through the general verdicts like NIFTY. It ALSO
        has a Jupiter sector path on which book_ch16, book_appB and the source all
        agree (source: "Vargottam Jupiter is Positive for the sectors ruled by
        Jupiter, particularly Banking and Finance"). That path is a derived
        overlay and must be emitted at tier 3 with the derived flags if it is used
        at all -- it does not upgrade, and is not merged into, the tier-1 rows.
      civil_day: by_venue            # DECIDED 12-Sep-2026. See
                                     # verdict_coverage.civil_day_by_venue.
      civil_day_resolved:
        was: >
          OPEN. GC and SI are COMEX/Globex instruments carrying IST-stamped
          source rules. Tier 2 localizes MARKET-GENERAL rule families by venue
          civil day, but the gold/silver configurations are INSTRUMENT rules, not
          market rules, so the tier-2 argument does not automatically extend to
          them. Until decided, GC/SI inherited the Mumbai civil day.
        now: >
          RESOLVED. The venue determines the civil day, for instrument rules as
          well as market rules. MCXGOLD and MCXSILVER evaluate on the Mumbai day;
          GC and SI evaluate on the New York day. The gold/silver configurations
          keep their IST authorship in provenance and every affected verdict
          carries the flag authored_ist_evaluated_venue_day.
        reason: >
          The alternative has COMEX gold firing on a day the contract was not
          trading. This is not a new convention -- it is the dual-location
          evaluation already in the build, keyed on VENUE rather than on tier.

      # CL also emits a tier-1-tagged row, via the SOURCE's own sector map
      # (Rahu -> Crude oil) rather than via a configuration section. It is
      # deliberately NOT added to `instruments` above, which lists instruments
      # whose VERDICTS the source prints.
      instruments_via_source_rulership: [CL]
      instruments_via_source_rulership_note: >
        OBJECTION RECORDED, IMPLEMENTED AS RULED. tier_1.means is "The 2026
        source states the verdict itself. Nothing is derived." The CL Rahu path
        does not meet that: the source states the RULERSHIP, and the verdict is
        still derived by applying it to Rahu's condition -- which is tier_3's
        definition. The tier was assigned by verdict_coverage.precedence, which
        ranks EVIDENCE, not verdict CONSTRUCTION. Consequence: a consumer
        filtering on tier == source_backed will pick up a CL row whose verdict no
        section of the source prints. That is mitigated, not removed, by the flag
        rulership_source_stated_verdict_derived carried on every CL_rahu row.
        Raised so the tier's meaning stays honest; the ruling stands.
      see_cl: verdict_coverage.tiers.tier_3.derivations.CL.paths

    tier_2:
      name: localized
      axes: {evidence_source: source, construction: printed, localized: true}
      axes_note: >
        Same pair as tier_1. `localized` is what separates them, which is the
        row that proves the pair alone cannot reproduce the tier. See axes.localized.
      means: >
        The SAME rule families as Indian equities, evaluated on the New York
        civil day. Not a new rule, and not a chart substitution.
      justification: >
        The source's rule families here are TRANSIT and PANCHANG rules. They
        reference no natal chart -- they condition on planetary position, tithi,
        nakshatra, yoga, karana and weekday, all of which are defined
        independently of any location's chart. Evaluating them on a different
        civil day is therefore a change of DAY BOUNDARY, not a change of rule.
        The machinery already exists: weekday_rule.evaluate_per_location is true,
        Mumbai and New York already produce separate rows, and the 2026
        divergence is measured (103 IST vs 119 NY, 90 shared).
      claim_tag: Framework
      flags_added: [source_authored_for_indian_equities]
      instruments: [SPX, NDX]
      civil_day: new_york           # = by_venue for US_cash; see civil_day_by_venue
      rule_families: "identical to tier_1.indian_equities -- no additions, no substitutions"
      explicitly_not: >
        Not a US natal/foundation chart, not the NYSE 1792 chart, not a
        re-derivation. Any verdict requiring a natal chart is OUT of tier 2.
      narrative_layer: excluded      # see verdict_coverage.narrative_layer

    tier_3:
      name: book_derived
      axes: {evidence_source: book, construction: derived}
      axes_also_rendering_to_this_name:
        - {evidence_source: source_and_book, construction: derived,
           applies_to: "BANKNIFTY Jupiter sector overlay, if used at all"}
      means: >
        No source verdict exists for the instrument. The verdict is derived by
        applying the reconciled rulership to the significator's condition.
      claim_tag: Framework
      flags_added: [book_derived, no_source_verdict]
      instruments: [CL]
      derivations:
        CL:
          # DECIDED 12-Sep-2026. CL carries TWO significator paths. Both are
          # emitted. NEITHER is primary. This is a deliberate non-resolution --
          # rulership.conflicts.crude_saturn_vs_rahu records why, at length, so
          # it cannot later be read as an oversight.
          significator_resolution: dual_path_deliberately_unresolved
          emit_both: true
          primary: null
          primary_note: >
            MUST stay null in the emitted record. The config records that the
            book favours Saturn; the OUTPUT must not pre-judge. Path order in
            this list is alphabetical by id and carries no ranking.
          flag_on_every_cl_verdict: crude_significator_contested
          contested: rulership.conflicts.crude_saturn_vs_rahu
          civil_day: new_york        # CME_Globex venue; see civil_day_by_venue
          path_overlap_2027: 0
          path_overlap_note: >
            The two paths are DISJOINT in 2027: 26 Saturn events + 8 Rahu events
            = 34, intersection empty. No CL verdict is ever produced by both
            paths, so they cannot contradict each other on a single event. The
            intended divergence test is population-level, not per-event. See
            rulership.conflicts.crude_saturn_vs_rahu.test_design.

          paths:

            - id: CL_rahu
              significator: Rahu
              axes: {evidence_source: source, construction: derived}
              axes_note: >
                Unambiguous under the canonical pair, and needs no flag to be
                legible. rulership_source_stated_verdict_derived stays on the
                row for consumers reading the derived tier name, and becomes
                redundant rather than load-bearing once the pair is emitted.
              tier: source_backed        # DERIVED from the pair above
              tier_number: 1
              tier_basis: verdict_coverage.precedence
              claim_tag: Classical
              flags: [crude_significator_contested,
                      source_sector_map,
                      rulership_source_stated_verdict_derived]
              rulership_witnesses: [source]
              cited_sections:
                - "source pp.210 and 214-218 -- Rahu row: '... Logistics, Crude oil, Pharmaceuticals ...'"
                - "source, same table -- Saturn's row carries 'Oil-seeds', an agricultural commodity, NOT crude"
                - "source scope clause -- 'Rahu rules all the commodities of any Nakshatra (Star) or Sign where it stays'"
                - "source usage -- 'Positive for Sectors ruled by Rahu' drives verdicts throughout the monthly event tables, so this map is the one the source's own verdicts run on"
              scope: "events whose bodies include Rahu -- 8 in calendar 2027, on the New York civil day"
              cross_reference: CL_saturn
              tier_objection: verdict_coverage.tiers.tier_1.instruments_via_source_rulership_note

            - id: CL_saturn
              significator: Saturn
              axes: {evidence_source: book, construction: derived}
              tier: book_derived         # DERIVED from the pair above
              tier_number: 3
              tier_basis: "no source verdict and no source rulership for this path"
              claim_tag: Framework
              flags: [crude_significator_contested,
                      book_derived,
                      no_source_verdict,
                      rulership_contested_by_source]
              rulership_witnesses: [book_ch15, book_ch16, book_appB]
              cited_sections:
                - "book_ch15 -- 'Saturn ... Iron, oil and crude, coal'; significator table 'Saturn | Oil / iron'"
                - "book_ch16 -- 'Saturn . Sun -> Oil, Energy, PSU, Heavy Industry'; table 'Saturn | oil / PSU / metals'"
                - "book_appB -- B.5 'Saturn | Oil, PSUs, mining, infrastructure, labour'"
              scope: "events whose bodies include Saturn -- 26 in calendar 2027, on the New York civil day"
              cross_reference: CL_rahu

    tier_4:
      name: no_rule
      axes: {evidence_source: none, construction: null}
      means: "No defensible rulership exists. The verdict field is null."
      verdict: null
      claim_tag: null
      flags_added: [no_defensible_rulership]
      instruments: [USDINR]
      reason: >
        A currency pair is a RATIO OF TWO ECONOMIES, not a thing a significator
        maps to. Do not assign Mercury, and do not assign anything else.
      corroborated_by_absence: >
        Checked rather than assumed. None of book_ch15, book_ch16, book_appB or
        the source's own sector map contains a currency row. The nearest item in
        any of them is book_appB's Mercury -> "trading/brokerage", which is about
        brokers, not FX.
      emit_anyway: true
      emit_anyway_reason: >
        USDINR rows are still emitted with verdict null, so the absence is VISIBLE
        in the output rather than looking like a gap in the build.

  # ------------------------------------------------------- civil day by venue
  # DECIDED 12-Sep-2026. The evaluation civil day is a property of the VENUE,
  # not of the rule type and not of the tier. This is NOT a new convention: it
  # is the dual-location evaluation already in the build
  # (weekday_rule.evaluate_per_location, Mumbai and New York rows already
  # produced side by side), re-keyed from rule type onto venue.
  civil_day_by_venue:
    rule: "Every instrument evaluates on the civil day of its venue's location."
    supersedes: >
      The provisional rule under tier_1 that had GC and SI inheriting the Mumbai
      civil day because their rules were authored in IST. Authorship is not
      venue.
    reason: >
      The alternative has COMEX gold firing on a day the contract was not
      trading. A verdict that cannot be acted on at its own venue is not a
      verdict about that instrument.
    map:
      NSE:         mumbai
      NSE_FX:      mumbai
      MCX:         mumbai
      physical_IN: mumbai
      US_cash:     new_york
      CME_Globex:  new_york
    by_instrument:
      mumbai:   [NIFTY, BANKNIFTY, MCXGOLD, MCXSILVER, USDINR, SUGAR]
      new_york: [SPX, NDX, GC, SI, CL]
    changed_by_this_decision: [GC, SI, CL]
    unchanged_by_this_decision:
      already_new_york: [SPX, NDX]        # tier 2 was always evaluated on the NY day
      already_mumbai:   [NIFTY, BANKNIFTY, MCXGOLD, MCXSILVER, USDINR, SUGAR]

    provenance_unchanged: >
      The source's gold and silver configuration sections keep their IST
      authorship in provenance. Nothing about the rule text, its page citation or
      its authored timezone is re-stamped. Only the day boundary the rule is
      evaluated against moves.
    flag_on_every_affected_verdict: authored_ist_evaluated_venue_day
    flag_means: >
      "This rule was authored against the Mumbai civil day and is being evaluated
      against the venue civil day." Carried on every GC, SI and CL verdict. SPX
      and NDX already carry source_authored_for_indian_equities, which says the
      same thing about a different mismatch; both flags may appear together.

    # ------------------------------------------------------ measured divergence
    # The user asked how many gold/silver verdicts land on a different date under
    # the venue day than under the Mumbai day. No verdicts exist yet, so this is
    # measured on the ADDRESSABLE EVENTS -- the upper bound on affected verdicts.
    measured_divergence_2027:
      basis: >
        build/astronomy_2027.json, comparing time.start_stamp.ist_date against
        time.start_stamp.et_date on the event classes each instrument addresses.
        Scope is every event landing in calendar 2027 under EITHER civil day.
      gold_classes:
        in_scope: 1277
        different_calendar_date: 536
        pct: 42.0
      silver_classes:
        in_scope: 1282
        different_calendar_date: 537
        pct: 41.9
      cl_classes:
        in_scope: 34
        different_calendar_date: 19
        pct: 55.9
        split: {saturn_path: "17 of 26", rahu_path: "2 of 8"}
      direction: >
        Always -1, never +1. IST is UTC+5:30 and ET is UTC-5/-4, so the New York
        civil date is either the same day or one day EARLIER; it is never later.
        Every one of the 536/537 shifts is a same-or-previous-day shift.
      year_membership_effect:
        gold:   {mumbai_day_2027: 1276, new_york_day_2027: 1276, shared: 1275}
        silver: {mumbai_day_2027: 1281, new_york_day_2027: 1281, shared: 1280}
        boundary_events:
          - "sign_ingress:moon:20261231T231708Z -- 01-Jan-2027 IST / 31-Dec-2026 ET. IN under the Mumbai day, OUT under the New York day."
          - "sign_ingress:moon:20271231T211011Z -- 01-Jan-2028 IST / 31-Dec-2027 ET. OUT under the Mumbai day, IN under the New York day."
      reading: >
        THE NUMBER IS LARGE AND THE USER ASKED TO SEE IT IF SO: roughly 42% of
        addressable gold and silver events -- 536 and 537 respectively -- land on
        a different calendar date under the venue day than under the Mumbai day.
        This is not a defect and not a surprise: a 9.5-to-10.5 hour offset moves
        any event stamped before about 10:30 IST back a day, and the Moon
        ingresses that dominate these populations are uniformly distributed
        across the clock, so a ~40% shift rate is exactly what a uniform
        distribution predicts. What it means practically: the SIZE of the
        gold/silver population is nearly unchanged (1276 vs 1276; one event in,
        one out, both Moon sign ingresses on a New Year boundary), but the DATE
        two in five of them carry changes. Anything that joins these verdicts to
        price data by date must key on the instrument's venue day, not on a
        single global date column, or roughly two in five GC/SI rows will be
        joined to the wrong session.
      cl_reading: >
        CL's shift rate is higher (19 of 34, 55.9%) purely because Saturn's 2027
        events cluster in the Indian morning; the population size is unchanged at
        26 + 8 under either day.

  # ------------------------------------------------------------- precedence
  precedence:
    rule: "Where a source-backed verdict and a derived verdict would both apply to the same event AND the same instrument, source-backed wins."
    loser_is_retained: true
    loser_flag: superseded_by_source
    do_not_drop: >
      The derived verdict is kept alongside the winner, flagged. A SYSTEMATIC
      disagreement between the two is a finding about the derivation -- if
      derived verdicts are silently dropped, that finding can never surface.
    audit_intent: "Count agreements and disagreements between the kept pairs once the rule layer runs."

  # --------------------------------------------------------- narrative layer
  narrative_layer:
    scope: "The source's Salient Features / prophecy prose (pp.192-231 and the dated prophecy entries)."
    anchored_to: india_chart
    localizes: false
    flag: india_chart_anchored
    do_not_extend_to: [SPX, NDX, GC, SI, CL, USDINR]
    reason: >
      This layer is natal, not transit. The source computes it from a chart cast
      for "January 1, 2026, 0:00:00, 72E50'00, 18N58'00 -- Mumbai, India" and
      reasons in house lords off that chart ("Presence of Mercury (1st and 10th
      Lord) ... in the 4th house"), and it repeatedly invokes India's own natal
      chart ("There are many planets in Ashlesha in India's natal chart";
      "Venus is Lagnesh in the natal chart of India"). Tier 2's justification --
      that the rules reference no natal chart -- is exactly what fails here, so
      tier 2 does not reach this layer.
    tier_2_covers: rule_layer_verdicts_only

  # ------------------------------------------------- addressable event counts
  # NOT a verdict count -- no verdicts exist yet. This is the count of 2027
  # astronomy records a tier's rules could attach to: the UPPER BOUND on how many
  # events could carry a verdict once the rules are written. Method: map each
  # named rule group in the governing sections to the event_class it anchors on,
  # then count build/astronomy_2027.json records of those classes whose civil
  # date falls in calendar 2027.
  addressable_events_2027:
    basis: "build/astronomy_2027.json, 1569 records over 01-Dec-2026 -> 01-Feb-2028"
    in_year_total: {ist_civil_2027: 1347, et_civil_2027: 1348}
    # UPDATED 12-Sep-2026 for two decisions: (a) the civil day is now set by
    # venue, so gold and silver split into a Mumbai-day and a New-York-day
    # count; (b) CL carries two significator paths, so tier 3 is the UNION of
    # both, counted on the New York day.
    recount_note: >
      Counts are per CIVIL DAY now, not per instrument-family. Where a family
      splits across venues the two counts are given separately even when they
      are numerically equal -- equal size does not mean the same events, and on
      the New Year boundary it demonstrably is not (see
      civil_day_by_venue.measured_divergence_2027.year_membership_effect).
    tier_1:
      gold:
        classes: [sign_ingress, nakshatra_ingress, navamsa_ingress, conjunction, station, combustion, lunation]
        MCXGOLD: {count: 1276, civil_day: mumbai}
        GC:      {count: 1276, civil_day: new_york}
        same_size_different_membership: true
        date_shifted_between_the_two: 536
      silver:
        classes: [sign_ingress, nakshatra_ingress, navamsa_ingress, conjunction, station, combustion, eclipse, lunation]
        MCXSILVER: {count: 1281, civil_day: mumbai}
        SI:        {count: 1281, civil_day: new_york}
        same_size_different_membership: true
        date_shifted_between_the_two: 537
      sugar:    {count: 795,  civil_day: mumbai, classes: [sign_ingress, nakshatra_ingress, conjunction, combustion, eclipse, lunation]}
      indian_equities: {count: 1347, civil_day: mumbai, classes: all_eleven}
      distinct_union_mumbai_day: 1347
      cl_rahu_path: {count: 8, civil_day: new_york, basis: "events whose bodies include Rahu", see: tier_3}
      cl_rahu_path_note: >
        Counted here as well as under tier 3 because the CL Rahu path emits at
        tier 1. It is NOT added into distinct_union_mumbai_day -- different
        instrument, different civil day, and the union above is the Indian-day
        population.
    tier_2: {count: 1348, civil_day: new_york, classes: all_eleven}
    tier_3:
      CL_total: {count: 34, civil_day: new_york, basis: "union of both significator paths"}
      by_path:
        CL_saturn: {count: 26, tier: book_derived,  basis: "events whose bodies include Saturn"}
        CL_rahu:   {count: 8,  tier: source_backed, basis: "events whose bodies include Rahu"}
      overlap: 0
      overlap_note: >
        Verified against the build, not assumed: no 2027 record carries both
        Saturn and Rahu, so 26 + 8 = 34 exactly and the union is a clean sum.
      previous_ceiling: 26
      change: "+8, from adding the Rahu path. Nothing was removed."
      civil_day_effect_on_count: >
        None. Both paths count 26 and 8 under either civil day; only the DATES
        move (17 of 26 Saturn events and 2 of 8 Rahu events shift by one day).
      book_derived_subtotal: 26
      book_derived_subtotal_note: >
        tier_3's own name is book_derived, but only 26 of the 34 CL rows are.
        The other 8 sit under tier 3 structurally, as CL derivations, while
        emitting tier source_backed. Recorded so the tier-3 count is not read as
        a count of book-derived verdicts.
    tier_4: {count: 0, reason: "verdict is null by construction"}
    caveat: >
      Gold's and silver's counts are dominated by Moon nakshatra/navamsa
      ingresses, which are in scope as ANCHORS but which most rule groups will
      further condition on planet, sign, vedha or weekday. The realised verdict
      count will be far smaller. These are ceilings, not forecasts.

# ====================================================== source probability
# WHAT THIS BLOCK IS: the 2026 source's own probability labels, carried forward
# as PROVENANCE and as nothing else. It records which labels transfer, to what,
# and -- at length, because the populated count is tiny and the field is easy to
# misread -- what the field must never be used for.
#
# NO VERDICTS ARE GENERATED HERE. Nothing in build/astronomy_2027.json carries
# this field: tests/test_2027_astronomy.py::test_no_interpretation_leaked bans
# `source_probability` from the astronomy layer, and that ban STAYS. The field
# attaches to rule-layer verdicts, when a rule layer exists.
#
# Every count in this block was verified against data/source_2026.html
# (437578 bytes, md5 5e098446d6dd13d3df8443528db5dd95) and against
# build/astronomy_2027.json, and is locked by the harness -- see `asserted_by`
# at the foot of the block.
source_probability:
  status: annotation_layer_defined_no_verdicts_generated
  defined: 2026-09-13
  field: source_probability
  emitted_on_astronomy_records: false
  attaches_to: rule_layer_verdicts

  # -------------------------------------------------------------- description
  # REQUIRED READING BEFORE USING THE FIELD. This text exists so that a later
  # reader who meets a mostly-empty column does not draw the wrong conclusion
  # from its emptiness.
  description: >
    AN ANNOTATION, NOT A COMPUTABLE COLUMN. source_probability records that the
    2026 source asserted a likelihood for a named configuration, in the source's
    own words. It is populated on roughly 26 rows out of thousands -- 15
    astronomy records and about 11 rule-layer firings, against a Step-4
    denominator that runs into the thousands once the weekday and panchang
    families are written (12 weekday families alone produced 103 Mumbai and 119
    New York qualifying dates in 2026, and the source's rule catalogue holds 141
    sections). The populated share is under 1%.

    It is therefore NOT FILTERABLE, NOT WEIGHTABLE and NOT AGGREGABLE: no query
    may select on it, no scoring may weight by it, and no summary may average,
    rank or count over it. It carries NO CALIBRATION -- the source states no
    basis, no sample and no hit rate for any label, and the labels are shown
    below to be per-occurrence editorial judgements rather than properties of a
    rule (see headline_finding).

    THE REASON THIS IS WRITTEN HERE: a field this sparse looks like a field that
    failed to populate. It did not. 26 rows is the true and complete extent of
    what the source's label scheme transfers to 2027, measured rather than
    estimated. Sparsity here is the finding, not a defect, and must never be
    read as absence of signal or as missing data awaiting a backfill.

  # ---------------------------------------------- separation from `confidence`
  # The two fields are unrelated and must stay unrelated in code as well as in
  # documentation.
  not_a_confidence:
    separate_field: confidence
    confidence_value: untested              # labels.confidence_default
    confidence_raised_only_by: pre_registered_backtest
    no_derivation_in_either_direction: >
      source_probability MUST NOT feed confidence, and confidence MUST NOT be
      derived from source_probability. No code path may map one onto the other,
      in either direction, by any rule -- not as a default, not as a prior, not
      as a tie-break. A label with no stated basis, no sample and no hit rate
      cannot raise a confidence, and naming it confidence would import an
      authority the source never earned.
    why_the_name: >
      The field is named for what it is: the SOURCE's probability, as printed.
      The name states its provenance rather than its standing.

  # ------------------------------------------------------------ transfer test
  # All three must hold. Objective, not editorial; each was computed rather than
  # judged by reading.
  transfer_test:
    test_1_generic_configuration: >
      The block's title names a CONFIGURATION generically, not an instance.
      "Venus Combust in the East" transfers although its 2026 window is dated --
      the dates are that year's occurrence of a recurring rule. "Jupiter
      Vargottam in Gemini" and "Rahu in Dhanistha" do not: the sign or nakshatra
      binding IS the configuration.
    test_2_recurs_in_span: >
      The configuration actually recurs inside the generated span
      (01-Dec-2026 -> 01-Feb-2028 IST). Computed from build/astronomy_2027.json,
      never judged by reading.
    test_3_maps_to_a_catalogue: >
      The configuration maps to a rule family that exists. Evaluated against the
      union of BOTH catalogues -- see catalogues below. A label mapping to
      neither is an ORPHAN: recorded, never given a family of its own.
    catalogues:
      A:
        what: "the 20 emitted rule_family values in build/astronomy_2027.json"
        count: 20
      B:
        what: >
          the 141 Chapter-1 rule sections of data/source_2026.html -- every
          h3.section element in the document (142) except the Table of Contents
          heading. This is the catalogue Step 4's rule layer is being built FROM.
        count: 141
        carries_labels: 0
      union_rule: "a label passes test 3 if it maps into A or into B"
      # RULED 2026-09-13. Catalogue B counts.
      b_counts_ruling: >
        DECIDED: catalogue B counts for test 3. The 141 Chapter-1 sections are
        the rule catalogue Step 4 is being built from; excluding them because the
        astronomy layer has not reached them yet would make the answer depend on
        BUILD ORDER rather than on evidence. Pass count is 19. Under catalogue A
        alone it would have been 14, and the five co-location labels (blocks 13,
        26, 29, 42, 50) would have joined the orphan list.
    where_the_labels_live: >
      All 44 labels sit in prophecy blocks in the salient-features chapter, lines
      4335-4909 of data/source_2026.html. The monthly calendar carries none and
      the 141-section rule catalogue carries none, so there is no per-rule
      probability to inherit except through these blocks. Verified by line range,
      not by sampling.

  # ---------------------------------------------------------- classification
  classification:
    prophecy_blocks: 50
    labelled: 44
    unlabelled: 6
    passes: 19
    fails: 25
    fail_by_test:
      test_1_instance_bound: 12
      test_2_does_not_recur: 12
      test_3_orphan: 1
    arithmetic: "19 + 12 + 12 + 1 = 44"
    carried_families: 11
    # The pre-implementation report classified block 20 under test 2. The
    # no-split ruling below moves it to test 1, which is why test 1 reads 12 and
    # test 2 reads 12 rather than 11 and 13. Block 20 fails test 2 independently
    # as well; the ruling changes which test is NAMED, not whether it is excluded.
    reclassified_by_the_no_split_ruling: [20]

  # ----------------------------------------------------- the no-split ruling
  # RULED 2026-09-13. Applies to the two compound blocks, 10 and 20.
  no_split_ruling:
    blocks: [10, 20]
    decision: DO_NOT_SPLIT
    recorded_as: test_1_failures
    reason: >
      Splitting a block re-authors a source block into two blocks it did not
      write. The author labelled the COINCIDENCE of Venus Rise (01-Feb-2026) and
      Mercury Rise (04-Feb-2026) falling three days apart -- that pairing IS the
      configuration judged, and halving it invents two judgements out of one. The
      same holds for block 20, where the hemisphere turning and the Sun-Neptune
      conjunction are judged together, two days apart.
    halves_are_individually_generic: >
      Recorded because it is true and because it is the argument FOR splitting:
      each half of block 10 and of block 20 would pass test 1 on its own. That is
      not enough. A generic half is not evidence that the author labelled the
      half.
    consequence_left_latent: >
      Because block 10 is not split, visibility/rise Venus carries one label only
      (High, from block 46). The Reasonable that a split would have produced does
      not exist, so the rise-Venus conflict stays LATENT. We do not create it
      ourselves. See disputed_families.latent_not_created.

  # ------------------------------------------------ carried families and values
  # 11 distinct families receive a carried label. `keyed` states the key the
  # label attaches to -- load-bearing for the combust family, below.
  carried_families:

    - id: conj_sun_mercury
      family: "aspect/conjunction Sun-Mercury"
      catalogue: [A]
      blocks: [8, 17, 24, 31, 38, 48]
      value: [Reasonable, Good]
      disputed: true
      note: >
        Six blocks, two values: Reasonable x5, Good on the 04-Nov-2026 instance.
        The source prints no Sun-Mercury pair table, so this family passes test 3
        through catalogue A only.

    - id: conj_mercury_venus
      family: "aspect/conjunction Mercury-Venus"
      catalogue: [A, B]
      source_section: "Venus Mercury Conjunction p.16"
      blocks: [9, 14]
      value: [Reasonable, High]
      disputed: true
      note: "29-Jan-2026 Reasonable, 28-Feb-2026 High. Five weeks apart, same configuration."

    - id: conj_venus_uranus
      family: "aspect/conjunction Venus-Uranus"
      catalogue: [A, B]
      source_section: "Herschel Conjunction p.34"
      blocks: [23]
      value: High

    # ---- visibility/combust is KEYED PER BODY, not at family level ----------
    # RULED 2026-09-13, and the ruling is what keeps this out of the disputed
    # list. At family level visibility/combust carries Venus Reasonable, Saturn
    # High and Jupiter Good -- a three-way conflict. Per body it is three
    # families with one value each and no conflict at all. The source labels a
    # BODY's combustion, never "combustion"; family-level keying would be our
    # aggregation, not the source's claim.
    - id: combust_venus
      family: "visibility/combust"
      keyed: [rule_family, body]
      body: Venus
      catalogue: [A, B]
      source_section: "Venus Combust Rise Cycle p.14"
      blocks: [2, 44]
      value: Reasonable
      note: "Two blocks, SAME value. Agreement, not dispute."

    - id: combust_saturn
      family: "visibility/combust"
      keyed: [rule_family, body]
      body: Saturn
      catalogue: [A, B]
      source_section: "Saturn Combust Rise Cycle p.24"
      blocks: [18]
      value: High

    - id: combust_jupiter
      family: "visibility/combust"
      keyed: [rule_family, body]
      body: Jupiter
      catalogue: [A, B]
      source_section: "Jupiter Combust Rise Cycle p.20"
      blocks: [32]
      value: Good

    - id: rise_venus
      family: "visibility/rise"
      keyed: [rule_family, body]
      body: Venus
      catalogue: [A, B]
      source_section: "Venus Combust Rise Cycle p.14"
      blocks: [46]
      value: High
      note: "See no_split_ruling.consequence_left_latent."

    # ---- catalogue-B-only families: no emitted astronomy class matches them --
    - id: mercury_venus_alone
      family: "Mercury Venus Alone in Any Sign p.16"
      catalogue: [B]
      blocks: [26, 42]
      value: [Reasonable, High]
      disputed: true
      note: "THE HEADLINE PAIR. See headline_finding."

    - id: rahu_mars_together
      family: "Rahu Mars Together in Any Sign"
      catalogue: [B]
      blocks: [13]
      value: Reasonable

    - id: venus_jupiter_same_sign
      family: "Venus Jupiter in the Same Sign p.67"
      catalogue: [B]
      blocks: [29]
      value: High

    - id: mars_ahead_of_jupiter
      family: "Mars Ahead of Jupiter in Same Sign p.69"
      catalogue: [B]
      blocks: [50]
      value: High

  # ------------------------------------------------------- disputed families
  # RULED 2026-09-13. Where a family's blocks disagree, EMIT THE SET.
  disputed_families:
    count: 3
    of_carried: 11
    ids: [conj_sun_mercury, conj_mercury_venus, mercury_venus_alone]
    emit:
      source_probability: "the SET of values the source assigned, e.g. [Reasonable, Good]"
      source_probability_disputed: true
    never_collapse_to_one_value: >
      NOT min, NOT max, NOT mode, NOT first, NOT most-recent. Picking one
      manufactures an agreement the source never expressed. The set is the honest
      record and is trivially filterable; a single value would be a claim we were
      making on the source's behalf.
    why_not_per_occurrence_instead: >
      The alternative -- attach the label to the 2026 occurrence rather than to
      the rule -- is incoherent here: a 2027 occurrence then has no occurrence to
      inherit from, and the whole premise of the transfer is that the label
      attaches to a repeatable rule.
    latent_not_created:
      family: rise_venus
      would_be: [Reasonable, High]
      status: LATENT_AND_LEFT_LATENT
      reason: >
        This conflict exists only if block 10 is split into its Venus-Rise and
        Mercury-Rise halves. It is not split (see no_split_ruling), so the
        conflict does not exist and we do not create it. Recorded so that anyone
        who later argues for splitting knows exactly what splitting would cost.
    not_disputed_because_keyed_per_body:
      family: "visibility/combust"
      family_level_values: [Reasonable, High, Good]
      per_body_values: {Venus: Reasonable, Saturn: High, Jupiter: Good}
      see: "carried_families.combust_venus and the ruling comment above it"

  # ---------------------------------------------------------- HEADLINE FINDING
  # This is the ground for every ruling in this block. It is stated here, in the
  # config, and again in build/STEP4_DECISIONS.md, because every constraint above
  # follows from it and none of them makes sense without it.
  headline_finding:
    what: >
      THE TWO "Mercury Venus Alone in Any Sign" BLOCKS CARRY CHARACTER-IDENTICAL
      PROPHECY TEXT AND DIFFERENT LABELS. Block 26 (02-Jun to 08-Jun-2026, p.240)
      is labelled REASONABLE; block 42 (26-Sep to 17-Oct-2026, p.259) is labelled
      HIGH. Both print, character for character: "Whenever Mercury Venus are
      alone in any sign without any other Planet(s), Markets are sluggish." Only
      the dates and the remarks differ. The rule does not.
    verified: >
      Independently verified against data/source_2026.html by re-parsing all 50
      prophecy blocks and grouping them by exact prophecy string: 50 blocks, 44
      labelled, and the two blocks' prophecy strings compare equal.
    what_it_establishes: >
      The labels are PER-OCCURRENCE EDITORIAL JUDGEMENTS, not properties of a
      rule. Where the rule text is identical and only the date changes, the label
      still moves. Carrying such a label as a rule-level field asserts a
      stability the source does not have -- which is why the field is an
      annotation (see description), why disputes are emitted as sets rather than
      resolved (see disputed_families), and why the field may never feed
      confidence (see not_a_confidence).
    two_further_identical_text_groups:
      - blocks: [17, 24, 31, 38, 48]
        rule: "Sun Mercury Conjunction is a high vibration time and a Major Turning Date."
        labels: "Reasonable x4, Good x1 (block 48)"
        note: >
          Five blocks whose prophecy text is identical character for character.
          Block 8 is the sixth Sun-Mercury block and carries the same first
          sentence plus one extra clause, so it is not in this exact-match group;
          it is Reasonable, and it is counted in the family above.
      - blocks: [34, 49]
        rule: "Mercury Manifestation is a major Turning date."
        labels: "Reasonable (block 34), Good (block 49)"
        note: >
          Both are excluded by test 2 -- Mercury Manifestation is not an emitted
          class -- so this pair changes nothing downstream. It is recorded
          because it is a third independent instance of the same behaviour.
    strength_of_the_evidence: >
      Three groups of blocks in the document share character-identical prophecy
      text, and ALL THREE disagree with themselves on the label -- the two above
      plus the headline pair. Every repeated rule text in the document is
      labelled inconsistently; there is no counter-example. The finding does not
      rest on the single pair, and the earlier wording "two of the three"
      understated it.

  # --------------------------------------------------------- the six unlabelled
  # Evidence about the label scheme, and it belongs beside the disputed-family
  # finding rather than in a footnote.
  unlabelled_blocks:
    count: 6
    blocks:
      11: "Solar Eclipse"
      15: "Moon Eclipse"
      35: "Solar Eclipse"
      37: "Mutual Vedh of Jupiter in Ashlesha and Ketu in Magha"
      39: "Moon Eclipse"
      47: "Mutual Vedh of Mars in Ashlesha and Ketu in Magha"
    finding: >
      FOUR OF THE SIX ARE THE FOUR ECLIPSE BLOCKS -- every eclipse block in the
      document is unlabelled -- although eclipses are impact tier T1, the highest
      tier this config defines. A systematic scheme would have labelled its own
      top-tier events first. That absence is itself evidence that the labels are
      EDITORIAL rather than systematic, and it corroborates the headline finding
      from the opposite direction: the headline shows the labels moving where the
      rule does not; this shows them missing where the impact is greatest.
    consequence: >
      eclipse/solar and eclipse/lunar inherit no source_probability at all. Their
      verdicts carry the field ABSENT, not null-because-unknown.

  # ------------------------------------------------------------------ orphans
  orphans:
    count: 1
    mars_tenth_to_saturn:
      block: 4
      title: "Mars (Sagittarius) Tenth to Saturn"
      label: High
      failed_test: test_3_no_rule_family
      do_not_create_a_family: >
        RULED 2026-09-13. Recorded as an orphan; no rule family is created for
        it. Inventing a relative-house family to receive one label would build
        the catalogue around the annotation instead of the other way round.
      recurs_in_span: true
      recurrence_2027: "18-Nov-2027 -> 27-Dec-2027, 39 days -- Mars in Sagittarius, 10th from Saturn in Pisces"
      recurrence_verified_from: build/astronomy_2027.json
      explicitly_repeatable: >
        The source states the rule generically -- "Whenever Mars comes 10th to
        Saturn in transit" -- so this is a genuine rule with no home, not a
        one-off observation.
      first_in_line: >
        If a relative-house family is ever added to the catalogue, this is the
        first candidate: it passes tests 1 and 2 outright and fails only for want
        of a family to attach to.

  # --------------------------------------------------------------- exclusions
  exclusions:
    saturn_neptune_conjunction:
      label: "Intense and High Reliable"
      source_block: "Event of the Year -- 2026, Saturn Neptune Conjunction, pg. 211-213"
      excluded_by: transfer_test_2_recurrence
      reason: >
        The configuration does not recur in the generated span. Zero
        Saturn-Neptune conjunction records exist in build/astronomy_2027.json
        across 01-Dec-2026 -> 01-Feb-2028 IST; the pair's synodic period is
        ~36 years. The exclusion follows from the recurrence test alone and
        required no editorial judgement.
      note: >
        Independently, this is the block whose 2026 instant the source prints
        12h42m wrong (STEP3_REPORT section 6.1). The label was assigned to an
        event the source had mis-timed. That is not the ground of exclusion --
        test 2 excludes it on its own -- but it is recorded here because the
        source's single highest label sits on its single largest verified
        defect, and that bears on how much authority the label scheme is owed.

  # ------------------------------------------------------------ scale collapse
  scale_collapse:
    defined_buckets: 6                      # labels.source_probability_map
    survive_transfer: 3
    surviving: [Reasonable, Good, High]
    usable_range_after_transfer: "2-4 of the 1-5 map"
    excluded_values:
      Low: {blocks: [16], count: 1}
      "Very High": {blocks: [12, 21], count: 2}
      "Intense and High Reliable": {blocks: [1], count: 1}
    finding: >
      Both extremes of the scale are lost. Every Low, every Very High and the
      single Intense and High Reliable fails the transfer test -- the Low on test
      1 (Mars Vedh of Pushya: nakshatra-bound), the two Very Highs and the Intense
      and High Reliable on test 2. The source's STRONGEST claims all sit on
      once-in-decades configurations -- a Saturn-Neptune conjunction, a
      Saturn-Mars conjunction, a Mars-twelfth-to-Saturn window -- which is
      entirely coherent editorially (the rarest configuration is the most
      newsworthy) and useless for transfer (the rarest configuration is the one
      least likely to recur next year).
    consequence: >
      The carried field's range is Reasonable / Good / High only. A consumer must
      not read "no Very High in 2027" as a claim about 2027; it is a fact about
      which 2026 blocks survived a recurrence test.

  # -------------------------------------------------- projected population
  # THE EXACT COUNTS THE HARNESS ASSERTS. A field this sparse will otherwise
  # drift invisibly: if a later change populates 400 rows or zero, that must fail
  # loudly rather than pass quietly.
  projected_population:
    basis: "build/astronomy_2027.json, 1569 records, 01-Dec-2026 -> 01-Feb-2028 IST"
    astronomy_records_total: 15
    astronomy_records_by_family:
      conj_sun_mercury: 7
      conj_mercury_venus: 3
      conj_venus_uranus: 1
      combust_venus: 1
      combust_saturn: 1
      combust_jupiter: 1
      rise_venus: 1
    all_15_fall_in_ist_civil_2027: true
    pct_of_astronomy_layer: 0.96
    rule_layer_firings_total: 11
    rule_layer_firings_by_family:
      mercury_venus_alone: 5
      rahu_mars_together: 2          # 1 same-sign window + 1 same-nakshatra window
      venus_jupiter_same_sign: 1
      mars_ahead_of_jupiter: 3
    combined_total: 26
    computed_windows_2027:
      mercury_venus_alone: ["01-Dec-2026 Libra", "21-Mar-2027 Aquarius", "17-Jul-2027 Gemini",
                            "09-Sep-2027 Virgo", "08-Oct-2027 Libra"]
      rahu_mars_together: ["same sign 27-Dec-2027 -> 01-Feb-2028 Capricorn",
                           "same nakshatra 23-Dec-2027 -> 09-Jan-2028 Uttara Ashadha"]
      venus_jupiter_same_sign: ["16-Aug-2027 -> 09-Sep-2027 Leo"]
      mars_ahead_of_jupiter: ["01-Dec-2026 -> 25-Jan-2027 Leo", "10-Mar-2027 -> 26-Apr-2027 Cancer",
                              "26-Jun-2027 -> 05-Jul-2027 Leo"]
      mars_ahead_verified: >
        Mars is ahead of Jupiter in longitude at the start, midpoint and end of
        all three shared-sign windows, so block 50 (ahead) fires three times and
        block 41 (behind) fires zero times. That is why block 41 is a test-2
        failure and block 50 is a pass: the pair is decided by computation, not by
        reading.
    denominator_note: >
      1569 is the most favourable denominator available. The Step-4 verdict layer
      adds the weekday and panchang families and the 141-section catalogue, so the
      real denominator runs into the thousands and the populated share lands below
      1%. Stated plainly rather than buried: this is a small minority, and it is
      small enough that the field's only honest use is as provenance on about 26
      specific rows.

  # ------------------------------------------------------ corrections on record
  # Claims made while this layer was being scoped that did not survive checking.
  # Recorded rather than silently repaired, to the same standard as
  # rulership.corrections_on_record.
  corrections_on_record:

    - id: label_count_45_vs_44
      claimed: "There are 45 probability labels in the source."
      attributed_to: user_prompt
      status: corrected
      corrected_to: >
        44. All 44 are probability spans inside div.prophecy-block, lines
        4335-4909. The likely 45th is line 4971, a div.summary in the January
        calendar reading "PROBABILITY OF POSITIVITY TILL 21ST JANUARY, THEREAFTER
        NEGATIVE TILL 29TH JANUARY" -- narrative prose, no probability class, no
